<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Your Peakabu code</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0a1611; --card:#0f2318; --card-soft:#0c1c14; --border:#1e3527; --teal:#39d3a0; --text:#e8f5ec; --text-dim:#8fbfa3; --text-muted:#5f7a6a; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font:16px/1.5 'Work Sans',sans-serif; display:grid; place-items:center; min-height:100vh; padding:16px; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px; max-width:440px; width:100%; text-align:center; }
  h2{ font-family:'Jost',sans-serif; margin:0 0 6px; }
  .code{ font:600 26px 'JetBrains Mono',monospace; letter-spacing:1px; background:var(--card-soft); border-radius:10px; padding:14px; margin:16px 0; user-select:all; word-break:break-all; }
  button{ background:var(--teal); color:#062015; border:0; border-radius:10px; padding:11px 16px; font:600 15px 'Work Sans',sans-serif; cursor:pointer; }
  input{ width:100%; background:var(--card-soft); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px; font:inherit; margin:8px 0; }
  p{ color:var(--text-dim); }
  .note{ font-size:13px; color:var(--text-muted); }
  .send{ border-top:1px solid var(--border); margin-top:20px; padding-top:16px; text-align:left; }
</style>
</head>
<body>
<div class="card" id="box"><p>Confirming your payment…</p></div>
<script>
(function () {
  var sid = new URLSearchParams(location.search).get('session_id');
  var box = document.getElementById('box');
  var emailEnabled = false, tries = 0;
  var cfg = fetch('/api/billing/config').then(function (r) { return r.json(); }).then(function (c) { emailEnabled = !!c.emailEnabled; }).catch(function () {});

  // Same sign-in the rest of peakabu.app uses (site.js, key pa_browser_auth).
  function signedIn() {
    try { var a = JSON.parse(localStorage.getItem('pa_browser_auth') || 'null'); return a && a.token && a.username ? a : null; } catch (e) { return null; }
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function render(j) {
    var codes = j.codes && j.codes.length ? j.codes : [j.code];
    var many = codes.length > 1;
    var what = j.product === 'sub'
      ? 'Your code for ' + j.label + ' ($' + (j.cents / 100).toFixed(2) + '/month):'
      : j.product === 'mobile'
      ? (many ? 'Your ' + codes.length + ' Peakabu Mobile codes (' + j.days + ' days each):' : 'Your ' + j.days + '-day Peakabu Mobile code:')
      : (many ? 'Your ' + codes.length + ' event passes' : 'Your event pass') + ' (' + j.hours + 'h from ' + new Date(j.startsAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) + '):';
    var auth = signedIn();
    box.innerHTML = '<h2>Payment received</h2><p>' + esc(what) + '</p><div class="code">' + codes.map(esc).join('<br>') + '</div>' +
      (auth ? '<button id="addBtn">' + (many ? 'Use one on my account (' : 'Add to my account (') + esc(auth.username) + ')</button> <div id="addMsg" class="note" style="margin:8px 0"></div>' : '') +
      '<button id="cp"' + (auth ? ' style="background:transparent;color:var(--teal);border:1px solid var(--teal)"' : '') + '>' + (many ? 'Copy all codes' : 'Copy code') + '</button>' +
      (many ? '<p>Each code is single use, so you can give them to different people. Whoever redeems a code first gets it. If you were signed in when you bought them, they\u2019re also under <a href="/account#codes" style="color:var(--teal)">My codes</a>.</p>' : '') +
      (j.product === 'sub' ? '<p>Redeeming it links this subscription to your Peakabu account. It renews every month until you cancel, which you can do any time on your <a href="/account" style="color:var(--teal)">account page</a>. You keep the plan until the end of the month you paid for.</p>' : '') +
      '<p>' + (auth ? 'Or sign in on another device' : 'Sign in to your Peakabu account') + ' and redeem it, in the PC client under Redeem, on the <a href="/pricing#redeem" style="color:var(--teal)">pricing page</a>, or on the Mobile host page.' +
      (j.product === 'event' ? ' Then pick the pass when you start a Mobile session to bring your Swing cards to life.' : '') +
      ' <b>Save it now.</b> Unless you email it to yourself, this page is the only copy.</p>' +
      (emailEnabled ? '<div class="send"><b>' + (many ? 'Email me these codes' : 'Email me this code') + '</b><input type="email" id="em" autocomplete="email" placeholder="you@example.com">' +
        '<button id="emBtn">Send</button> <span id="emMsg" class="note"></span>' +
        '<div class="note">Used once to send this code. Not saved or used for anything else.</div></div>' : '');
    document.getElementById('cp').onclick = function (e) { navigator.clipboard.writeText(codes.join('\n')); e.target.textContent = 'Copied'; };
    // Signed in on this browser already: redeem in one tap, no email needed.
    var add = document.getElementById('addBtn');
    if (add) add.onclick = async function () {
      var msg = document.getElementById('addMsg');
      add.disabled = true; msg.textContent = 'Adding…';
      var r = await fetch('/auth/redeem', { method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + auth.token },
        body: JSON.stringify({ code: codes[0] }) });
      var k = await r.json().catch(function () { return {}; });
      if (r.ok) { msg.textContent = (k.message || 'Added to your account.') + (many ? ' (Used ' + codes[0] + '; the rest are yours to give.)' : ''); add.textContent = 'Added'; return; }
      msg.textContent = r.status === 401 ? 'Your sign-in expired. Sign in again on the account page, or copy the code.' : (k.error || 'Couldn’t add it. Copy the code instead.');
      add.disabled = false;
    };
    var b = document.getElementById('emBtn');
    if (b) b.onclick = async function () {
      var msg = document.getElementById('emMsg');
      b.disabled = true; msg.textContent = 'Sending…';
      var r = await fetch('/api/billing/session/' + encodeURIComponent(sid) + '/email', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('em').value })
      });
      var k = await r.json().catch(function () { return {}; });
      msg.textContent = r.ok ? 'Sent. Check your inbox (and spam).' : (k.error || 'Couldn’t send. Copy the code instead.');
      b.disabled = false;
    };
  }

  async function poll() {
    try {
      var j = await (await fetch('/api/billing/session/' + encodeURIComponent(sid))).json();
      if (j.status === 'ready' && j.code) return render(j);
    } catch (e) {}
    if (++tries < 30) setTimeout(poll, 2000);
    else box.innerHTML = '<p>Still confirming. Refresh this page in a minute. Your payment is safe.</p>';
  }
  if (sid) cfg.then(poll); else box.innerHTML = '<p>Missing checkout session.</p>';
})();
</script>
</body>
</html>
