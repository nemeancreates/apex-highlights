<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peak-Abu — Set New Password</title>
<style>
  :root{
    --bg:#0a1611; --card:#0f2318; --card-soft:#0c1c14;
    --border:#1e3527; --border-soft:#24402e;
    --teal:#39d3a0; --teal-dim:#1d9e75;
    --text:#e8f5ec; --text-dim:#8fbfa3; --text-muted:#5f7a6a;
    --rose:#f0a5bd;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text-dim); font-family:'Segoe UI',Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:36px 32px; max-width:400px; width:100%;
  }
  h1{ color:var(--text); font-size:20px; font-weight:600; margin-bottom:8px; text-align:center; }
  p.sub{ font-size:13px; text-align:center; margin-bottom:24px; }
  label{ font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:6px; }
  input{
    width:100%; padding:11px 12px; background:var(--card-soft); color:var(--text);
    border:1px solid var(--border-soft); border-radius:7px; font-size:15px; margin-bottom:14px;
  }
  input:focus{ border-color:var(--teal); outline:none; }
  button{
    width:100%; padding:14px; background:var(--teal-dim); color:#04140d; border:none;
    border-radius:9px; font-size:15px; font-weight:600; cursor:pointer; box-shadow:0 0 0 1px var(--teal);
    transition:background .15s;
  }
  button:hover{ background:var(--teal); }
  button:disabled{ opacity:0.6; cursor:not-allowed; }
  .msg{ font-size:13px; margin-top:14px; text-align:center; display:none; }
  .msg.error{ color:var(--rose); }
  .msg.success{ color:var(--teal); }
  .center{ text-align:center; }
</style>
</head>
<body>
  <div class="card" id="formCard">
    <h1>Set a new password</h1>
    <p class="sub">This link is valid for 15 minutes and can only be used once.</p>
    <form id="resetForm" onsubmit="return submitReset(event)">
      <label>New Password</label>
      <input type="password" id="newPassword" required minlength="8" maxlength="128" />
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" required minlength="8" maxlength="128" />
      <button type="submit" id="submitBtn">Set New Password</button>
      <div class="msg error" id="errorMsg"></div>
    </form>
  </div>
  <div class="card center" id="successCard" style="display:none;">
    <h1>✅ Password updated</h1>
    <p class="sub">You can now open Peak-Abu and log in with your new password.</p>
  </div>
  <div class="card center" id="invalidCard" style="display:none;">
    <h1>Link expired</h1>
    <p class="sub">This reset link is missing or invalid. Go back and start the recovery process again.</p>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    if (!token) {
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('invalidCard').style.display = 'block';
    }

    async function submitReset(e) {
      e.preventDefault();
      var pw = document.getElementById('newPassword').value;
      var confirm = document.getElementById('confirmPassword').value;
      var err = document.getElementById('errorMsg');
      var btn = document.getElementById('submitBtn');
      err.style.display = 'none';

      if (pw !== confirm) {
        err.textContent = 'Passwords do not match.';
        err.style.display = 'block';
        return false;
      }
      if (pw.length < 8) {
        err.textContent = 'Password must be at least 8 characters.';
        err.style.display = 'block';
        return false;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';
      try {
        var res = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, newPassword: pw })
        });
        var data = await res.json();
        if (!res.ok) {
          err.textContent = data.error || 'Could not reset password.';
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Set New Password';
          return false;
        }
        document.getElementById('resetForm').parentElement.style.display = 'none';
        document.getElementById('successCard').style.display = 'block';
      } catch (e2) {
        err.textContent = 'Could not reach the server. Try again.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Set New Password';
      }
      return false;
    }
  </script>
</body>
</html>
