<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peak-Abu — Forgot Password</title>
<style>
  :root{
    --bg:#0a1611; --card:#0f2318; --card-soft:#0c1c14;
    --border:#1e3527; --border-soft:#24402e;
    --teal:#39d3a0; --teal-dim:#1d9e75;
    --text:#e8f5ec; --text-dim:#8fbfa3; --text-muted:#5f7a6a;
    --rose:#f0a5bd;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text-dim); font-family:'Segoe UI',Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:36px 32px; max-width:400px; width:100%; text-align:center;
  }
  .icon{ font-size:36px; margin-bottom:14px; }
  h1{ color:var(--text); font-size:20px; font-weight:600; margin-bottom:10px; }
  p{ font-size:14px; line-height:1.6; margin-bottom:26px; }
  button{
    width:100%; padding:14px; background:#5865F2; color:#fff; border:none;
    border-radius:9px; font-size:15px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:background .15s;
  }
  button:hover{ background:#6b76f5; }
  button:disabled{ opacity:0.6; cursor:not-allowed; }
  .note{ margin-top:18px; font-size:12px; color:var(--text-muted); }
  .error{ color:var(--rose); font-size:13px; margin-top:14px; display:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>Reset your password</h1>
    <p>Peak-Abu doesn't collect email addresses — password recovery works through your linked Discord account instead. You'll need to have linked Discord from Settings in the app first.</p>
    <button id="startBtn" onclick="startRecovery()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.076.076 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
      Continue with Discord
    </button>
    <div class="error" id="errorMsg"></div>
    <div class="note">Not linked? Open Peak-Abu → Settings → Connect Discord first, then come back here.</div>
  </div>
  <script>
    async function startRecovery() {
      var btn = document.getElementById('startBtn');
      var err = document.getElementById('errorMsg');
      btn.disabled = true;
      err.style.display = 'none';
      try {
        var res = await fetch('/auth/discord/recover-url');
        var data = await res.json();
        if (!res.ok) {
          err.textContent = data.error || 'Could not start recovery. Try again shortly.';
          err.style.display = 'block';
          btn.disabled = false;
          return;
        }
        window.location.href = data.url;
      } catch (e) {
        err.textContent = 'Could not reach the server. Check your connection and try again.';
        err.style.display = 'block';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
