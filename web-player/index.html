<!DOCTYPE html>
<html>
<head>
  <title>Peak-Abu – Multi-POV Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      color: #eee;
      font-family: 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #1a1a2e;
      border-bottom: 2px solid #e94560;
      flex-shrink: 0;
      height: 50px;
    }

    .header h1 { color: #e94560; font-size: 20px; }

    .join-bar { display: flex; gap: 8px; align-items: center; }

    .join-bar input {
      padding: 6px 12px;
      background: #0f3460;
      color: #eee;
      border: 1px solid #e94560;
      border-radius: 6px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 3px;
      width: 130px;
      text-align: center;
    }

    .join-bar input::placeholder { color: #556; text-transform: none; letter-spacing: normal; }

    .btn {
      padding: 6px 16px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { background: #c73652; }
    .btn:disabled { background: #555; cursor: not-allowed; }
    .btn-small { padding: 4px 10px; font-size: 12px; }
    .btn-secondary { background: #0f3460; border: 1px solid #e94560; }
    .btn-secondary:hover { background: #1a4a8a; }

    .main-layout { display: flex; flex: 1; min-height: 0; }

    .video-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 2px solid #1a1a2e;
    }

    .video-grid {
      flex: 1;
      display: grid;
      gap: 3px;
      padding: 3px;
      overflow-y: auto;
      min-height: 0;
    }

    .video-grid::-webkit-scrollbar { width: 6px; }
    .video-grid::-webkit-scrollbar-track { background: #111; }
    .video-grid::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    .grid-1 { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
    .grid-5, .grid-6 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-7, .grid-8, .grid-9 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-10plus { grid-template-columns: 1fr 1fr 1fr 1fr; }

    .video-grid.focused-mode { display: flex; flex-direction: column; gap: 0; padding: 0; }

    .focused-main { flex: 1; min-height: 60%; position: relative; background: #000; }
    .focused-main video { width: 100%; height: 100%; object-fit: contain; }

    .focused-sidebar {
      height: 25%;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 3px;
      padding: 3px;
      background: #111;
      flex-shrink: 0;
    }

    .focused-sidebar::-webkit-scrollbar { height: 6px; }
    .focused-sidebar::-webkit-scrollbar-track { background: #111; }
    .focused-sidebar::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    .focused-sidebar .pov-container { min-width: 180px; height: 100%; cursor: pointer; }

    .pov-container {
      position: relative;
      background: #111;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }
    .pov-container:hover { border-color: #e94560; }
    .pov-container.active { border-color: #e94560; }

    .pov-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    .pov-label {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(233, 69, 96, 0.85);
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      z-index: 2;
      pointer-events: none;
    }

    /* Lazy-load placeholder */
    .pov-placeholder {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      color: #555;
      font-size: 13px;
      gap: 8px;
      cursor: pointer;
    }

    .pov-placeholder .play-icon {
      font-size: 32px;
      color: #e94560;
      opacity: 0.6;
    }

    .pov-placeholder .load-hint {
      font-size: 11px;
      color: #444;
    }

    .pov-loading {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      color: #e94560;
      font-size: 13px;
    }

    .playback-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #1a1a2e;
      border-top: 1px solid #2a2a4e;
      flex-shrink: 0;
    }

    .timeline {
      flex: 1;
      height: 6px;
      background: #333;
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .timeline-progress {
      height: 100%;
      background: #e94560;
      border-radius: 3px;
      width: 0%;
      pointer-events: none;
    }

    .time-display { font-size: 12px; color: #aaa; min-width: 90px; text-align: center; }

    .right-panel {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #12122a;
      border-left: 2px solid #1a1a2e;
    }

    .panel-section { padding: 10px; }

    .panel-section h3 {
      color: #e94560;
      font-size: 13px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .members-section { flex: 1; overflow-y: auto; border-bottom: 1px solid #2a2a4e; }
    .members-section::-webkit-scrollbar { width: 5px; }
    .members-section::-webkit-scrollbar-track { background: #111; }
    .members-section::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    .member-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
      font-size: 13px;
    }
    .member-row:hover { background: #1a1a3e; }
    .member-row.active { background: #e94560; color: white; }

    .member-dot { width: 8px; height: 8px; border-radius: 50%; background: #44ff88; flex-shrink: 0; }
    .member-dot.unloaded { background: #555; }

    .member-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .member-badge {
      font-size: 10px;
      color: #888;
      background: #1a1a3e;
      padding: 2px 5px;
      border-radius: 3px;
    }

    .audio-section { max-height: 220px; overflow-y: auto; border-top: 1px solid #2a2a4e; }
    .audio-section::-webkit-scrollbar { width: 5px; }
    .audio-section::-webkit-scrollbar-track { background: #111; }
    .audio-section::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    .audio-row { padding: 4px 8px; }

    .audio-row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 5px 0;
      font-size: 13px;
    }
    .audio-row-header:hover { color: #e94560; }

    .audio-arrow { font-size: 10px; transition: transform 0.2s; color: #888; }
    .audio-arrow.open { transform: rotate(90deg); }

    .audio-dropdown { display: none; padding: 6px 0 6px 8px; }
    .audio-dropdown.open { display: block; }

    .audio-control-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 4px;
    }
    .audio-control-row label { width: 50px; flex-shrink: 0; }
    .audio-control-row input[type="range"] { flex: 1; accent-color: #e94560; height: 4px; }

    .mute-btn {
      background: none;
      border: 1px solid #555;
      color: #aaa;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
    }
    .mute-btn:hover { border-color: #e94560; color: #e94560; }
    .mute-btn.muted { background: #e94560; color: white; border-color: #e94560; }

    .export-bar {
      height: 140px;
      flex-shrink: 0;
      background: #16213e;
      border-top: 2px solid #e94560;
      display: flex;
      flex-direction: column;
    }

    .export-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid #2a2a4e;
    }

    .export-header h3 { color: #e94560; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }

    .export-actions { display: flex; gap: 8px; }

    .export-timeline {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 8px 16px;
      overflow-x: auto;
      gap: 6px;
    }

    .export-timeline::-webkit-scrollbar { height: 6px; }
    .export-timeline::-webkit-scrollbar-track { background: #111; }
    .export-timeline::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    .export-clip {
      min-width: 120px;
      height: 70px;
      background: #0f3460;
      border: 1px solid #2a2a5e;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s;
      padding: 4px 8px;
      text-align: center;
    }
    .export-clip:hover { border-color: #e94560; }
    .export-clip.selected { border-color: #e94560; background: #1a3a6e; }
    .export-clip-name { color: #e94560; font-weight: bold; margin-bottom: 2px; }
    .export-clip-duration { color: #888; font-size: 10px; }

    .composite-section {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #2a2a4e;
      flex-shrink: 0;
    }

    .composite-status {
      font-size: 12px;
      color: #888;
      flex: 1;
    }

    .composite-status.ready { color: #44ff88; }
    .composite-status.processing { color: #e9a820; }
    .composite-status.failed { color: #ff4444; }

    .progress-bar {
      width: 140px;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-fill {
      height: 100%;
      background: #e9a820;
      border-radius: 3px;
      width: 0%;
      transition: width 0.3s;
      animation: indeterminate 1.5s infinite;
    }

    @keyframes indeterminate {
      0% { width: 20%; margin-left: 0%; }
      50% { width: 40%; margin-left: 40%; }
      100% { width: 20%; margin-left: 80%; }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #444;
      font-size: 16px;
      gap: 10px;
    }
    .empty-state .monkey { font-size: 48px; }

    .share-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: #0f3460;
      border-radius: 6px;
      margin-left: 12px;
      max-width: 320px;
    }

    .share-url {
      flex: 1;
      font-size: 12px;
      color: #aaa;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
    }

    .btn-copy {
      background: none;
      border: 1px solid #e94560;
      color: #e94560;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-copy:hover { background: #e94560; color: white; }
    .btn-copy.copied { background: #44ff88; border-color: #44ff88; color: #000; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🙈 Peak-Abu Player</h1>
    <div style="display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;">
      <div class="share-bar" id="shareBar" style="display:none;">
        <span class="share-url" id="shareUrl"></span>
        <button class="btn-copy" id="copyBtn" onclick="copyShareLink()">📋 Copy Link</button>
      </div>
      <div class="join-bar">
        <input type="text" id="sessionInput" placeholder="Session code" maxlength="6" />
        <button class="btn" onclick="loadSession()">Load Session</button>
      </div>
    </div>
  </div>

  <div class="main-layout">

    <div class="video-area">
      <div class="video-grid" id="videoGrid">
        <div class="empty-state">
          <div class="monkey">🙈</div>
          <div>Enter a session code to watch multi-POV highlights</div>
        </div>
      </div>

      <div class="playback-controls" id="playbackControls" style="display: none;">
        <button class="btn btn-small" id="playPauseBtn" onclick="togglePlayPause()">▶</button>
        <div class="timeline" id="timeline" onclick="seekTo(event)">
          <div class="timeline-progress" id="timelineProgress"></div>
        </div>
        <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
      </div>
    </div>

    <div class="right-panel" id="rightPanel" style="display: none;">
      <div class="members-section panel-section">
        <h3>Players</h3>
        <div id="memberList"></div>
      </div>
      <div class="audio-section panel-section">
        <h3>Audio</h3>
        <div id="audioControls"></div>
      </div>
    </div>
  </div>

  <div class="export-bar" id="exportBar" style="display: none;">
    <div class="export-header">
      <h3>Export Studio</h3>
      <div class="export-actions">
        <button class="btn btn-small btn-secondary" onclick="selectAllClips()">Select All</button>
        <button class="btn btn-small btn-secondary" onclick="deselectAllClips()">Deselect All</button>
        <button class="btn btn-small btn-secondary" onclick="downloadSelected()">⬇ Download Individual</button>
        <button class="btn btn-small" id="compositeBtn" onclick="startComposite()" disabled>🎬 Export Combined View</button>
      </div>
    </div>
    <div class="export-timeline" id="exportTimeline"></div>
    <div class="composite-section" id="compositeSection" style="display:none;">
      <div class="composite-status" id="compositeStatus"></div>
      <div class="progress-bar" id="compositeProgressBar" style="display:none;">
        <div class="progress-fill" id="compositeFill"></div>
      </div>
    </div>
  </div>

  <script>
    // Auto-load session from URL param (e.g. /player?code=ABC123)
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      if (code) {
        document.getElementById('sessionInput').value = code.toUpperCase();
        loadSession();
      }
    });

    let videos = [];
    let isPlaying = false;
    let masterDuration = 0;
    let animFrameId = null;
    let focusedIndex = -1;
    let selectedExportClips = new Set();
    let expectedClips = 0;
    let currentSessionCode = null;
    let compositeJobId = null;
    let compositePollInterval = null;

    // ========================
    // SESSION LOADING
    // ========================

    async function loadSession() {
      const code = document.getElementById('sessionInput').value.trim().toUpperCase();
      if (!code || code.length < 4) { alert('Enter a valid session code'); return; }

      try {
        const sessionRes = await fetch(`/sessions/${code}`);
        if (!sessionRes.ok) { alert('Session not found'); return; }

        const uploadsRes = await fetch(`/sessions/${code}/uploads`);
        const uploadsData = await uploadsRes.json();

        if (!uploadsData.uploads || uploadsData.uploads.length === 0) {
          alert('No uploads in this session yet');
          return;
        }

        videos = [];
        focusedIndex = -1;
        currentSessionCode = code;
        expectedClips = session.members ? session.members.length : 0;

        // Build video entries WITHOUT setting src yet (lazy load)
        for (const upload of uploadsData.uploads) {
          let metadata = null;
          if (upload.metadataFile) {
            try {
              const metaRes = await fetch(`/media/${code}/${upload.metadataFile}`);
              if (metaRes.ok) metadata = await metaRes.json();
            } catch (e) {
              console.log('Could not load metadata for', upload.username);
            }
          }

          // Create video element but DO NOT set src yet
          const video = document.createElement('video');
          video.preload = 'none';
          video.muted = true;
          video.playsInline = true;

          videos.push({
            element: video,
            metadata: metadata,
            username: upload.username,
            uploadId: upload.id,
            videoFile: upload.videoFile,
            videoSrc: `/media/${code}/${upload.videoFile}`,
            thumbnailSrc: upload.thumbnailFile ? `/media/${code}/${upload.thumbnailFile}` : null,
            offset: 0,
            volume: 80,
            isMuted: true,
            loaded: false   // track whether src has been set
          });
        }

        // Always load the first POV immediately
        if (videos.length > 0) {
          await loadPOV(0, true);
        }

        calculateOffsets();

        // Get duration from first loaded video
        masterDuration = (videos[0]?.element.duration || 0) + (videos[0]?.offset || 0);

        renderVideoGrid();
        renderMemberList();
        renderAudioControls();
        renderExportTimeline();
        updateCompositeButton();
        showShareLink(code);

        document.getElementById('playbackControls').style.display = 'flex';
        document.getElementById('rightPanel').style.display = 'flex';
        document.getElementById('exportBar').style.display = 'flex';

        console.log(`Loaded session ${code} — ${videos.length} POVs (1 loaded, ${videos.length - 1} lazy)`);

      } catch (err) {
        alert('Error loading session: ' + err.message);
        console.error(err);
      }
    }

    // Load a single POV on demand
    async function loadPOV(index, isFirst = false) {
      const v = videos[index];
      if (v.loaded) return; // already loaded

      v.loaded = true;

      // Show loading state in grid
      const container = document.getElementById('pov-container-' + index);
      if (container) {
        const placeholder = container.querySelector('.pov-placeholder, .pov-loading');
        if (placeholder) {
          placeholder.className = 'pov-loading';
          placeholder.textContent = 'Loading...';
        }
      }

      // Set src and wait for metadata
      v.element.src = v.videoSrc;
      v.element.preload = 'auto';

      await new Promise((resolve) => {
        if (v.element.readyState >= 1) { resolve(); return; }
        v.element.addEventListener('loadedmetadata', resolve, { once: true });
        v.element.addEventListener('error', resolve, { once: true });
      });

      if (isFirst) {
        // Unmute first POV by default
        v.isMuted = false;
        v.element.muted = false;
        v.element.volume = v.volume / 100;
      } else {
        // Seek new POV to match current playback position
        const masterTime = getCurrentMasterTime();
        const adjustedTime = masterTime - v.offset;
        if (adjustedTime > 0 && adjustedTime <= v.element.duration) {
          v.element.currentTime = adjustedTime;
        }
        if (isPlaying) v.element.play().catch(() => {});
      }

      // Update master duration if this video is longer
      const thisDuration = (v.element.duration || 0) + v.offset;
      if (thisDuration > masterDuration) {
        masterDuration = thisDuration;
      }

      // Re-render this specific container with the real video element
      renderPOVContainer(index);
      renderMemberList();
      renderAudioControls();
    }

    function getCurrentMasterTime() {
      const primary = videos.find(v => v.loaded);
      if (!primary) return 0;
      return (primary.element.currentTime || 0) + (primary.offset || 0);
    }

    function calculateOffsets() {
      let earliestStart = Infinity;
      let hasMetadata = false;

      videos.forEach(v => {
        if (v.metadata && v.metadata.startTimeUTC) {
          earliestStart = Math.min(earliestStart, v.metadata.startTimeUTC);
          hasMetadata = true;
        }
      });

      if (!hasMetadata) return;

      videos.forEach(v => {
        if (v.metadata && v.metadata.startTimeUTC) {
          v.offset = (v.metadata.startTimeUTC - earliestStart) / 1000;
        }
      });
    }

    // ========================
    // VIDEO GRID
    // ========================

    function renderVideoGrid() {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';

      if (focusedIndex >= 0) {
        grid.className = 'video-grid focused-mode';

        const mainContainer = buildPOVContainer(focusedIndex, true);
        mainContainer.className = 'focused-main';
        mainContainer.addEventListener('click', () => {
          focusedIndex = -1;
          renderVideoGrid();
          highlightActiveMember();
        });
        grid.appendChild(mainContainer);

        if (videos.length > 1) {
          const sidebar = document.createElement('div');
          sidebar.className = 'focused-sidebar';

          videos.forEach((v, i) => {
            if (i === focusedIndex) return;
            const container = buildPOVContainer(i, false);
            container.addEventListener('click', () => focusOnVideo(i));
            sidebar.appendChild(container);
          });

          grid.appendChild(sidebar);
        }

      } else {
        const count = videos.length;
        let gridClass = 'grid-' + Math.min(count, 9);
        if (count >= 10) gridClass = 'grid-10plus';
        grid.className = 'video-grid ' + gridClass;

        videos.forEach((v, i) => {
          const container = buildPOVContainer(i, false);
          container.addEventListener('click', () => focusOnVideo(i));
          grid.appendChild(container);
        });
      }
    }

    function buildPOVContainer(index, isFocused) {
      const v = videos[index];

      const container = document.createElement('div');
      container.className = 'pov-container' + (index === focusedIndex ? ' active' : '');
      container.id = 'pov-container-' + index;

      const label = document.createElement('div');
      label.className = 'pov-label';
      label.textContent = v.username;
      container.appendChild(label);

      if (v.loaded) {
        // Already loaded — show real video
        container.appendChild(v.element);
      } else {
        // Not loaded — show thumbnail placeholder
        const placeholder = document.createElement('div');

        if (v.thumbnailSrc) {
          // Has thumbnail — show it with play overlay
          placeholder.className = 'pov-placeholder';

          const img = document.createElement('img');
          img.src = v.thumbnailSrc;
          img.alt = v.username;

          const overlay = document.createElement('div');
          overlay.className = 'thumb-overlay';

          const icon = document.createElement('div');
          icon.className = 'play-icon';
          icon.textContent = '▶';

          const hint = document.createElement('div');
          hint.className = 'load-hint';
          hint.textContent = 'Click to load';

          overlay.appendChild(icon);
          overlay.appendChild(hint);
          placeholder.appendChild(img);
          placeholder.appendChild(overlay);
        } else {
          // No thumbnail — fallback text placeholder
          placeholder.className = 'pov-placeholder no-thumb';

          const icon = document.createElement('div');
          icon.className = 'play-icon';
          icon.textContent = '▶';

          const name = document.createElement('div');
          name.textContent = v.username;

          const hint = document.createElement('div');
          hint.className = 'load-hint';
          hint.textContent = 'Click to load';

          placeholder.appendChild(icon);
          placeholder.appendChild(name);
          placeholder.appendChild(hint);
        }

        container.appendChild(placeholder);
      }

      return container;
    }

    // Re-render a single container after lazy load completes
    function renderPOVContainer(index) {
      const existing = document.getElementById('pov-container-' + index);
      if (!existing) return;

      const newContainer = buildPOVContainer(index, index === focusedIndex);

      // Re-attach click handler
      if (index === focusedIndex) {
        newContainer.addEventListener('click', () => {
          focusedIndex = -1;
          renderVideoGrid();
          highlightActiveMember();
        });
      } else {
        newContainer.addEventListener('click', () => focusOnVideo(index));
      }

      existing.replaceWith(newContainer);
    }

    async function focusOnVideo(index) {
      // Trigger lazy load if not yet loaded
      if (!videos[index].loaded) {
        await loadPOV(index);
      }
      focusedIndex = index;
      renderVideoGrid();
      highlightActiveMember();
    }

    // ========================
    // MEMBER LIST
    // ========================

    function renderMemberList() {
      const list = document.getElementById('memberList');
      list.innerHTML = '';

      videos.forEach((v, i) => {
        const row = document.createElement('div');
        row.className = 'member-row' + (i === focusedIndex ? ' active' : '');
        row.id = 'member-row-' + i;

        const dot = document.createElement('div');
        dot.className = 'member-dot' + (v.loaded ? '' : ' unloaded');

        const name = document.createElement('div');
        name.className = 'member-name';
        name.textContent = v.username;

        row.appendChild(dot);
        row.appendChild(name);

        // Show "not loaded" badge for lazy POVs
        if (!v.loaded) {
          const badge = document.createElement('div');
          badge.className = 'member-badge';
          badge.textContent = 'click to load';
          row.appendChild(badge);
        }

        row.addEventListener('click', () => focusOnVideo(i));
        list.appendChild(row);
      });
    }

    function highlightActiveMember() {
      document.querySelectorAll('.member-row').forEach((row, i) => {
        row.classList.toggle('active', i === focusedIndex);
      });
    }

    // ========================
    // AUDIO CONTROLS
    // ========================

    function renderAudioControls() {
      const container = document.getElementById('audioControls');
      container.innerHTML = '';

      videos.forEach((v, i) => {
        const row = document.createElement('div');
        row.className = 'audio-row';

        const header = document.createElement('div');
        header.className = 'audio-row-header';

        const headerName = document.createElement('span');
        headerName.textContent = v.username + (v.loaded ? '' : ' (not loaded)');

        const arrow = document.createElement('span');
        arrow.className = 'audio-arrow';
        arrow.textContent = '▶';

        header.appendChild(headerName);
        header.appendChild(arrow);

        const dropdown = document.createElement('div');
        dropdown.className = 'audio-dropdown';

        if (!v.loaded) {
          const hint = document.createElement('div');
          hint.style.cssText = 'font-size:11px;color:#555;padding:4px 0;';
          hint.textContent = 'Click player to load this POV first';
          dropdown.appendChild(hint);
        } else {
          // Volume slider
          const volRow = document.createElement('div');
          volRow.className = 'audio-control-row';

          const volLabel = document.createElement('label');
          volLabel.textContent = 'Volume';

          const volSlider = document.createElement('input');
          volSlider.type = 'range';
          volSlider.min = '0';
          volSlider.max = '100';
          volSlider.value = v.volume;
          volSlider.addEventListener('input', () => {
            v.volume = parseInt(volSlider.value);
            v.element.volume = v.volume / 100;
            if (v.volume > 0 && v.isMuted) {
              v.isMuted = false;
              v.element.muted = false;
              muteBtn.classList.remove('muted');
              muteBtn.textContent = 'Mute';
            }
          });

          volRow.appendChild(volLabel);
          volRow.appendChild(volSlider);

          const muteRow = document.createElement('div');
          muteRow.className = 'audio-control-row';

          const muteBtn = document.createElement('button');
          muteBtn.className = 'mute-btn' + (v.isMuted ? ' muted' : '');
          muteBtn.textContent = v.isMuted ? 'Unmute' : 'Mute';
          muteBtn.addEventListener('click', () => {
            v.isMuted = !v.isMuted;
            v.element.muted = v.isMuted;
            muteBtn.classList.toggle('muted');
            muteBtn.textContent = v.isMuted ? 'Unmute' : 'Mute';
          });

          const soloBtn = document.createElement('button');
          soloBtn.className = 'mute-btn';
          soloBtn.textContent = 'Solo';
          soloBtn.addEventListener('click', () => {
            videos.forEach((other, j) => {
              if (j === i) {
                other.isMuted = false;
                if (other.loaded) { other.element.muted = false; }
              } else {
                other.isMuted = true;
                if (other.loaded) { other.element.muted = true; }
              }
            });
            renderAudioControls();
          });

          muteRow.appendChild(muteBtn);
          muteRow.appendChild(soloBtn);

          dropdown.appendChild(volRow);
          dropdown.appendChild(muteRow);
        }

        header.addEventListener('click', () => {
          dropdown.classList.toggle('open');
          arrow.classList.toggle('open');
        });

        row.appendChild(header);
        row.appendChild(dropdown);
        container.appendChild(row);
      });
    }

    // ========================
    // EXPORT
    // ========================

    function renderExportTimeline() {
      const timeline = document.getElementById('exportTimeline');
      timeline.innerHTML = '';
      selectedExportClips.clear();

      videos.forEach((v, i) => {
        const clip = document.createElement('div');
        clip.className = 'export-clip';
        clip.id = 'export-clip-' + i;

        const name = document.createElement('div');
        name.className = 'export-clip-name';
        name.textContent = v.username;

        const duration = document.createElement('div');
        duration.className = 'export-clip-duration';
        const dur = v.element.duration || 0;
        duration.textContent = v.loaded
          ? (formatTime(dur) + ' • ' + (v.metadata ? Math.round((v.metadata.durationMs || dur * 1000) / 1000) + 's' : formatTime(dur)))
          : (v.metadata ? Math.round((v.metadata.durationMs || 0) / 1000) + 's' : 'Not loaded');

        clip.appendChild(name);
        clip.appendChild(duration);

        clip.addEventListener('click', () => {
          clip.classList.toggle('selected');
          if (selectedExportClips.has(i)) selectedExportClips.delete(i);
          else selectedExportClips.add(i);
        });

        timeline.appendChild(clip);
      });
    }

    function selectAllClips() {
      videos.forEach((v, i) => {
        selectedExportClips.add(i);
        const el = document.getElementById('export-clip-' + i);
        if (el) el.classList.add('selected');
      });
    }

    function deselectAllClips() {
      selectedExportClips.clear();
      document.querySelectorAll('.export-clip').forEach(el => el.classList.remove('selected'));
    }

    async function downloadSelected() {
      if (selectedExportClips.size === 0) { alert('Select at least one clip to download'); return; }

      for (const i of selectedExportClips) {
        const v = videos[i];
        // Ensure loaded before download
        if (!v.loaded) await loadPOV(i);

        const link = document.createElement('a');
        link.href = v.videoSrc;
        link.download = `${v.username}_highlight.mp4`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }

    // ========================
    // PLAYBACK
    // ========================

    function togglePlayPause() {
      if (isPlaying) pauseAll();
      else playAll();
    }

    function playAll() {
      videos.forEach(v => { if (v.loaded) v.element.play().catch(() => {}); });
      isPlaying = true;
      document.getElementById('playPauseBtn').textContent = '⏸';
      startProgressUpdate();
    }

    function pauseAll() {
      videos.forEach(v => { if (v.loaded) v.element.pause(); });
      isPlaying = false;
      document.getElementById('playPauseBtn').textContent = '▶';
      if (animFrameId) cancelAnimationFrame(animFrameId);
    }

    function seekTo(event) {
      const timeline = document.getElementById('timeline');
      const rect = timeline.getBoundingClientRect();
      const fraction = (event.clientX - rect.left) / rect.width;
      const targetTime = fraction * masterDuration;

      videos.forEach(v => {
        if (!v.loaded) return;
        const adjustedTime = targetTime - v.offset;
        if (adjustedTime < 0) {
          v.element.currentTime = 0;
          v.element.pause();
        } else if (adjustedTime > v.element.duration) {
          v.element.currentTime = v.element.duration;
        } else {
          v.element.currentTime = adjustedTime;
          if (isPlaying) v.element.play().catch(() => {});
        }
      });
    }

    function startProgressUpdate() {
      function update() {
        if (!isPlaying) return;

        const primary = videos.find(v => v.loaded);
        if (!primary) return;

        const masterTime = (primary.element.currentTime || 0) + (primary.offset || 0);
        const fraction = masterDuration > 0 ? masterTime / masterDuration : 0;
        document.getElementById('timelineProgress').style.width = (fraction * 100) + '%';
        document.getElementById('timeDisplay').textContent =
          formatTime(masterTime) + ' / ' + formatTime(masterDuration);

        const allEnded = videos.filter(v => v.loaded).every(v => v.element.ended || v.element.paused);
        if (allEnded && isPlaying) { pauseAll(); return; }

        animFrameId = requestAnimationFrame(update);
      }
      update();
    }

    // ========================
    // SHARE LINK
    // ========================

    function showShareLink(code) {
      const url = `${window.location.origin}/player?code=${code}`;
      document.getElementById('shareUrl').textContent = url;
      document.getElementById('shareBar').style.display = 'flex';
    }

    function copyShareLink() {
      const url = document.getElementById('shareUrl').textContent;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '✅ Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '📋 Copy Link';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // ========================
    // COMPOSITE EXPORT
    // ========================

    function updateCompositeButton() {
      const btn = document.getElementById('compositeBtn');
      const uploadCount = videos.length;
      const ready = uploadCount >= 1;
      btn.disabled = !ready;

      if (!ready) {
        btn.textContent = `🎬 Export Combined (${uploadCount}/${expectedClips} clips ready)`;
      } else if (uploadCount < expectedClips) {
        btn.textContent = `🎬 Export Combined (${uploadCount}/${expectedClips} clips)`;
        btn.disabled = false; // allow early export with available clips
      } else {
        btn.textContent = `🎬 Export Combined View`;
      }
    }

    async function startComposite() {
      if (!currentSessionCode) return;

      const btn = document.getElementById('compositeBtn');
      const section = document.getElementById('compositeSection');
      const status = document.getElementById('compositeStatus');
      const progressBar = document.getElementById('compositeProgressBar');

      btn.disabled = true;
      btn.textContent = 'Starting...';
      section.style.display = 'flex';
      status.className = 'composite-status processing';
      status.textContent = 'Starting compositing job...';
      progressBar.style.display = 'block';

      try {
        const res = await fetch(`/sessions/${currentSessionCode}/composite`, { method: 'POST' });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Failed to start job');
        }
        const { jobId } = await res.json();
        compositeJobId = jobId;
        status.textContent = 'FFmpeg is stitching your clips — this takes 2-5 minutes...';
        pollCompositeJob(jobId);
      } catch (err) {
        status.className = 'composite-status failed';
        status.textContent = '❌ ' + err.message;
        progressBar.style.display = 'none';
        btn.disabled = false;
        btn.textContent = '🎬 Export Combined View';
      }
    }

    function pollCompositeJob(jobId) {
      if (compositePollInterval) clearInterval(compositePollInterval);

      compositePollInterval = setInterval(async () => {
        try {
          const res = await fetch(`/sessions/${currentSessionCode}/composite/${jobId}`);
          const data = await res.json();

          if (data.status === 'done') {
            clearInterval(compositePollInterval);
            compositePollInterval = null;

            const status = document.getElementById('compositeStatus');
            const progressBar = document.getElementById('compositeProgressBar');
            const btn = document.getElementById('compositeBtn');

            const sizeMB = data.fileSize ? (data.fileSize / 1024 / 1024).toFixed(1) + 'MB' : '';
            status.className = 'composite-status ready';
            status.textContent = `✅ Combined view ready${sizeMB ? ' (' + sizeMB + ')' : ''} — downloading...`;
            progressBar.style.display = 'none';
            btn.disabled = false;
            btn.textContent = '🎬 Export Combined View';

            // Trigger download
            const link = document.createElement('a');
            link.href = data.downloadUrl;
            link.download = 'peak-abu-composite.mp4';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

          } else if (data.status === 'failed') {
            clearInterval(compositePollInterval);
            compositePollInterval = null;

            document.getElementById('compositeStatus').className = 'composite-status failed';
            document.getElementById('compositeStatus').textContent = '❌ Compositing failed — try again';
            document.getElementById('compositeProgressBar').style.display = 'none';
            document.getElementById('compositeBtn').disabled = false;
            document.getElementById('compositeBtn').textContent = '🎬 Export Combined View';
          }
          // else still processing — keep polling
        } catch(e) {
          console.log('Poll error:', e);
        }
      }, 3000); // poll every 3 seconds
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }
  </script>
