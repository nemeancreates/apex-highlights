<!DOCTYPE html>
<html>
<head>
  <title>Peak-Abu – Multi-POV Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      color: #eee;
      font-family: 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #1a1a2e;
      border-bottom: 2px solid #e94560;
      flex-shrink: 0;
      height: 50px;
    }

    .header h1 { color: #e94560; font-size: 20px; }

    .join-bar { display: flex; gap: 8px; align-items: center; }

    .join-bar input {
      padding: 6px 12px;
      background: #0f3460;
      color: #eee;
      border: 1px solid #e94560;
      border-radius: 6px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 3px;
      width: 130px;
      text-align: center;
    }

    .join-bar input::placeholder { color: #556; text-transform: none; letter-spacing: normal; }

    .btn {
      padding: 6px 16px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { background: #c73652; }
    .btn:disabled { background: #555; cursor: not-allowed; }
    .btn-small { padding: 4px 10px; font-size: 12px; }
    .btn-secondary { background: #0f3460; border: 1px solid #e94560; }
    .btn-secondary:hover { background: #1a4a8a; }

    .btn-paste {
      padding: 6px 10px;
      background: #0f3460;
      color: #e94560;
      border: 1px solid #e94560;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-paste:hover { background: #1a4a8a; }
    .btn-paste.pasted { background: #44ff88; border-color: #44ff88; color: #000; }

    .main-layout { display: flex; flex: 1; min-height: 0; }

    .video-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 2px solid #1a1a2e;
    }

    .video-grid {
      flex: 1;
      display: grid;
      gap: 3px;
      padding: 3px;
      overflow-y: auto;
      min-height: 0;
    }

    .video-grid::-webkit-scrollbar { width: 6px; }
    .video-grid::-webkit-scrollbar-track { background: #111; }
    .video-grid::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    .grid-1 { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
    .grid-5, .grid-6 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-7, .grid-8, .grid-9 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-10plus { grid-template-columns: 1fr 1fr 1fr 1fr; }

    .video-grid.focused-mode { display: flex; flex-direction: column; gap: 0; padding: 0; }

    .focused-main { flex: 1; min-height: 60%; position: relative; background: #000; }
    .focused-main video { width: 100%; height: 100%; object-fit: contain; }

    .focused-sidebar {
      height: 25%;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 3px;
      padding: 3px;
      background: #111;
      flex-shrink: 0;
    }

    .focused-sidebar::-webkit-scrollbar { height: 6px; }
    .focused-sidebar::-webkit-scrollbar-track { background: #111; }
    .focused-sidebar::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    .focused-sidebar .pov-container { min-width: 180px; height: 100%; cursor: pointer; }

    .pov-container {
      position: relative;
      background: #111;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }
    .pov-container:hover { border-color: #e94560; }
    .pov-container.active { border-color: #e94560; }

    .pov-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    .pov-label {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(233, 69, 96, 0.85);
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      z-index: 2;
      pointer-events: none;
    }

    .pov-placeholder {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      color: #555;
      font-size: 13px;
      gap: 8px;
      cursor: pointer;
    }

    .pov-placeholder .play-icon { font-size: 32px; color: #e94560; opacity: 0.6; }
    .pov-placeholder .load-hint { font-size: 11px; color: #444; }

    .pov-loading {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      color: #e94560;
      font-size: 13px;
    }

    .pov-missing {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      color: #555;
      font-size: 13px;
      gap: 8px;
    }
    .pov-missing .monkey { font-size: 32px; }
    .pov-missing .missing-name { color: #e94560; font-weight: bold; font-size: 12px; }
    .pov-missing .missing-text { font-size: 11px; color: #444; }

    .pov-processing {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      color: #e9a820;
      font-size: 13px;
      gap: 8px;
    }
    .pov-processing .spinner { font-size: 28px; animation: spin 2s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .pov-processing .proc-name { color: #e94560; font-weight: bold; font-size: 12px; }
    .pov-processing .proc-text { font-size: 11px; color: #888; }

    /* ========================
       SESSION TIMELINE
    ======================== */
    .session-timeline {
      flex-shrink: 0;
      background: #1a1a2e;
      border-top: 1px solid #2a2a4e;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .timeline-top-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-display { font-size: 12px; color: #aaa; min-width: 90px; text-align: center; }

    .timeline-track-wrap { flex: 1; }

    .timeline-track {
      position: relative;
      height: 36px;
      background: #0a0a1a;
      border-radius: 6px;
      border: 1px solid #2a2a4e;
      cursor: pointer;
      overflow: hidden;
      user-select: none;
    }

    .highlight-block {
      position: absolute;
      top: 4px;
      height: calc(100% - 8px);
      background: #0f3460;
      border: 1px solid #e94560;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: #e94560;
      cursor: pointer;
      transition: background 0.15s;
      min-width: 28px;
      overflow: hidden;
      white-space: nowrap;
    }

    .highlight-block:hover { background: #1a4a8a; }
    .highlight-block.active { background: #e94560; color: white; border-color: #ff7090; }

    .timeline-needle {
      position: absolute;
      top: 0;
      width: 2px;
      height: 100%;
      background: rgba(255,255,255,0.9);
      pointer-events: none;
      z-index: 10;
      transform: translateX(-1px);
    }

    .timeline-track:hover .timeline-needle {
      width: 4px;
      transform: translateX(-2px);
      background: #e94560;
      transition: width 0.15s, background 0.15s;
    }

    .timeline-track:hover {
      height: 44px;
      margin-top: -4px;
      margin-bottom: -4px;
      transition: height 0.15s;
    }

    /* ========================
       RIGHT PANEL
    ======================== */
    .right-panel {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #12122a;
      border-left: 2px solid #1a1a2e;
    }

    .panel-section { padding: 10px; }

    .panel-section h3 {
      color: #e94560;
      font-size: 13px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .members-section { flex: 1; overflow-y: auto; border-bottom: 1px solid #2a2a4e; }
    .members-section::-webkit-scrollbar { width: 5px; }
    .members-section::-webkit-scrollbar-track { background: #111; }
    .members-section::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    .audio-section { max-height: 220px; overflow-y: auto; border-top: 1px solid #2a2a4e; }
    .audio-section::-webkit-scrollbar { width: 5px; }
    .audio-section::-webkit-scrollbar-track { background: #111; }
    .audio-section::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    .panel-row { padding: 2px 8px; }

    .panel-row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 6px 0;
      font-size: 13px;
    }
    .panel-row-header:hover { color: #e94560; }
    .panel-row-header.focused { color: #e94560; }

    .panel-row-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .member-dot { width: 8px; height: 8px; border-radius: 50%; background: #44ff88; flex-shrink: 0; }
    .member-dot.unloaded { background: #555; }
    .member-dot.missing { background: #ff4444; }
    .member-dot.processing { background: #e9a820; }

    .panel-row-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .audio-arrow { font-size: 10px; transition: transform 0.2s; color: #888; flex-shrink: 0; }
    .audio-arrow.open { transform: rotate(90deg); }

    .panel-row-dropdown { display: none; padding: 4px 0 6px 16px; }
    .panel-row-dropdown.open { display: block; }

    .player-hl-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      font-size: 11px;
      color: #aaa;
      cursor: default;
    }
    .player-hl-item.has-clip { cursor: pointer; }
    .player-hl-item.has-clip:hover { color: #e94560; }
    .player-hl-item.current-hl { color: #e94560; font-weight: bold; }

    .hl-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .audio-control-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 4px;
    }
    .audio-control-row label { width: 50px; flex-shrink: 0; }
    .audio-control-row input[type="range"] { flex: 1; accent-color: #e94560; height: 4px; }

    .mute-btn {
      background: none;
      border: 1px solid #555;
      color: #aaa;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
    }
    .mute-btn:hover { border-color: #e94560; color: #e94560; }
    .mute-btn.muted { background: #e94560; color: white; border-color: #e94560; }

    /* ========================
       EXPORT BAR
    ======================== */
    .export-bar {
      min-height: 140px;
      flex-shrink: 0;
      background: #16213e;
      border-top: 2px solid #e94560;
      display: flex;
      flex-direction: column;
    }

    .export-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid #2a2a4e;
    }

    .export-header h3 { color: #e94560; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    .export-actions { display: flex; gap: 8px; }

    .export-timeline {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 8px 16px;
      overflow-x: auto;
      gap: 6px;
    }

    .export-timeline::-webkit-scrollbar { height: 6px; }
    .export-timeline::-webkit-scrollbar-track { background: #111; }
    .export-timeline::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    .export-clip {
      min-width: 120px;
      height: 70px;
      background: #0f3460;
      border: 1px solid #2a2a5e;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s;
      padding: 4px 8px;
      text-align: center;
    }
    .export-clip:hover { border-color: #e94560; }
    .export-clip.selected { border-color: #e94560; background: #1a3a6e; }
    .export-clip-name { color: #e94560; font-weight: bold; margin-bottom: 2px; }
    .export-clip-duration { color: #888; font-size: 10px; }

    .composite-section {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #2a2a4e;
      flex-shrink: 0;
    }

    .composite-status { font-size: 12px; color: #888; flex: 1; }
    .composite-status.ready { color: #44ff88; }
    .composite-status.processing { color: #e9a820; }
    .composite-status.failed { color: #ff4444; }

    .progress-bar { width: 140px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; flex-shrink: 0; }

    .progress-fill {
      height: 100%;
      background: #e9a820;
      border-radius: 3px;
      width: 0%;
      transition: width 0.3s;
      animation: indeterminate 1.5s infinite;
    }

    @keyframes indeterminate {
      0% { width: 20%; margin-left: 0%; }
      50% { width: 40%; margin-left: 40%; }
      100% { width: 20%; margin-left: 80%; }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #444;
      font-size: 16px;
      gap: 10px;
    }
    .empty-state .monkey { font-size: 48px; }
    .empty-state .expired-msg { color: #e9a820; font-size: 14px; }

    .share-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: #0f3460;
      border-radius: 6px;
      margin-left: 12px;
      max-width: 320px;
    }

    .share-url {
      flex: 1;
      font-size: 12px;
      color: #aaa;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
    }

    .btn-copy {
      background: none;
      border: 1px solid #e94560;
      color: #e94560;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-copy:hover { background: #e94560; color: white; }
    .btn-copy.copied { background: #44ff88; border-color: #44ff88; color: #000; }
  </style>
</head>
<body>

  <div class="header">
    <h1>&#x1F648; Peak-Abu Player</h1>
    <div style="display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;">
      <div class="share-bar" id="shareBar" style="display:none;">
        <span class="share-url" id="shareUrl"></span>
        <button class="btn-copy" id="copyBtn" onclick="copyShareLink()">&#x1F4CB; Copy Link</button>
      </div>
      <div class="join-bar">
        <input type="text" id="sessionInput" placeholder="Session code" maxlength="6" />
        <button class="btn-paste" id="pasteBtn" onclick="pasteAndLoad()" title="Paste session code from clipboard">&#x1F4CB; Paste</button>
        <button class="btn" onclick="loadSession()">Load Session</button>
      </div>
    </div>
  </div>

  <div class="main-layout">
    <div class="video-area">
      <div class="video-grid" id="videoGrid">
        <div class="empty-state">
          <div class="monkey">&#x1F648;</div>
          <div>Enter a session code to watch multi-POV highlights</div>
        </div>
      </div>

      <!-- SESSION TIMELINE -->
      <div class="session-timeline" id="sessionTimeline" style="display:none;">
        <div class="timeline-top-row">
          <button class="btn btn-small btn-secondary" onclick="stepHighlight(-1)" title="Previous highlight">&#8249;</button>
          <button class="btn btn-small" id="playPauseBtn" onclick="togglePlayPause()">&#9654;</button>
          <button class="btn btn-small btn-secondary" onclick="stepHighlight(1)" title="Next highlight">&#8250;</button>
          <div class="timeline-track-wrap">
            <div class="timeline-track" id="timelineTrack">
             <div class="timeline-needle" id="timelineNeedle" style="left:0%"></div>
            </div>
          </div>
          <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
        </div>
      </div>
    </div>

    <div class="right-panel" id="rightPanel" style="display:none;">
      <div class="members-section panel-section">
        <h3>Players</h3>
        <div id="memberList"></div>
      </div>
      <div class="audio-section panel-section">
        <h3>Audio</h3>
        <div id="audioControls"></div>
      </div>
    </div>
  </div>

  <div class="export-bar" id="exportBar" style="display:none;">
    <div class="export-header">
      <h3>Export Studio</h3>
      <div class="export-actions">
        <button class="btn btn-small btn-secondary" onclick="selectAllClips()">Select All</button>
        <button class="btn btn-small btn-secondary" onclick="deselectAllClips()">Deselect All</button>
        <button class="btn btn-small btn-secondary" onclick="downloadSelected()">&#11015; Download Individual</button>
        <button class="btn btn-small" id="compositeBtn" onclick="startComposite()" disabled>&#127916; Export Combined View</button>
      </div>
    </div>
    <div class="export-timeline" id="exportTimeline"></div>
    <div class="composite-section" id="compositeSection" style="display:none;">
      <div class="composite-status" id="compositeStatus"></div>
      <div class="progress-bar" id="compositeProgressBar" style="display:none;">
        <div class="progress-fill" id="compositeFill"></div>
      </div>
    </div>
    <div class="composite-section" id="aireelSection" style="display:flex;flex-wrap:wrap;gap:8px;">
    <div style="width:100%;font-size:13px;color:#e94560;font-weight:600;">🎞 AI Highlight Reel <span style="color:#888;font-weight:normal;">(T3/T4 preview — free during beta)</span></div>
   <div>
     <label style="font-size:11px;color:#999;">Length</label>
     <select id="aireelLength" style="background:#0f3460;color:#eee;border:1px solid #2a2a5e;border-radius:4px;padding:4px 8px;">
       <option value="30">30s</option>
       <option value="60" selected>60s</option>
       <option value="90">90s</option>
       <option value="120">2 min</option>
     </select>
   </div>

    <div>
      <label style="font-size:11px;color:#999;">Game</label>
      <input type="text" id="aireelGame" placeholder="e.g. Apex Legends" style="background:#0f3460;color:#eee;border:1px solid #2a2a5e;border-radius:4px;padding:4px 8px;width:160px;" />
   </div>
  <div style="flex:1;min-width:220px;">
    <label style="font-size:11px;color:#999;">Style notes for the AI editor (saved per game)</label>
    <input type="text" id="aireelStyle" placeholder="e.g. keep clutches long, cut fast on kills" style="background:#0f3460;color:#eee;border:1px solid #2a2a5e;border-radius:4px;padding:4px 8px;width:100%;" />
  </div>
  <button class="btn btn-small" id="aireelBtn" onclick="startAiReel()">🤖 Generate AI Reel</button>
  <div id="aireelStatus" style="width:100%;font-size:12px;color:#888;"></div>
  <div id="aireelReport" style="width:100%;font-size:12px;color:#aaa;background:#0a0a1a;border-left:2px solid #e94560;padding:8px 12px;display:none;white-space:pre-wrap;"></div>
</div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      if (code) {
        document.getElementById('sessionInput').value = code.toUpperCase();
        loadSession();
      }
    });

    // Allow Enter key to load session
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('sessionInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') loadSession();
      });
    });

    // ========================
    // PASTE & LOAD
    // ========================

    async function pasteAndLoad() {
      const btn = document.getElementById('pasteBtn');
      try {
        const text = await navigator.clipboard.readText();
        const cleaned = text.trim().toUpperCase().replace(/[^A-Z0-9]/g, '').substring(0, 6);
        if (cleaned.length < 4) {
          btn.textContent = '\u274C Invalid';
          setTimeout(() => { btn.textContent = '\u{1F4CB} Paste'; }, 1500);
          return;
        }
        document.getElementById('sessionInput').value = cleaned;
        btn.textContent = '\u2705 Pasted!';
        btn.classList.add('pasted');
        setTimeout(() => { btn.textContent = '\u{1F4CB} Paste'; btn.classList.remove('pasted'); }, 1500);
        loadSession();
      } catch (e) {
        // Clipboard access denied — user can paste manually
        btn.textContent = '\u274C Denied';
        setTimeout(() => { btn.textContent = '\u{1F4CB} Paste'; }, 1500);
      }
    }

    // ========================
    // STATE
    // ========================
    let allUploads = [];
    let allUsers = [];
    let highlights = [];
    let currentHighlightIndex = 0;
    let videos = [];
    let isPlaying = false;
    let masterDuration = 0;
    let animFrameId = null;
    let focusedIndex = -1;
    let selectedExportClips = new Set();
    let expectedClips = 0;
    let currentSessionCode = null;
    let compositeJobId = null;
    let compositePollInterval = null;
    let refreshInterval = null;

    let sessionStart = 0;
    let sessionTotalDuration = 0;

    // ========================
    // HIGHLIGHT CLUSTERING
    // ========================

    function clusterHighlights() {
      const sorted = allUploads.slice().sort((a, b) => {
        const tA = (a.metadata && (a.metadata.coordinated_timestamp || a.metadata.saveTimeUTC)) || 0;
        const tB = (b.metadata && (b.metadata.coordinated_timestamp || b.metadata.saveTimeUTC)) || 0;
        return tA - tB;
      });

      const clusters = [];
      let current = null;

      for (const entry of sorted) {
        const ts = (entry.metadata && (entry.metadata.coordinated_timestamp || entry.metadata.saveTimeUTC)) || 0;
        if (!current || ts - current.timestamp > 5000) {
          current = { timestamp: ts, clips: [entry] };
          clusters.push(current);
        } else {
          current.clips.push(entry);
        }
      }
      return clusters;
    }

    function deriveAllUsers() {
      const seen = new Set();
      return allUploads.filter(u => {
        if (seen.has(u.username)) return false;
        seen.add(u.username);
        return true;
      }).map(u => u.username);
    }

    function buildVideosForHighlight(index) {
      const hl = highlights[index];
      if (!hl) return [];
      return allUsers.map(username => {
        const clip = hl.clips.find(c => c.username === username);
        return clip || {
          element: null, metadata: null, username,
          uploadId: null, videoFile: null, videoSrc: null,
          thumbnailSrc: null, offset: 0, volume: 80,
          isMuted: true, loaded: false, missing: true
        };
      });
    }

    function computeSessionTiming() {
      let start = Infinity;
      let end = -Infinity;
      let hasData = false;

      allUploads.forEach(u => {
        if (u.metadata && u.metadata.startTimeUTC) {
          hasData = true;
          start = Math.min(start, u.metadata.startTimeUTC);
          const clipEnd = u.metadata.startTimeUTC + (u.metadata.durationMs || 180000);
          end = Math.max(end, clipEnd);
        }
      });

      if (!hasData) return null;
      return { start, end, duration: Math.max(end - start, 1) };
    }

    // ========================
    // SESSION TIMELINE RENDER
    // ========================

    function renderSessionTimeline() {
      const track = document.getElementById('timelineTrack');
      track.querySelectorAll('.highlight-block').forEach(b => b.remove());

      const timing = computeSessionTiming();

      let prevEnd = 0;

      highlights.forEach((hl, i) => {
        const block = document.createElement('div');
        block.className = 'highlight-block' + (i === currentHighlightIndex ? ' active' : '');
        block.dataset.index = i;
        block.textContent = 'H' + (i + 1);

        let left, width;
        if (timing && hl.timestamp > 0) {
          let hlDuration = 0;
          hl.clips.forEach(clip => {
            if (clip.metadata && clip.metadata.durationMs) {
              hlDuration = Math.max(hlDuration, clip.metadata.durationMs);
            }
          });
          if (hlDuration === 0) hlDuration = 180000;

          left = ((hl.timestamp - timing.start) / timing.duration) * 100;
          width = (hlDuration / timing.duration) * 100;
          left = Math.max(0, Math.min(left, 94));
          width = Math.max(4, Math.min(width, 100 - left));
        } else {
          const total = highlights.length;
          const gap = total === 1 ? 0 : 5;
          const blockW = total === 1 ? 90 : (90 - gap * (total - 1)) / total;
          left = total === 1 ? 5 : i * (blockW + gap) + 5;
          width = blockW;
        }

        const GAP = 0.5;
        const MIN_W = 3;
        if (left < prevEnd + GAP) {
          left = prevEnd + GAP;
        }
        if (left + width > 100) {
          width = Math.max(MIN_W, 100 - left);
          if (left + width > 100) left = 100 - width;
        }
        prevEnd = left + width;

        block.style.left = left.toFixed(2) + '%';
        block.style.width = width.toFixed(2) + '%';

        block.addEventListener('click', e => {
          e.stopPropagation();
          switchHighlight(i);
        });

        track.insertBefore(block, document.getElementById('timelineNeedle'));
      });

      updateNeedle();
    }

    function updateNeedle() {
      const needle = document.getElementById('timelineNeedle');
      const track = document.getElementById('timelineTrack');
      if (!needle || !track) return;

      const activeBlock = track.querySelector('.highlight-block.active');
      if (!activeBlock) { needle.style.left = '0%'; return; }

      const blockLeft = parseFloat(activeBlock.style.left);
      const blockWidth = parseFloat(activeBlock.style.width);
      const fraction = masterDuration > 0 ? getCurrentMasterTime() / masterDuration : 0;
      needle.style.left = (blockLeft + fraction * blockWidth).toFixed(2) + '%';
    }

    

    let isScrubbing = false;
let wasPlayingBeforeScrub = false;

function scrubNeedleToEvent(event) {
  if (masterDuration <= 0) return;

  const track = document.getElementById('timelineTrack');
  const rect = track.getBoundingClientRect();
  let clickFraction = (event.clientX - rect.left) / rect.width;
  clickFraction = Math.max(0, Math.min(1, clickFraction));

  const activeBlock = track.querySelector('.highlight-block.active');
  if (!activeBlock) return;

  const blockLeft = parseFloat(activeBlock.style.left) / 100;
  const blockWidth = parseFloat(activeBlock.style.width) / 100;
  const withinFraction = Math.max(0, Math.min(1, (clickFraction - blockLeft) / blockWidth));

  // Move needle visually — instant, no decode cost
  const needle = document.getElementById('timelineNeedle');
  needle.style.left = (parseFloat(activeBlock.style.left) + withinFraction * parseFloat(activeBlock.style.width)).toFixed(2) + '%';
  document.getElementById('timeDisplay').textContent =
    formatTime(withinFraction * masterDuration) + ' / ' + formatTime(masterDuration);

  // Seek ONLY the primary video during drag — one decoder, real-time feedback
  const primary = focusedIndex >= 0
    ? videos[focusedIndex]
    : videos.find(v => !v.missing && !v.processing && v.loaded);
  if (primary && primary.element) {
    const targetTime = withinFraction * masterDuration;
    const adjusted = targetTime - primary.offset;
    if (adjusted >= 0 && adjusted <= primary.element.duration) {
      primary.element.currentTime = adjusted;
    }
  }

  // Stash for the full-sync seek on release
  track._pendingSeek = withinFraction;
}

document.addEventListener('DOMContentLoaded', function() {
  const track = document.getElementById('timelineTrack');

  track.addEventListener('pointerdown', function(e) {
    if (e.target.classList.contains('highlight-block') && !e.target.classList.contains('active')) return;
    if (masterDuration <= 0) return;
    isScrubbing = true;
    wasPlayingBeforeScrub = isPlaying;
    if (isPlaying) pauseAll();
    track.setPointerCapture(e.pointerId);
    scrubNeedleToEvent(e);
  });

  track.addEventListener('pointermove', function(e) {
    if (isScrubbing) scrubNeedleToEvent(e);
  });

  track.addEventListener('pointerup', function(e) {
    if (!isScrubbing) return;
    isScrubbing = false;
    try { track.releasePointerCapture(e.pointerId); } catch (err) {}

    // Sync all other POVs to the primary's position
    if (track._pendingSeek !== undefined) {
      seekToFraction(track._pendingSeek);
      delete track._pendingSeek;
    }

    if (wasPlayingBeforeScrub) playAll();
  });
});





    function seekToFraction(fraction) {
      const targetTime = fraction * masterDuration;
      videos.forEach(v => {
        if (v.missing || v.processing || !v.loaded) return;
        const adjustedTime = targetTime - v.offset;
        if (adjustedTime < 0) {
          v.element.currentTime = 0;
          v.element.pause();
        } else if (adjustedTime > v.element.duration) {
          v.element.currentTime = v.element.duration;
        } else {
          v.element.currentTime = adjustedTime;
          if (isPlaying) v.element.play().catch(() => {});
        }
      });
    }

    // ========================
    // HIGHLIGHT SWITCHING
    // ========================

    function switchHighlight(index) {
      if (index < 0 || index >= highlights.length) return;
      pauseAll();

      currentHighlightIndex = index;
      videos = buildVideosForHighlight(index);
      focusedIndex = -1;

      calculateOffsets();

      masterDuration = 0;
      videos.forEach(v => {
        if (!v.missing && !v.processing && v.loaded && v.element) {
          const dur = (v.element.duration || 0) + (v.offset || 0);
          if (dur > masterDuration) masterDuration = dur;
        }
      });

      const hasLoaded = videos.some(v => !v.missing && !v.processing && v.loaded);
      if (!hasLoaded) {
        const first = videos.find(v => !v.missing && !v.processing);
        if (first) {
          const idx = videos.indexOf(first);
          loadPOV(idx, true);
        }
      }

      renderVideoGrid();
      renderMemberList();
      renderAudioControls();
      renderExportTimeline();
      updateCompositeButton();
      renderSessionTimeline();

      document.getElementById('timeDisplay').textContent = '0:00 / ' + formatTime(masterDuration);
    }

    function stepHighlight(dir) {
      const next = currentHighlightIndex + dir;
      if (next < 0 || next >= highlights.length) return;
      switchHighlight(next);
    }

    // ========================
    // SESSION LOADING
    // ========================

    async function loadSession() {
      const code = document.getElementById('sessionInput').value.trim().toUpperCase();
      if (!code || code.length < 4) { alert('Enter a valid session code'); return; }

      try {
        const sessionRes = await fetch('/sessions/' + code);
        if (sessionRes.status === 404) {
          showExpiredState('Session not found — it may have expired or the code is incorrect.');
          return;
        }
        if (!sessionRes.ok) { alert('Error loading session'); return; }
        const session = await sessionRes.json();

        const uploadsRes = await fetch('/sessions/' + code + '/uploads');
        const uploadsData = await uploadsRes.json();
        if (!uploadsData.uploads || uploadsData.uploads.length === 0) {
          showExpiredState('No uploads in this session yet. Clips will appear once squad members save highlights.');
          return;
        }

        allUploads = [];
        focusedIndex = -1;
        currentSessionCode = code;
        currentHighlightIndex = 0;
        expectedClips = session.members ? session.members.length : 0;

        let hasProcessing = false;

        for (const upload of uploadsData.uploads) {
          let metadata = null;
          const metaUrl = upload.metadataUrl || (upload.metadataFile ? '/media/' + code + '/' + upload.metadataFile : null);
          if (metaUrl) {
            try {
              const metaRes = await fetch(metaUrl);
              if (metaRes.ok) metadata = await metaRes.json();
            } catch (e) {}
          }

          // Check if this upload is still processing (no CDN URL yet)
          const isProcessing = !upload.videoUrl;
          if (isProcessing) hasProcessing = true;

          const video = document.createElement('video');
          video.preload = 'none';
          video.muted = true;
          video.playsInline = true;

          allUploads.push({
            element: video, metadata, username: upload.username,
            uploadId: upload.id, videoFile: upload.videoFile,
            videoSrc: upload.videoUrl || null,
            thumbnailSrc: upload.thumbnailUrl || (upload.thumbnailFile ? '/media/' + code + '/' + upload.thumbnailFile : null),
            offset: 0, volume: 80, isMuted: true, loaded: false,
            missing: false, processing: isProcessing
          });
        }

        allUsers = deriveAllUsers();
        highlights = clusterHighlights();
        videos = buildVideosForHighlight(0);

        const firstLoadable = videos.find(v => !v.missing && !v.processing);
        if (firstLoadable) await loadPOV(videos.indexOf(firstLoadable), true);

        calculateOffsets();

        masterDuration = 0;
        videos.forEach(v => {
          if (!v.missing && !v.processing && v.loaded && v.element) {
            const dur = (v.element.duration || 0) + (v.offset || 0);
            if (dur > masterDuration) masterDuration = dur;
          }
        });

        renderVideoGrid();
        renderMemberList();
        renderAudioControls();
        renderExportTimeline();
        updateCompositeButton();
        renderSessionTimeline();
        showShareLink(code);

        document.getElementById('sessionTimeline').style.display = 'flex';
        document.getElementById('rightPanel').style.display = 'flex';
        document.getElementById('exportBar').style.display = 'flex';

        if (refreshInterval) clearInterval(refreshInterval);
        // Refresh faster if uploads are still processing
        refreshInterval = setInterval(refreshUploads, hasProcessing ? 10000 : 45000);

        console.log('Loaded ' + code + ' — ' + allUploads.length + ' uploads, ' + highlights.length + ' highlight(s), ' + allUsers.length + ' user(s)' + (hasProcessing ? ' (some still processing)' : ''));
      } catch (err) {
        alert('Error loading session: ' + err.message);
        console.error(err);
      }
    }

    function showExpiredState(message) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';
      const state = document.createElement('div');
      state.className = 'empty-state';
      state.innerHTML = '<div class="monkey">&#x1F648;</div><div class="expired-msg">' + message + '</div>';
      grid.appendChild(state);

      document.getElementById('sessionTimeline').style.display = 'none';
      document.getElementById('rightPanel').style.display = 'none';
      document.getElementById('exportBar').style.display = 'none';
      document.getElementById('shareBar').style.display = 'none';
    }

    // ========================
    // AUTO-REFRESH
    // ========================

    async function refreshUploads() {
      if (!currentSessionCode) return;
      try {
        const uploadsRes = await fetch('/sessions/' + currentSessionCode + '/uploads');

        // Session was purged — stop polling and notify
        if (uploadsRes.status === 404) {
          if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
          showExpiredState('This session has expired. Videos are no longer available.');
          return;
        }

        if (!uploadsRes.ok) return;
        const uploadsData = await uploadsRes.json();
        if (!uploadsData.uploads) return;

        const existingIds = new Set(allUploads.map(u => u.uploadId));
        const newRaw = uploadsData.uploads.filter(u => !existingIds.has(u.id));
        let hadProcessing = false;
        let stillProcessing = false;

        // Update existing entries: CDN URLs arriving, or processing → ready
        for (const upload of uploadsData.uploads) {
          if (!existingIds.has(upload.id)) continue;
          const existing = allUploads.find(u => u.uploadId === upload.id);
          if (!existing) continue;

          // Track if anything was processing
          if (existing.processing) hadProcessing = true;

          // Upload now has a CDN URL — mark as ready
          if (upload.videoUrl && existing.processing) {
            existing.processing = false;
            existing.videoSrc = upload.videoUrl;
            if (upload.thumbnailUrl) existing.thumbnailSrc = upload.thumbnailUrl;
            console.log('Upload ready:', upload.username, upload.id);
          } else if (upload.videoUrl && existing.videoSrc && !existing.videoSrc.startsWith('https://peakbu-media')) {
            // Existing entry upgraded to CDN URL
            existing.videoSrc = upload.videoUrl;
            if (upload.thumbnailUrl) existing.thumbnailSrc = upload.thumbnailUrl;
            if (existing.element && existing.element.src && !existing.element.src.startsWith('https://peakbu-media')) {
              existing.element.src = '';
              existing.loaded = false;
            }
            console.log('Updated to CDN URL:', upload.id);
          }

          // Still waiting?
          if (!upload.videoUrl) stillProcessing = true;
        }

        if (newRaw.length > 0) {
          for (const upload of newRaw) {
            let metadata = null;
            const metaUrl = upload.metadataUrl || (upload.metadataFile ? '/media/' + currentSessionCode + '/' + upload.metadataFile : null);
            if (metaUrl) {
              try {
                const metaRes = await fetch(metaUrl);
                if (metaRes.ok) metadata = await metaRes.json();
              } catch (e) {}
            }

            const isProcessing = !upload.videoUrl;
            if (isProcessing) stillProcessing = true;

            const video = document.createElement('video');
            video.preload = 'none';
            video.muted = true;
            video.playsInline = true;
            allUploads.push({
              element: video, metadata, username: upload.username,
              uploadId: upload.id, videoFile: upload.videoFile,
              videoSrc: upload.videoUrl || null,
              thumbnailSrc: upload.thumbnailUrl || (upload.thumbnailFile ? '/media/' + currentSessionCode + '/' + upload.thumbnailFile : null),
              offset: 0, volume: 80, isMuted: true, loaded: false,
              missing: false, processing: isProcessing
            });
          }
        }

        // Adjust refresh speed based on whether anything is still processing
        if (stillProcessing && refreshInterval) {
          clearInterval(refreshInterval);
          refreshInterval = setInterval(refreshUploads, 10000);
        } else if (!stillProcessing && hadProcessing && refreshInterval) {
          clearInterval(refreshInterval);
          refreshInterval = setInterval(refreshUploads, 45000);
        }

        if (newRaw.length > 0 || hadProcessing) {
          allUsers = deriveAllUsers();
          highlights = clusterHighlights();
          videos = buildVideosForHighlight(currentHighlightIndex);
          calculateOffsets();

          renderVideoGrid();
          renderMemberList();
          renderAudioControls();
          renderExportTimeline();
          updateCompositeButton();
          renderSessionTimeline();
        }

        if (newRaw.length > 0) console.log('Refresh: added ' + newRaw.length + ' upload(s)');
      } catch (err) {
        console.log('Refresh error:', err);
      }
    }

    // ========================
    // LAZY LOAD POV
    // ========================

    async function loadPOV(index, isFirst = false) {
      const v = videos[index];
      if (!v || v.missing || v.processing || v.loaded) return;
      v.loaded = true;

      const container = document.getElementById('pov-container-' + index);
      if (container) {
        const placeholder = container.querySelector('.pov-placeholder, .pov-loading');
        if (placeholder) { placeholder.className = 'pov-loading'; placeholder.textContent = 'Loading...'; }
      }

      v.element.src = v.videoSrc;
      v.element.preload = 'auto';

      await new Promise(resolve => {
        if (v.element.readyState >= 1) { resolve(); return; }
        v.element.addEventListener('loadedmetadata', resolve, { once: true });
        v.element.addEventListener('error', resolve, { once: true });
      });

      if (isFirst) {
        v.isMuted = false;
        v.element.muted = false;
        v.element.volume = v.volume / 100;
      } else {
        const masterTime = getCurrentMasterTime();
        const adjustedTime = masterTime - v.offset;
        if (adjustedTime > 0 && adjustedTime <= v.element.duration) v.element.currentTime = adjustedTime;
        if (isPlaying) v.element.play().catch(() => {});
      }

      const thisDuration = (v.element.duration || 0) + v.offset;
      if (thisDuration > masterDuration) masterDuration = thisDuration;

      renderPOVContainer(index);
      renderMemberList();
      renderAudioControls();
    }

    function getCurrentMasterTime() {
      const primary = videos.find(v => !v.missing && !v.processing && v.loaded);
      if (!primary) return 0;
      return (primary.element.currentTime || 0) + (primary.offset || 0);
    }

    function calculateOffsets() {
      let earliestStart = Infinity;
      let hasMetadata = false;
      videos.forEach(v => {
        if (!v.missing && !v.processing && v.metadata && v.metadata.startTimeUTC) {
          earliestStart = Math.min(earliestStart, v.metadata.startTimeUTC);
          hasMetadata = true;
        }
      });
      if (!hasMetadata) return;
      videos.forEach(v => {
        if (!v.missing && !v.processing && v.metadata && v.metadata.startTimeUTC) {
          v.offset = (v.metadata.startTimeUTC - earliestStart) / 1000;
        }
      });
    }

    // ========================
    // VIDEO GRID
    // ========================

    function renderVideoGrid() {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';

      if (focusedIndex >= 0) {
        grid.className = 'video-grid focused-mode';

        const mainContainer = buildPOVContainer(focusedIndex, true);
        mainContainer.className = 'focused-main';
        mainContainer.addEventListener('click', () => { focusedIndex = -1; renderVideoGrid(); highlightActiveMember(); });
        grid.appendChild(mainContainer);

        if (videos.length > 1) {
          const sidebar = document.createElement('div');
          sidebar.className = 'focused-sidebar';
          videos.forEach((v, i) => {
            if (i === focusedIndex) return;
            const container = buildPOVContainer(i, false);
            if (!v.missing && !v.processing) container.addEventListener('click', () => focusOnVideo(i));
            sidebar.appendChild(container);
          });
          grid.appendChild(sidebar);
        }
      } else {
        const count = videos.length;
        let gridClass = 'grid-' + Math.min(count, 9);
        if (count >= 10) gridClass = 'grid-10plus';
        grid.className = 'video-grid ' + gridClass;

        videos.forEach((v, i) => {
          const container = buildPOVContainer(i, false);
          if (!v.missing && !v.processing) container.addEventListener('click', () => focusOnVideo(i));
          grid.appendChild(container);
        });
      }
    }

    function buildPOVContainer(index, isFocused) {
      const v = videos[index];
      const container = document.createElement('div');
      container.className = 'pov-container' + (index === focusedIndex ? ' active' : '');
      container.id = 'pov-container-' + index;

      const label = document.createElement('div');
      label.className = 'pov-label';
      label.textContent = v.username;
      container.appendChild(label);

      if (v.missing) {
        const md = document.createElement('div');
        md.className = 'pov-missing';
        md.innerHTML = '<div class="monkey">&#x1F648;</div><div class="missing-name">' + v.username + '</div><div class="missing-text">No clip in this highlight</div>';
        container.appendChild(md);
      } else if (v.processing) {
        // Upload exists but CDN URL not ready yet
        const pd = document.createElement('div');
        pd.className = 'pov-processing';
        pd.innerHTML = '<div class="spinner">&#x23F3;</div><div class="proc-name">' + v.username + '</div><div class="proc-text">Upload processing\u2026</div>';
        container.appendChild(pd);
      } else if (v.loaded) {
        container.appendChild(v.element);
      } else {
        const placeholder = document.createElement('div');
        if (v.thumbnailSrc) {
          placeholder.className = 'pov-placeholder';
          const img = document.createElement('img');
          img.src = v.thumbnailSrc; img.alt = v.username;
          img.style.cssText = 'width:100%;height:100%;object-fit:contain;position:absolute;top:0;left:0;';
          const overlay = document.createElement('div');
          overlay.style.cssText = 'position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;';
          const icon = document.createElement('div');
          icon.className = 'play-icon'; icon.textContent = '\u25B6';
          const hint = document.createElement('div');
          hint.className = 'load-hint'; hint.textContent = 'Click to load';
          overlay.appendChild(icon); overlay.appendChild(hint);
          placeholder.style.position = 'relative';
          placeholder.appendChild(img); placeholder.appendChild(overlay);
        } else {
          placeholder.className = 'pov-placeholder no-thumb';
          const icon = document.createElement('div');
          icon.className = 'play-icon'; icon.textContent = '\u25B6';
          const nameDiv = document.createElement('div');
          nameDiv.textContent = v.username;
          const hint = document.createElement('div');
          hint.className = 'load-hint'; hint.textContent = 'Click to load';
          placeholder.appendChild(icon); placeholder.appendChild(nameDiv); placeholder.appendChild(hint);
        }
        container.appendChild(placeholder);
      }
      return container;
    }

    function renderPOVContainer(index) {
      const existing = document.getElementById('pov-container-' + index);
      if (!existing) return;
      const newContainer = buildPOVContainer(index, index === focusedIndex);
      if (index === focusedIndex) {
        newContainer.addEventListener('click', () => { focusedIndex = -1; renderVideoGrid(); highlightActiveMember(); });
      } else if (!videos[index].missing && !videos[index].processing) {
        newContainer.addEventListener('click', () => focusOnVideo(index));
      }
      existing.replaceWith(newContainer);
    }

    async function focusOnVideo(index) {
      if (videos[index].missing || videos[index].processing) return;
      if (!videos[index].loaded) await loadPOV(index);
      focusedIndex = index;
      renderVideoGrid();
      highlightActiveMember();
    }

    // ========================
    // MEMBER LIST
    // ========================

    function renderMemberList() {
      const list = document.getElementById('memberList');
      list.innerHTML = '';

      allUsers.forEach(username => {
        const videoIdx = videos.findIndex(v => v.username === username);
        const v = videoIdx >= 0 ? videos[videoIdx] : null;
        const isMissing = !v || v.missing;
        const isProcessing = v && v.processing;
        const isFocused = videoIdx === focusedIndex;

        const row = document.createElement('div');
        row.className = 'panel-row';

        const header = document.createElement('div');
        header.className = 'panel-row-header' + (isFocused ? ' focused' : '');

        const left = document.createElement('div');
        left.className = 'panel-row-header-left';

        const dot = document.createElement('div');
        dot.className = 'member-dot' + (isMissing ? ' missing' : isProcessing ? ' processing' : (v && v.loaded ? '' : ' unloaded'));

        const name = document.createElement('div');
        name.className = 'panel-row-name';
        name.textContent = username + (isProcessing ? ' (processing)' : '');

        left.appendChild(dot);
        left.appendChild(name);

        const arrow = document.createElement('span');
        arrow.className = 'audio-arrow';
        arrow.textContent = '\u25B6';

        header.appendChild(left);
        header.appendChild(arrow);

        const dropdown = document.createElement('div');
        dropdown.className = 'panel-row-dropdown';

        highlights.forEach((hl, hlIdx) => {
          const hasClip = hl.clips.some(c => c.username === username);
          const item = document.createElement('div');
          item.className = 'player-hl-item' + (hasClip ? ' has-clip' : '') + (hlIdx === currentHighlightIndex ? ' current-hl' : '');

          const hlDot = document.createElement('div');
          hlDot.className = 'hl-dot';
          hlDot.style.background = hasClip ? '#44ff88' : '#ff4444';

          const hlLabel = document.createElement('span');
          hlLabel.textContent = 'Highlight ' + (hlIdx + 1) + (hasClip ? '' : ' \u2014 no clip');

          item.appendChild(hlDot);
          item.appendChild(hlLabel);

          if (hasClip) {
            item.addEventListener('click', e => {
              e.stopPropagation();
              switchHighlight(hlIdx);
              const newIdx = videos.findIndex(vv => vv.username === username);
              if (newIdx >= 0 && !videos[newIdx].missing && !videos[newIdx].processing) focusOnVideo(newIdx);
            });
          }

          dropdown.appendChild(item);
        });

        if (!isMissing && !isProcessing) {
          left.style.cursor = 'pointer';
          left.addEventListener('click', e => {
            e.stopPropagation();
            if (videoIdx >= 0) focusOnVideo(videoIdx);
          });
        }

        header.addEventListener('click', () => {
          dropdown.classList.toggle('open');
          arrow.classList.toggle('open');
        });

        row.appendChild(header);
        row.appendChild(dropdown);
        list.appendChild(row);
      });
    }

    function highlightActiveMember() {
      document.querySelectorAll('.panel-row-header').forEach((header, i) => {
        const videoIdx = videos.findIndex(v => v.username === allUsers[i]);
        header.classList.toggle('focused', videoIdx === focusedIndex);
      });
    }

    // ========================
    // AUDIO CONTROLS
    // ========================

    function renderAudioControls() {
      const container = document.getElementById('audioControls');
      container.innerHTML = '';

      videos.forEach((v, i) => {
        if (v.missing || v.processing) return;

        const row = document.createElement('div');
        row.className = 'panel-row';

        const header = document.createElement('div');
        header.className = 'panel-row-header';

        const left = document.createElement('div');
        left.className = 'panel-row-header-left';

        const dot = document.createElement('div');
        dot.className = 'member-dot' + (v.loaded ? '' : ' unloaded');

        const name = document.createElement('span');
        name.className = 'panel-row-name';
        name.textContent = v.username + (v.loaded ? '' : ' (not loaded)');

        left.appendChild(dot);
        left.appendChild(name);

        const arrow = document.createElement('span');
        arrow.className = 'audio-arrow';
        arrow.textContent = '\u25B6';

        header.appendChild(left);
        header.appendChild(arrow);

        const dropdown = document.createElement('div');
        dropdown.className = 'panel-row-dropdown';

        if (!v.loaded) {
          const hint = document.createElement('div');
          hint.style.cssText = 'font-size:11px;color:#555;padding:4px 0;';
          hint.textContent = 'Click player to load this POV first';
          dropdown.appendChild(hint);
        } else {
          const volRow = document.createElement('div');
          volRow.className = 'audio-control-row';

          const volLabel = document.createElement('label');
          volLabel.textContent = 'Volume';

          const volSlider = document.createElement('input');
          volSlider.type = 'range';
          volSlider.min = '0'; volSlider.max = '100'; volSlider.value = v.volume;

          const muteRow = document.createElement('div');
          muteRow.className = 'audio-control-row';

          const muteBtn = document.createElement('button');
          muteBtn.className = 'mute-btn' + (v.isMuted ? ' muted' : '');
          muteBtn.textContent = v.isMuted ? 'Unmute' : 'Mute';

          volSlider.addEventListener('input', (function(vRef, muteBtnRef) {
            return function() {
              vRef.volume = parseInt(this.value);
              vRef.element.volume = vRef.volume / 100;
              if (vRef.volume > 0 && vRef.isMuted) {
                vRef.isMuted = false; vRef.element.muted = false;
                muteBtnRef.classList.remove('muted'); muteBtnRef.textContent = 'Mute';
              }
            };
          })(v, muteBtn));

          muteBtn.addEventListener('click', (function(vRef, muteBtnRef) {
            return function() {
              vRef.isMuted = !vRef.isMuted;
              vRef.element.muted = vRef.isMuted;
              muteBtnRef.classList.toggle('muted');
              muteBtnRef.textContent = vRef.isMuted ? 'Unmute' : 'Mute';
            };
          })(v, muteBtn));

          const soloBtn = document.createElement('button');
          soloBtn.className = 'mute-btn';
          soloBtn.textContent = 'Solo';
          soloBtn.addEventListener('click', (function(targetIdx) {
            return function() {
              videos.forEach((other, j) => {
                if (other.missing || other.processing) return;
                if (j === targetIdx) { other.isMuted = false; if (other.loaded) other.element.muted = false; }
                else { other.isMuted = true; if (other.loaded) other.element.muted = true; }
              });
              renderAudioControls();
            };
          })(i));

          volRow.appendChild(volLabel); volRow.appendChild(volSlider);
          muteRow.appendChild(muteBtn); muteRow.appendChild(soloBtn);
          dropdown.appendChild(volRow); dropdown.appendChild(muteRow);
        }

        header.addEventListener('click', () => {
          dropdown.classList.toggle('open');
          arrow.classList.toggle('open');
        });

        row.appendChild(header); row.appendChild(dropdown);
        container.appendChild(row);
      });
    }

    // ========================
    // EXPORT
    // ========================

    function renderExportTimeline() {
      const timeline = document.getElementById('exportTimeline');
      timeline.innerHTML = '';
      selectedExportClips.clear();

      videos.forEach((v, i) => {
        if (v.missing || v.processing) return;

        const clip = document.createElement('div');
        clip.className = 'export-clip';
        clip.id = 'export-clip-' + i;

        const name = document.createElement('div');
        name.className = 'export-clip-name';
        name.textContent = v.username;

        const dur = v.element ? (v.element.duration || 0) : 0;
        const duration = document.createElement('div');
        duration.className = 'export-clip-duration';
        duration.textContent = v.loaded
          ? (formatTime(dur) + ' \u2022 ' + (v.metadata ? Math.round((v.metadata.durationMs || dur * 1000) / 1000) + 's' : formatTime(dur)))
          : (v.metadata ? Math.round((v.metadata.durationMs || 0) / 1000) + 's' : 'Not loaded');

        clip.appendChild(name); clip.appendChild(duration);

        clip.addEventListener('click', () => {
          clip.classList.toggle('selected');
          if (selectedExportClips.has(i)) selectedExportClips.delete(i);
          else selectedExportClips.add(i);
        });

        timeline.appendChild(clip);
      });
    }

    function selectAllClips() {
      videos.forEach((v, i) => {
        if (v.missing || v.processing) return;
        selectedExportClips.add(i);
        const el = document.getElementById('export-clip-' + i);
        if (el) el.classList.add('selected');
      });
    }

    function deselectAllClips() {
      selectedExportClips.clear();
      document.querySelectorAll('.export-clip').forEach(el => el.classList.remove('selected'));
    }

    async function downloadSelected() {
      if (selectedExportClips.size === 0) { alert('Select at least one clip to download'); return; }
      for (const idx of selectedExportClips) {
        const v = videos[idx];
        if (v.missing || v.processing) continue;
        if (!v.loaded) await loadPOV(idx);
        const link = document.createElement('a');
        link.href = v.videoSrc;
        link.download = v.username + '_highlight.mp4';
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      }
    }

    // ========================
    // PLAYBACK
    // ========================

    function togglePlayPause() {
      if (isPlaying) pauseAll(); else playAll();
    }

    function playAll() {
      videos.forEach(v => { if (!v.missing && !v.processing && v.loaded) v.element.play().catch(() => {}); });
      isPlaying = true;
      document.getElementById('playPauseBtn').textContent = '\u23F8';
      startProgressUpdate();
    }

    function pauseAll() {
      videos.forEach(v => { if (!v.missing && !v.processing && v.loaded) v.element.pause(); });
      isPlaying = false;
      document.getElementById('playPauseBtn').textContent = '\u25B6';
      if (animFrameId) cancelAnimationFrame(animFrameId);
    }

    function startProgressUpdate() {
      function update() {
        if (!isPlaying) return;
        const primary = videos.find(v => !v.missing && !v.processing && v.loaded);
        if (!primary) return;

        const masterTime = (primary.element.currentTime || 0) + (primary.offset || 0);
        document.getElementById('timeDisplay').textContent = formatTime(masterTime) + ' / ' + formatTime(masterDuration);
        updateNeedle();

        const allEnded = videos.filter(v => !v.missing && !v.processing && v.loaded).every(v => v.element.ended || v.element.paused);
        if (allEnded && isPlaying) { pauseAll(); return; }

        animFrameId = requestAnimationFrame(update);
      }
      update();
    }

    // ========================
    // SHARE LINK
    // ========================

    function showShareLink(code) {
      const url = window.location.origin + '/player?code=' + code;
      document.getElementById('shareUrl').textContent = url;
      document.getElementById('shareBar').style.display = 'flex';
    }

    function copyShareLink() {
      const url = document.getElementById('shareUrl').textContent;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '\u2705 Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '\u{1F4CB} Copy Link'; btn.classList.remove('copied'); }, 2000);
      });
    }

    // ========================
    // COMPOSITE EXPORT
    // ========================

    function updateCompositeButton() {
      const btn = document.getElementById('compositeBtn');
      const count = videos.filter(v => !v.missing && !v.processing).length;
      btn.disabled = count < 1;
      btn.textContent = count < 1
        ? '\u{1F3AC} Export Combined (0/' + expectedClips + ' clips ready)'
        : count < expectedClips
          ? '\u{1F3AC} Export Combined (' + count + '/' + expectedClips + ' clips)'
          : '\u{1F3AC} Export Combined View';
    }

    async function startComposite() {
      if (!currentSessionCode) return;
      const btn = document.getElementById('compositeBtn');
      const section = document.getElementById('compositeSection');
      const status = document.getElementById('compositeStatus');
      const progressBar = document.getElementById('compositeProgressBar');

      btn.disabled = true; btn.textContent = 'Starting...';
      section.style.display = 'flex';
      status.className = 'composite-status processing';
      status.textContent = 'Starting compositing job...';
      progressBar.style.display = 'block';

      try {
        const res = await fetch('/sessions/' + currentSessionCode + '/composite', { method: 'POST' });
        if (!res.ok) { const e = await res.json(); throw new Error(e.error || 'Failed to start job'); }
        const { jobId } = await res.json();
        compositeJobId = jobId;
        status.textContent = 'FFmpeg is stitching your clips \u2014 this takes 2-5 minutes...';
        pollCompositeJob(jobId);
      } catch (err) {
        status.className = 'composite-status failed';
        status.textContent = '\u274C ' + err.message;
        progressBar.style.display = 'none';
        btn.disabled = false;
        btn.textContent = '\u{1F3AC} Export Combined View';
      }
    }

    function pollCompositeJob(jobId) {
      if (compositePollInterval) clearInterval(compositePollInterval);
      compositePollInterval = setInterval(async () => {
        try {
          const res = await fetch('/sessions/' + currentSessionCode + '/composite/' + jobId);
          const data = await res.json();
          if (data.status === 'done') {
            clearInterval(compositePollInterval); compositePollInterval = null;
            const sizeMB = data.fileSize ? (data.fileSize / 1024 / 1024).toFixed(1) + 'MB' : '';
            document.getElementById('compositeStatus').className = 'composite-status ready';
            document.getElementById('compositeStatus').textContent = '\u2705 Ready' + (sizeMB ? ' (' + sizeMB + ')' : '') + ' \u2014 downloading...';
            document.getElementById('compositeProgressBar').style.display = 'none';
            document.getElementById('compositeBtn').disabled = false;
            document.getElementById('compositeBtn').textContent = '\u{1F3AC} Export Combined View';
            const link = document.createElement('a');
            link.href = data.downloadUrl; link.download = 'peak-abu-composite.mp4';
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
          } else if (data.status === 'failed') {
            clearInterval(compositePollInterval); compositePollInterval = null;
            document.getElementById('compositeStatus').className = 'composite-status failed';
            document.getElementById('compositeStatus').textContent = '\u274C Compositing failed \u2014 try again';
            document.getElementById('compositeProgressBar').style.display = 'none';
            document.getElementById('compositeBtn').disabled = false;
            document.getElementById('compositeBtn').textContent = '\u{1F3AC} Export Combined View';
          }
        } catch (e) { console.log('Poll error:', e); }
      }, 3000);
    }

    let aireelJobId = null;
    let aireelPollInterval = null;

    async function startAiReel() {
      if (!currentSessionCode) return;
      if (selectedExportClips.size === 0) {
        alert('Select at least one clip in the Export Studio first');
        return;
      }
      const targetSec = parseInt(document.getElementById('aireelLength').value);
      const game = document.getElementById('aireelGame').value.trim();
      const styleNotes = document.getElementById('aireelStyle').value.trim();

      const uploadIds = Array.from(selectedExportClips)
        .map(i => videos[i])
        .filter(v => v && !v.missing && !v.processing && v.uploadId)
        .map(v => v.uploadId);
      if (uploadIds.length === 0) { alert('Selected clips are not ready yet'); return; }

      const btn = document.getElementById('aireelBtn');
      const status = document.getElementById('aireelStatus');
      const report = document.getElementById('aireelReport');
      btn.disabled = true; btn.textContent = 'Starting...';
      status.textContent = 'Queuing job...';
      report.style.display = 'none';

      try {
        const res = await fetch('/sessions/' + currentSessionCode + '/aireel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uploadIds, targetSec, game, styleNotes })
        });
        if (!res.ok) { const e = await res.json(); throw new Error(e.error || 'Failed to start'); }
        const { jobId } = await res.json();
        aireelJobId = jobId;
        status.textContent = 'Job queued — analyzing your clips...';
        pollAiReel(jobId);
      } catch (err) {
        status.textContent = '❌ ' + err.message;
        btn.disabled = false;
        btn.textContent = '🤖 Generate AI Reel';
      }
    }

    function pollAiReel(jobId) {
      if (aireelPollInterval) clearInterval(aireelPollInterval);
      aireelPollInterval = setInterval(async () => {
        try {
          const res = await fetch('/sessions/' + currentSessionCode + '/aireel/' + jobId);
          const data = await res.json();
          const status = document.getElementById('aireelStatus');
          const report = document.getElementById('aireelReport');
          const btn = document.getElementById('aireelBtn');
          status.textContent = data.progress || data.status;
          if (data.status === 'done') {
            clearInterval(aireelPollInterval); aireelPollInterval = null;
            const sizeMB = data.fileSize ? (data.fileSize / 1024 / 1024).toFixed(1) + 'MB' : '';
            status.textContent = '✅ Reel ready' + (sizeMB ? ' (' + sizeMB + ')' : '') + ' — downloading...';
            if (data.report) {
              report.textContent = '📝 Editor: ' + data.editorEngine + '\n\n' + data.report;
              report.style.display = 'block';
            }
            btn.disabled = false; btn.textContent = '🤖 Generate AI Reel';
            const link = document.createElement('a');
            link.href = data.downloadUrl; link.download = 'peak-abu-ai-reel.mp4';
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
          } else if (data.status === 'failed') {
            clearInterval(aireelPollInterval); aireelPollInterval = null;
            status.textContent = '❌ ' + (data.progress || 'Failed');
            btn.disabled = false; btn.textContent = '🤖 Generate AI Reel';
          }
        } catch (e) { /* transient, keep polling */ }
      }, 3000);
    }


    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }
  </script>
