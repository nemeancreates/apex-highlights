    function buildPOVContainer(index, isFocused) {
      const v = videos[index];
      const container = document.createElement('div');
      container.className = 'pov-container' + (index === focusedIndex ? ' active' : '');
      container.id = 'pov-container-' + index;

      const label = document.createElement('div');
      label.className = 'pov-label';
      label.textContent = v.username;
      container.appendChild(label);

      // LOCAL badge — shows when this POV is playing from a local file
      if (v.isLocal) {
        const localBadge = document.createElement('div');
        localBadge.className = 'local-badge';
        localBadge.textContent = 'LOCAL';
        container.appendChild(localBadge);
      }

      if (v.missing) {
        const md = document.createElement('div');
        md.className = 'pov-missing';
        md.innerHTML = '<div class="monkey">&#x1F648;</div><div class="missing-name">' + v.username + '</div><div class="missing-text">No clip in this highlight</div>';
        container.appendChild(md);
      } else if (v.processing) {
        const pd = document.createElement('div');
        pd.className = 'pov-processing';
        pd.innerHTML = '<div class="spinner">&#x23F3;</div><div class="proc-name">' + v.username + '</div><div class="proc-text">Upload processing\u2026</div>';
        container.appendChild(pd);
      } else if (v.loaded) {
        container.appendChild(v.element);
      } else {
        const placeholder = document.createElement('div');
        if (v.thumbnailSrc) {
          placeholder.className = 'pov-placeholder';
          const img = document.createElement('img');
          img.src = v.thumbnailSrc; img.alt = v.username;
          img.style.cssText = 'width:100%;height:100%;object-fit:contain;position:absolute;top:0;left:0;';
          const overlay = document.createElement('div');
          overlay.style.cssText = 'position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;';
          const icon = document.createElement('div');
          icon.className = 'play-icon'; icon.textContent = '\u25B6';
          const hint = document.createElement('div');
          hint.className = 'load-hint';
          hint.textContent = v.isLocal ? 'Click to load (local)' : 'Click to load';
          overlay.appendChild(icon); overlay.appendChild(hint);
          placeholder.style.position = 'relative';
          placeholder.appendChild(img); placeholder.appendChild(overlay);
        } else {
          placeholder.className = 'pov-placeholder no-thumb';
          const icon = document.createElement('div');
          icon.className = 'play-icon'; icon.textContent = '\u25B6';
          const nameDiv = document.createElement('div');
          nameDiv.textContent = v.username;
          const hint = document.createElement('div');
          hint.className = 'load-hint';
          hint.textContent = v.isLocal ? 'Click to load (local)' : 'Click to load';
          placeholder.appendChild(icon); placeholder.appendChild(nameDiv); placeholder.appendChild(hint);
        }
        container.appendChild(placeholder);
      }

      // Export select checkbox
      // Export select checkbox — logged-in only. This is the single choke
      // point for the whole selection bar (Download/Combined/AI Reel all
      // only render once something's selected), so gating it here hides
      // all three export paths at once for anonymous viewers.
      if (!v.missing && !v.processing && v.uploadId && myAuthToken) {
        const checkbox = document.createElement('div');
        const isSel = selectedExportClips.has(v.uploadId);
        checkbox.className = 'pov-export-check' + (isSel ? ' selected' : '');
        checkbox.title = isSel ? 'Remove from export' : 'Add to export';
        checkbox.textContent = isSel ? '✓' : '+';
        checkbox.addEventListener('click', (function(uploadId) {
          return function(e) {
            e.stopPropagation();
            toggleExportSelection(uploadId);
          };
        })(v.uploadId));
        container.appendChild(checkbox);
      }

      // Nudge bar
      if (!v.missing && !v.processing && v.loaded) {
        const nudgeBar = document.createElement('div');
        nudgeBar.className = 'pov-nudge-bar';
        nudgeBar.id = 'nudge-bar-' + index;

        const btnMinus = document.createElement('button');
        btnMinus.className = 'nudge-btn';
        btnMinus.textContent = '−';
        btnMinus.title = 'Shift this POV 0.5s earlier (Shift+click for 50ms fine trim)';

        const readout = document.createElement('div');
        readout.className = 'nudge-readout' + ((v.nudgeMs || 0) !== 0 ? ' nonzero' : '');
        readout.id = 'nudge-readout-' + index;
        readout.textContent = formatNudge(v.nudgeMs || 0);

        const btnPlus = document.createElement('button');
        btnPlus.className = 'nudge-btn';
        btnPlus.textContent = '+';
        btnPlus.title = 'Shift this POV 0.5s later (Shift+click for 50ms fine trim)';

        function applyNudge(deltaMs) {
          const masterTime = getCurrentMasterTime();

          v.nudgeMs = (v.nudgeMs || 0) + deltaMs;
          v.offset = (v.offset || 0) + deltaMs / 1000;
          readout.textContent = formatNudge(v.nudgeMs);
          readout.className = 'nudge-readout' + (v.nudgeMs !== 0 ? ' nonzero' : '');

          if (v.element && isFinite(v.element.duration)) {
            const adjusted = masterTime - v.offset;
            const maxSeek = Math.max(0, v.element.duration - 0.05);
            v.element.currentTime = Math.min(Math.max(adjusted, 0), maxSeek);
            if (isPlaying) v.element.play().catch(() => {});
          }

          masterDuration = 0;
          videos.forEach(vid => {
            if (!vid.missing && !vid.processing && vid.loaded && vid.element) {
              const dur = (vid.element.duration || 0) + (vid.offset || 0);
              if (dur > masterDuration) masterDuration = dur;
            }
          });
        }

        btnMinus.addEventListener('click', function(e) { e.stopPropagation(); applyNudge(e.shiftKey ? -50 : -500); });
        btnPlus.addEventListener('click',  function(e) { e.stopPropagation(); applyNudge(e.shiftKey ? +50 : +500); });

        nudgeBar.appendChild(btnMinus);
        nudgeBar.appendChild(readout);
        nudgeBar.appendChild(btnPlus);
        container.appendChild(nudgeBar);
      }

      return container;
    }

    function renderPOVContainer(index) {
      const existing = document.getElementById('pov-container-' + index);
      if (!existing) return;
      const newContainer = buildPOVContainer(index, index === focusedIndex);
      if (index === focusedIndex) {
        newContainer.addEventListener('click', () => { focusedIndex = -1; renderVideoGrid(); highlightActiveMember(); });
      } else if (!videos[index].missing && !videos[index].processing) {
        newContainer.addEventListener('click', () => focusOnVideo(index));
      }
      existing.replaceWith(newContainer);
    }

      if (videos[index].missing || videos[index].processing) return;
      if (!videos[index].loaded) await loadPOV(index);
      focusedIndex = index;

      highlightActiveMember();
    }

    async function downloadSelected() {
  if (selectedExportClips.size === 0) { alert('Select at least one clip to download'); return; }
  if (!myAuthToken) { alert('Sign in through the Peak-Abu app with a paid plan to download clips.'); return; }

  const hlLookup = {};
  highlights.forEach((hl, idx) => {
    (hl.clips || []).forEach(u => { hlLookup[u.uploadId] = idx + 1; });
  });

  const btn = event && event.target;
  const originalText = btn ? btn.textContent : null;
  let n = 0;
  let failed = 0;
  let denied = false;
  const total = selectedExportClips.size;

  for (const id of selectedExportClips) {
    const u = allUploads.find(x => x.uploadId === id);
    if (!u || u.processing) continue;

    const hlNum = hlLookup[id] || (n + 1);
    const filename = 'H' + hlNum + '_' + u.username + '.mp4';
    if (btn) btn.textContent = 'Downloading ' + (n + 1) + '/' + total + '...';

    try {
      const res = await fetch('/sessions/' + currentSessionCode + '/uploads/' + id + '/download', {
        headers: { 'Authorization': 'Bearer ' + myAuthToken }
      });
      if (res.status === 401 || res.status === 403) { denied = true; break; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const blobUrl = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = blobUrl;
      link.download = filename;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
      n++;
    } catch (err) {
      console.error('Download failed for', filename, err);
      failed++;
    }
  }

  if (btn && originalText) btn.textContent = originalText;
  if (denied) alert('Downloads require a paid Peak-Abu plan — sign in through the app.');
  else if (n === 0) alert('No clips downloaded — selected clips may not be ready yet');
  else if (failed > 0) alert('Downloaded ' + n + ' clips (' + failed + ' failed)');
}

    function togglePlayPause() {
      if (isPlaying) pauseAll(); else playAll();
    }

    function playAll() {
      videos.forEach(v => { if (!v.missing && !v.processing && v.loaded) v.element.play().catch(() => {}); });
      isPlaying = true;
      document.getElementById('playPauseBtn').textContent = '\u23F8';
      startProgressUpdate();
    }

    function pauseAll() {
      videos.forEach(v => {
        if (!v.missing && !v.processing && v.loaded) {
          v.element.pause();
          v.element.playbackRate = 1.0;
        }
      });
      isPlaying = false;
      document.getElementById('playPauseBtn').textContent = '\u25B6';
      if (animFrameId) cancelAnimationFrame(animFrameId);
    }

    function startProgressUpdate() {
      const HARD_RESYNC = 0.30;  // >300ms off: hard seek
      const SOFT_RESYNC = 0.08;  // >80ms off: nudge via playbackRate
      let lastResyncCheck = 0;

      function update(ts) {
        if (!isPlaying) return;
        const loaded = videos.filter(v => !v.missing && !v.processing && v.loaded);
        if (!loaded.length) return;

        // Clock source: first POV still playing. When the shortest POV ends
        // first, the clock hands off instead of freezing — a frozen master
        // time made the corrector loop longer POVs on their final seconds.
        const clock = loaded.find(v => !v.element.ended && !v.element.paused)
                   || loaded.find(v => !v.element.ended)
                   || loaded[0];
        const masterTime = (clock.element.currentTime || 0) + (clock.offset || 0);
        document.getElementById('timeDisplay').textContent = formatTime(masterTime) + ' / ' + formatTime(masterDuration);
        updateNeedle();

        // Drift correction — check ~4x/sec, not every frame (seeking every
        // frame would stutter). Keep every POV locked to master time.
        if (!lastResyncCheck || ts - lastResyncCheck > 250) {
          lastResyncCheck = ts;
          videos.forEach(v => {
            if (v.missing || v.processing || !v.loaded || v === clock) return;
            if (v.element.ended || v.element.seeking) return;
            const target = masterTime - v.offset;
            if (target < 0 || target > v.element.duration) return;
            const drift = v.element.currentTime - target;
            const absDrift = Math.abs(drift);
            if (absDrift > HARD_RESYNC) {
              // Too far gone — snap it
              v.element.currentTime = target;
              v.element.playbackRate = 1.0;
            } else if (absDrift > SOFT_RESYNC) {
              // Gently speed up / slow down to ease back into sync
              v.element.playbackRate = drift > 0 ? 0.95 : 1.05;
            } else {
              v.element.playbackRate = 1.0;
            }
          });
        }

        const allEnded = videos.filter(v => !v.missing && !v.processing && v.loaded).every(v => v.element.ended || v.element.paused);
        if (allEnded && isPlaying) { pauseAll(); return; }

        animFrameId = requestAnimationFrame(update);
      }
      animFrameId = requestAnimationFrame(update);
    }

    let currentShareUrl = '';

    function showShareLink(code) {

      e.stopPropagation();
      paOpenCompose(index);
    });
    return btn;
  }

  function paRefreshCounts() {
    var vids = paVideos();
    for (var i = 0; i < vids.length; i++) {
      var container = document.getElementById('pov-container-' + i);
      if (!container) continue;
      var btn = container.querySelector('.pa-cmt-btn');
      if (!btn) continue;
      var badge = btn.querySelector('.pa-cmt-count');
      if (!badge) continue;
      var n = (paByUpload.get(vids[i] && vids[i].uploadId) || []).length;
      badge.textContent = n > 99 ? '99+' : String(n);
      badge.style.display = n > 0 ? 'flex' : 'none';
    }
  }

  // ================================
  // TICK
  // ================================
  function paTick() {
    if (paDragging) return; // freeze rendering while host is dragging

    var vids = paVideos();
    var wanted = {};

    for (var i = 0; i < vids.length; i++) {
      var v = vids[i];
      if (!v || v.missing || v.processing || !v.uploadId || !v.loaded || !v.element) continue;

      var container = document.getElementById('pov-container-' + i);
      if (!container) continue;
      var layer = container.querySelector('.pa-cmt-layer');
      if (!layer) continue;

      var t = v.element.currentTime || 0;
      var prev = paLastT.get(v.uploadId);
      paLastT.set(v.uploadId, t);

      var restarted = (prev !== undefined) && (t < prev - 0.4) && (t < 1.2) && (Date.now() > paScrubUntil);
      if (prev === undefined || restarted || !paSet.has(v.uploadId)) {
        paChooseSet(v.uploadId);
      }

      if (!paOverlayOn) continue;

      var chosen = paSet.get(v.uploadId) || [];
      for (var k = 0; k < chosen.length; k++) {
        var c = chosen[k];
        var start = c.timestampMs / 1000;
        if (t >= start && t < start + (PA_DISPLAY_MS / 1000)) {
          wanted[c.id] = { comment: c, layer: layer, videoEl: v.element };
        }
      }
    }

    // Remove stale
    var stale = [];
    paVisible.forEach(function (rec, id) { if (!wanted[id]) stale.push(id); });
    stale.forEach(function (id) {
      var rec = paVisible.get(id);
      paVisible.delete(id);
      if (rec.layer && rec.layer.__paZones && rec.zone) delete rec.layer.__paZones[rec.zone];
      if (rec.node) {
        rec.node.classList.remove('pa-in');
        var n = rec.node;
        setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 260);
      }
    });

    // Add new
    Object.keys(wanted).forEach(function (id) {
      if (paVisible.has(id)) return;
      var w = wanted[id];
      var c = w.comment;

      var node = document.createElement('div');
      var zone = null;

      // Saved position from host drag — bypass zone system entirely
      if (c.positionX != null && c.positionY != null) {
        node.className = 'pa-cmt';
        node.style.left = c.positionX + '%';
        node.style.top = c.positionY + '%';
        node.style.right = 'auto';
        node.style.bottom = 'auto';
        node.style.transform = 'none';
      } else {
        zone = paPickZone(w.layer, w.videoEl);
        if (!zone) return;
        w.layer.__paZones[zone] = true;
        node.className = 'pa-cmt pa-z-' + zone;
      }

      // Host can drag
      if (paHost() && paToken()) {
        node.classList.add('pa-draggable');
        paMakeDraggable(node, c, w.layer);
      }

      var who = document.createElement('span');
      who.className = 'pa-cmt-user';
      who.textContent = c.username;

      var body = document.createElement('span');
      body.className = 'pa-cmt-body';
      body.textContent = c.text;

      node.appendChild(who);
      node.appendChild(body);
      w.layer.appendChild(node);

      requestAnimationFrame(function () { node.classList.add('pa-in'); });

      paVisible.set(id, { node: node, zone: zone, layer: w.layer, comment: c });
    });

    paUpdateNavControls();
  }

  // ================================
  // HOST DRAG
  // ================================
  function paMakeDraggable(node, comment, layer) {
  node.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    e.stopPropagation();
    e.preventDefault();

    var nodeRect = node.getBoundingClientRect();
    var layerRect = layer.getBoundingClientRect();
    paDragging = {
      commentId: comment.id,
      node: node,
      layer: layer,
      rect: layerRect,
      offsetX: e.clientX - nodeRect.left,
      offsetY: e.clientY - nodeRect.top
    };
    node.classList.add('pa-dragging');

    function onMove(ev) {
      if (!paDragging || paDragging.node !== node) return;
      var r = paDragging.rect;
      var x = ((ev.clientX - paDragging.offsetX - r.left) / r.width) * 100;
      var y = ((ev.clientY - paDragging.offsetY - r.top) / r.height) * 100;
      x = Math.max(0, Math.min(90, x));
      y = Math.max(0, Math.min(90, y));
      node.style.left = x + '%';
      node.style.top = y + '%';
      node.style.right = 'auto';
      node.style.bottom = 'auto';
      node.style.transform = 'none';
      node.className = node.className.replace(/\bpa-z-\w+\b/g, '').trim();
    }

    function onUp(ev) {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      if (!paDragging || paDragging.node !== node) return;
      node.classList.remove('pa-dragging');

      var r = paDragging.rect;
      var px = ((ev.clientX - paDragging.offsetX - r.left) / r.width) * 100;
      var py = ((ev.clientY - paDragging.offsetY - r.top) / r.height) * 100;
      px = Math.max(0, Math.min(90, px));
      py = Math.max(0, Math.min(90, py));

      var cid = paDragging.commentId;
      var vis = paVisible.get(cid);
      if (vis && vis.zone && vis.layer && vis.layer.__paZones) {
        delete vis.layer.__paZones[vis.zone];
        vis.zone = null;
      }
      paDragging = null;

      paByUpload.forEach(function (arr) {
        arr.forEach(function (c) {
          if (c.id === cid) { c.positionX = px; c.positionY = py; }
        });
      });
      paSet.forEach(function (arr) {
        arr.forEach(function (c) {
          if (c.id === cid) { c.positionX = px; c.positionY = py; }
        });
      });

      fetch('/sessions/' + paCode() + '/comments/' + cid + '/position', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + paToken() },
        body: JSON.stringify({ positionX: Math.round(px * 100) / 100, positionY: Math.round(py * 100) / 100 })
      }).catch(function () {});
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

  // ================================
  // NAV CONTROLS — ◀ 💬 ▶ in the timeline row
  // ================================

    var row = document.querySelector('#sessionTimeline .timeline-top-row');

  function paUpdateNavControls() {
   var clusters = paAllTimestamps();
   var hasAnyComments = clusters.length > 0;

   var p = document.getElementById('paNavPrev');
   var n = document.getElementById('paNavNext');
   var btn = document.getElementById('paMomentBtn');

   // Hide nav arrows entirely when there are no comments to navigate
   if (p) p.style.display = hasAnyComments ? '' : 'none';
   if (n) n.style.display = hasAnyComments ? '' : 'none';

   if (btn) btn.textContent = '\uD83D\uDCAC ' + paMomentComments().length;

   if (!hasAnyComments) return;

   var vids = paVideos();
   var nowMs = 0;
   for (var i = 0; i < vids.length; i++) {
     if (vids[i] && vids[i].loaded && vids[i].element) {
       nowMs = (vids[i].element.currentTime || 0) * 1000;
       break;
     }
  }
  var hasPrev = clusters.some(function (t) { return t < nowMs - 200; });
  var hasNext = clusters.some(function (t) { return t > nowMs + 200; });
  if (p) p.disabled = !hasPrev;
  if (n) n.disabled = !hasNext;
}

  // ================================
  // "COMMENTS AT THIS MOMENT"
  // ================================
  function paMomentComments() {
    var out = [];
    var vids = paVideos();
    for (var i = 0; i < vids.length; i++) {
      var v = vids[i];
      if (!v || !v.uploadId || !v.loaded || !v.element) continue;
      var tMs = (v.element.currentTime || 0) * 1000;
      var all = paByUpload.get(v.uploadId) || [];
      for (var k = 0; k < all.length; k++) {
        if (Math.abs(all[k].timestampMs - tMs) <= PA_MOMENT_WINDOW_MS) {
          out.push({ comment: all[k], pov: v.username });
        }
      }
    }
    out.sort(function (a, b) { return a.comment.timestampMs - b.comment.timestampMs; });
    return out;
  }

  // ================================
  function paClosePanel(id) {
    var el = document.getElementById(id);
    if (el) el.remove();
  }

  function paCloseAll() {
    if (paComposeClose) { paComposeClose(); }
    paClosePanel('paMomentPanel');

  }

  function paBuildPanel(id, title) {
    paClosePanel(id);
    var panel = document.createElement('div');
    panel.className = 'pa-panel';
    panel.id = id;
    var head = document.createElement('div');
    head.className = 'pa-panel-head';

    body.className = 'pa-panel-body';
    panel.appendChild(head); panel.appendChild(body);
    document.body.appendChild(panel);
    return { panel: panel, body: body };
  }

  function paFmt(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  // --- compose ---
  function paOpenCompose(index) {
    paCloseAll();
    var v = paVideos()[index];
    if (!v || !v.uploadId) return;
    if (!paToken()) { alert('Sign in through the Peak-Abu app to leave comments. Any account works, including Free.'); return; }
    if (!paSessionEnabled) { alert('The host has turned comments off for this session.'); return; }
    if (!v.loaded || !v.element) { alert('Click this POV to load it first, then leave your comment at the moment you want.'); return; }

    paResumeAfterCompose = paPlaying();
    if (paResumeAfterCompose) paCall('pauseAll');

    var tMs = Math.round(((v.element && v.element.currentTime) || 0) * 1000);
    paComposeTarget = { index: index, uploadId: v.uploadId, username: v.username, timestampMs: tMs };

    var ui = paBuildPanel('paComposePanel', 'Leave a comment');
    var meta = document.createElement('div');
    meta.className = 'pa-meta';
    var m1 = document.createElement('span'); m1.textContent = 'On ';
    var m2 = document.createElement('b'); m2.textContent = v.username + "'s POV";
    var m3 = document.createElement('span'); m3.textContent = ' at ';
    var m4 = document.createElement('b'); m4.textContent = paFmt(tMs);
    meta.appendChild(m1); meta.appendChild(m2); meta.appendChild(m3); meta.appendChild(m4);

    var input = document.createElement('textarea');
    input.className = 'pa-input'; input.rows = 2;
    input.maxLength = PA_MAX_LEN;
    input.placeholder = 'Plain text, ' + PA_MAX_LEN + ' characters';
    var err = document.createElement('div'); err.className = 'pa-err';
    var row = document.createElement('div'); row.className = 'pa-row';
    var counter = document.createElement('span'); counter.className = 'pa-counter';
    counter.textContent = '0 / ' + PA_MAX_LEN;
    var actions = document.createElement('div');
    var cancel = document.createElement('button'); cancel.className = 'btn btn-small btn-secondary'; cancel.textContent = 'Cancel'; cancel.style.marginRight = '6px';
    var post = document.createElement('button'); post.className = 'btn btn-small'; post.textContent = 'Post';
    actions.appendChild(cancel); actions.appendChild(post);
    row.appendChild(counter); row.appendChild(actions);

    input.addEventListener('input', function () {
      counter.textContent = input.value.length + ' / ' + PA_MAX_LEN;
      counter.classList.toggle('pa-warn', input.value.length > PA_MAX_LEN - 15);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
      if (e.key === 'Escape') { e.preventDefault(); close(); }
    });

    function close() {
      paComposeClose = null;
      paClosePanel('paComposePanel');
      if (paResumeAfterCompose) { paCall('playAll'); paResumeAfterCompose = false; }
    }
    paComposeClose = close;

    function submit() {
      var text = input.value.trim();
      if (!text) { err.textContent = 'Type something first.'; return; }
      post.disabled = true; post.textContent = 'Posting...'; err.textContent = '';

      fetch('/sessions/' + paCode() + '/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + paToken() },
        body: JSON.stringify({ uploadId: paComposeTarget.uploadId, timestampMs: paComposeTarget.timestampMs, text: text })
      }).then(function (r) {
        return r.json().then(function (d) { return { ok: r.ok, data: d }; });
      }).then(function (res) {
        if (!res.ok) { err.textContent = (res.data && res.data.error) || 'Could not post.'; post.disabled = false; post.textContent = 'Post'; return; }
        return paFetchComments().then(function () {
          var chosen = paSet.get(paComposeTarget.uploadId) || [];
          var added = res.data && res.data.comment;
          if (added && !chosen.some(function (c) { return c.id === added.id; })) {
            chosen.push(added);
            chosen.sort(function (a, b) { return a.timestampMs - b.timestampMs; });
            paSet.set(paComposeTarget.uploadId, chosen);
          }
          close();
        });
      }).catch(function () { err.textContent = 'Could not reach the server.'; post.disabled = false; post.textContent = 'Post'; });
    }

    cancel.addEventListener('click', close);
    post.addEventListener('click', submit);
    ui.body.appendChild(meta); ui.body.appendChild(input); ui.body.appendChild(err); ui.body.appendChild(row);
    setTimeout(function () { input.focus(); }, 30);
  }

  // --- moment list ---
  function paOpenMomentPanel() {

          method: 'DELETE', headers: { 'Authorization': 'Bearer ' + paToken() }
        }).then(function (r) {

          return paFetchComments().then(function () {
            paSet.forEach(function (arr, uploadId) {

            });
            if (onChanged) onChanged();
          });

      row.appendChild(del);

    return row;
  }

  // ================================
  // WIRING
  // ================================
  function paWrap(name, after) {
    var original = window[name];
    if (typeof original !== 'function') return;
    window[name] = function () {
      var result = original.apply(this, arguments);
      if (result && typeof result.then === 'function') {
        return result.then(function (r) { try { after(); } catch (e) {} return r; });
      }
      try { after(); } catch (e) {}
      return result;
    };
  }

  function paInit() {
    paInjectStyles();
    try { paOverlayOn = localStorage.getItem('pa_comments_overlay') !== '0'; } catch (e) { paOverlayOn = true; }

    paWrap('renderVideoGrid', function () { paAttachAll(); paApplyEnabledState(); });
    paWrap('renderPOVContainer', function () { paAttachAll(); paApplyEnabledState(); });
    paWrap('switchHighlight', function () {
      paSet.clear(); paLastT.clear();
      paAttachAll(); paApplyEnabledState();
    });
    paWrap('loadSession', function () {
      paEnsureGear();
      paSet.clear(); paLastT.clear();
      paFetchComments().then(function () { paAttachAll(); paApplyEnabledState(); });
    });

    document.addEventListener('pointerdown', function (e) {
      var t = e.target;
      if (!t || !t.closest) return;
      if (t.closest('#timelineTrack') || t.closest('.nudge-btn')) {
        paScrubUntil = Date.now() + 1200;
      }
    }, true);

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      paCloseAll();
    });

    if (paTicker) clearInterval(paTicker);
    paTicker = setInterval(paTick, PA_TICK_MS);

    if (paRefreshTimer) clearInterval(paRefreshTimer);
    paRefreshTimer = setInterval(function () { if (paCode()) paFetchComments(); }, PA_REFRESH_MS);

    paEnsureGear();

    // --- Export overlay toggle ---
    // Inject a "Include comments on video" checkbox into the export panel
    // and intercept the fetch calls to pass the flag to the server.
    window._paExportComments = true;

    paWrap('openExportPanel', function () {
      setTimeout(function () {
        paInjectExportCheckbox('compositeSection');
        paInjectExportCheckbox('aireelSection');
      }, 50);
    });

    // Intercept composite/aireel POST requests to include the flag.
    // Composite currently sends no body; aireel already sends JSON.
    var _paOrigFetch = window.fetch;
    window.fetch = function (url, opts) {
      if (typeof url === 'string' && opts && opts.method === 'POST') {
        var want = window._paExportComments !== false;

        // Composite POST — add JSON body with the flag
        if (url.match(/\/sessions\/[A-Z0-9]+\/composite$/i)) {
          opts = Object.assign({}, opts);
          opts.headers = Object.assign({}, opts.headers || {}, { 'Content-Type': 'application/json' });
          opts.body = JSON.stringify({ includeComments: want });
          return _paOrigFetch.call(window, url, opts);
        }

        // AI Reel POST — merge flag into existing JSON body
        if (url.match(/\/sessions\/[A-Z0-9]+\/aireel$/i) && opts.body) {
          try {
            var body = JSON.parse(opts.body);
            body.includeComments = want;
            opts = Object.assign({}, opts);
            opts.body = JSON.stringify(body);
          } catch (e) {}
          return _paOrigFetch.call(window, url, opts);
        }
      }
      return _paOrigFetch.apply(window, arguments);
    };
  }

  function paInjectExportCheckbox(sectionId) {
    var section = document.getElementById(sectionId);
    if (!section || section.querySelector('.pa-export-toggle')) return;
    var toggle = document.createElement('label');
    toggle.className = 'pa-toggle pa-export-toggle';
    toggle.style.cssText = 'width:100%;padding:6px 0;font-size:12px;border-bottom:1px solid #24402e;margin-bottom:6px;';
    var label = document.createElement('span');
    label.textContent = 'Include comments on video';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = window._paExportComments !== false;
    cb.addEventListener('change', function () {
      window._paExportComments = cb.checked;
      // Sync the other section's checkbox if it exists
      document.querySelectorAll('.pa-export-toggle input').forEach(function (other) {
        other.checked = cb.checked;
      });
    });
    toggle.appendChild(label);
    toggle.appendChild(cb);
    // Insert after the first child (the title/description row)
    if (section.children.length > 0) {
      section.insertBefore(toggle, section.children[0]);
    } else {
      section.appendChild(toggle);
    }
  }

  paInit();
})();

    </script>
</body>
