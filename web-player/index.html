<!DOCTYPE html>
<html>
<head>
  <title>Peak-Abu — Multi-POV Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      color: #eee;
      font-family: 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ========== HEADER ========== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #1a1a2e;
      border-bottom: 2px solid #e94560;
      flex-shrink: 0;
      height: 50px;
    }

    .header h1 {
      color: #e94560;
      font-size: 20px;
    }

    .join-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .join-bar input {
      padding: 6px 12px;
      background: #0f3460;
      color: #eee;
      border: 1px solid #e94560;
      border-radius: 6px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 3px;
      width: 130px;
      text-align: center;
    }

    .join-bar input::placeholder {
      color: #556;
      text-transform: none;
      letter-spacing: normal;
    }

    .btn {
      padding: 6px 16px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn:hover { background: #c73652; }
    .btn:disabled { background: #555; cursor: not-allowed; }
    .btn-small { padding: 4px 10px; font-size: 12px; }
    .btn-secondary { background: #0f3460; border: 1px solid #e94560; }
    .btn-secondary:hover { background: #1a4a8a; }

    /* ========== MAIN LAYOUT ========== */
    .main-layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ========== SECTION 1: VIDEO AREA (left) ========== */
    .video-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 2px solid #1a1a2e;
    }

    /* Grid mode: equal sized videos */
    .video-grid {
      flex: 1;
      display: grid;
      gap: 3px;
      padding: 3px;
      overflow-y: auto;
      min-height: 0;
    }

    .video-grid::-webkit-scrollbar { width: 6px; }
    .video-grid::-webkit-scrollbar-track { background: #111; }
    .video-grid::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    /* Grid column layouts based on count */
    .grid-1 { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
    .grid-5, .grid-6 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-7, .grid-8, .grid-9 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-10plus { grid-template-columns: 1fr 1fr 1fr 1fr; }

    /* Focused mode: one big + vertical list */
    .video-grid.focused-mode {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 0;
    }

    .focused-main {
      flex: 1;
      min-height: 60%;
      position: relative;
      background: #000;
    }

    .focused-main video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .focused-sidebar {
      height: 25%;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 3px;
      padding: 3px;
      background: #111;
      flex-shrink: 0;
    }

    .focused-sidebar::-webkit-scrollbar { height: 6px; }
    .focused-sidebar::-webkit-scrollbar-track { background: #111; }
    .focused-sidebar::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    .focused-sidebar .pov-container {
      min-width: 180px;
      height: 100%;
      cursor: pointer;
    }

    /* POV container */
    .pov-container {
      position: relative;
      background: #111;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }

    .pov-container:hover { border-color: #e94560; }
    .pov-container.active { border-color: #e94560; }

    .pov-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    .pov-label {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(233, 69, 96, 0.85);
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      z-index: 2;
      pointer-events: none;
    }

    /* Playback controls bar */
    .playback-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #1a1a2e;
      border-top: 1px solid #2a2a4e;
      flex-shrink: 0;
    }

    .timeline {
      flex: 1;
      height: 6px;
      background: #333;
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .timeline-progress {
      height: 100%;
      background: #e94560;
      border-radius: 3px;
      width: 0%;
      pointer-events: none;
    }

    .time-display {
      font-size: 12px;
      color: #aaa;
      min-width: 90px;
      text-align: center;
    }

    /* ========== RIGHT PANEL (sections 2 & 3) ========== */
    .right-panel {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #12122a;
      border-left: 2px solid #1a1a2e;
    }

    .panel-section {
      padding: 10px;
    }

    .panel-section h3 {
      color: #e94560;
      font-size: 13px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Section 2: Member list */
    .members-section {
      flex: 1;
      overflow-y: auto;
      border-bottom: 1px solid #2a2a4e;
    }

    .members-section::-webkit-scrollbar { width: 5px; }
    .members-section::-webkit-scrollbar-track { background: #111; }
    .members-section::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    .member-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
      font-size: 13px;
    }

    .member-row:hover { background: #1a1a3e; }
    .member-row.active { background: #e94560; color: white; }

    .member-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #44ff88;
      flex-shrink: 0;
    }

    .member-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Section 3: Audio controls */
    .audio-section {
      max-height: 220px;
      overflow-y: auto;
      border-top: 1px solid #2a2a4e;
    }

    .audio-section::-webkit-scrollbar { width: 5px; }
    .audio-section::-webkit-scrollbar-track { background: #111; }
    .audio-section::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    .audio-row {
      padding: 4px 8px;
    }

    .audio-row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 5px 0;
      font-size: 13px;
    }

    .audio-row-header:hover { color: #e94560; }

    .audio-arrow {
      font-size: 10px;
      transition: transform 0.2s;
      color: #888;
    }

    .audio-arrow.open { transform: rotate(90deg); }

    .audio-dropdown {
      display: none;
      padding: 6px 0 6px 8px;
    }

    .audio-dropdown.open { display: block; }

    .audio-control-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 4px;
    }

    .audio-control-row label {
      width: 50px;
      flex-shrink: 0;
    }

    .audio-control-row input[type="range"] {
      flex: 1;
      accent-color: #e94560;
      height: 4px;
    }

    .mute-btn {
      background: none;
      border: 1px solid #555;
      color: #aaa;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
    }

    .mute-btn:hover { border-color: #e94560; color: #e94560; }
    .mute-btn.muted { background: #e94560; color: white; border-color: #e94560; }

    /* ========== SECTION 4: EXPORT BAR (bottom) ========== */
    .export-bar {
      height: 140px;
      flex-shrink: 0;
      background: #16213e;
      border-top: 2px solid #e94560;
      display: flex;
      flex-direction: column;
    }

    .export-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid #2a2a4e;
    }

    .export-header h3 {
      color: #e94560;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .export-actions {
      display: flex;
      gap: 8px;
    }

    .export-timeline {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 8px 16px;
      overflow-x: auto;
      gap: 6px;
    }

    .export-timeline::-webkit-scrollbar { height: 6px; }
    .export-timeline::-webkit-scrollbar-track { background: #111; }
    .export-timeline::-webkit-scrollbar-thumb { background: #e94560; border-radius: 3px; }

    .export-clip {
      min-width: 120px;
      height: 70px;
      background: #0f3460;
      border: 1px solid #2a2a5e;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: grab;
      flex-shrink: 0;
      transition: border-color 0.15s;
      padding: 4px 8px;
      text-align: center;
    }

    .export-clip:hover { border-color: #e94560; }
    .export-clip.selected { border-color: #e94560; background: #1a3a6e; }

    .export-clip-name {
      color: #e94560;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .export-clip-duration {
      color: #888;
      font-size: 10px;
    }

    /* ========== EMPTY STATE ========== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #444;
      font-size: 16px;
      gap: 10px;
    }

    .empty-state .monkey { font-size: 48px; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <h1>🙈 Peak-Abu Player</h1>
    <div class="join-bar">
      <input type="text" id="sessionInput" placeholder="Session code" maxlength="6" />
      <button class="btn" onclick="loadSession()">Load Session</button>
    </div>
  </div>

  <!-- MAIN AREA -->
  <div class="main-layout">

    <!-- SECTION 1: VIDEO AREA -->
    <div class="video-area">
      <div class="video-grid" id="videoGrid">
        <div class="empty-state">
          <div class="monkey">🙈</div>
          <div>Enter a session code to watch multi-POV highlights</div>
        </div>
      </div>

      <!-- Playback controls -->
      <div class="playback-controls" id="playbackControls" style="display: none;">
        <button class="btn btn-small" id="playPauseBtn" onclick="togglePlayPause()">▶</button>
        <div class="timeline" id="timeline" onclick="seekTo(event)">
          <div class="timeline-progress" id="timelineProgress"></div>
        </div>
        <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel" id="rightPanel" style="display: none;">

      <!-- SECTION 2: Member list -->
      <div class="members-section panel-section">
        <h3>Players</h3>
        <div id="memberList"></div>
      </div>

      <!-- SECTION 3: Audio controls -->
      <div class="audio-section panel-section">
        <h3>Audio</h3>
        <div id="audioControls"></div>
      </div>
    </div>
  </div>

  <!-- SECTION 4: EXPORT BAR -->
  <div class="export-bar" id="exportBar" style="display: none;">
    <div class="export-header">
      <h3>Export Studio</h3>
      <div class="export-actions">
        <button class="btn btn-small btn-secondary" onclick="selectAllClips()">Select All</button>
        <button class="btn btn-small btn-secondary" onclick="deselectAllClips()">Deselect All</button>
        <button class="btn btn-small" onclick="downloadSelected()">⬇ Download Selected</button>
      </div>
    </div>
    <div class="export-timeline" id="exportTimeline"></div>
  </div>

  <script>
    let videos = [];
    let isPlaying = false;
    let masterDuration = 0;
    let animFrameId = null;
    let focusedIndex = -1; // -1 = grid mode, 0+ = focused on that index
    let selectedExportClips = new Set();

    // ========================
    // SESSION LOADING
    // ========================

    async function loadSession() {
      const code = document.getElementById('sessionInput').value.trim().toUpperCase();
      if (!code || code.length < 4) {
        alert('Enter a valid session code');
        return;
      }

      try {
        const sessionRes = await fetch(`/sessions/${code}`);
        if (!sessionRes.ok) {
          alert('Session not found');
          return;
        }
        const session = await sessionRes.json();

        const uploadsRes = await fetch(`/sessions/${code}/uploads`);
        const uploadsData = await uploadsRes.json();

        if (!uploadsData.uploads || uploadsData.uploads.length === 0) {
          alert('No uploads in this session yet');
          return;
        }

        videos = [];
        focusedIndex = -1;

        for (const upload of uploadsData.uploads) {
          let metadata = null;
          if (upload.metadataFile) {
            try {
              const metaRes = await fetch(`/media/${code}/${upload.metadataFile}`);
              if (metaRes.ok) metadata = await metaRes.json();
            } catch (e) {
              console.log('Could not load metadata for', upload.username);
            }
          }

          const video = document.createElement('video');
          video.src = `/media/${code}/${upload.videoFile}`;
          video.preload = 'auto';
          video.muted = true;
          video.playsInline = true;

          videos.push({
            element: video,
            metadata: metadata,
            username: upload.username,
            uploadId: upload.id,
            videoFile: upload.videoFile,
            offset: 0,
            volume: 80,
            isMuted: true
          });
        }

        // Unmute first by default
        if (videos.length > 0) {
          videos[0].isMuted = false;
          videos[0].element.muted = false;
          videos[0].element.volume = 0.8;
        }

        calculateOffsets();

        // Wait for metadata to load
        await Promise.all(videos.map(v => new Promise((resolve) => {
          if (v.element.readyState >= 1) resolve();
          else {
            v.element.addEventListener('loadedmetadata', resolve, { once: true });
            v.element.addEventListener('error', resolve, { once: true });
          }
        })));

        masterDuration = Math.max(...videos.map(v => (v.element.duration || 0) + v.offset));

        // Build all UI sections
        renderVideoGrid();
        renderMemberList();
        renderAudioControls();
        renderExportTimeline();

        // Show panels
        document.getElementById('playbackControls').style.display = 'flex';
        document.getElementById('rightPanel').style.display = 'flex';
        document.getElementById('exportBar').style.display = 'flex';

        console.log(`Loaded ${videos.length} POVs for session ${code}`);

      } catch (err) {
        alert('Error loading session: ' + err.message);
        console.error(err);
      }
    }

    function calculateOffsets() {
      let earliestStart = Infinity;
      let hasMetadata = false;

      videos.forEach(v => {
        if (v.metadata && v.metadata.startTimeUTC) {
          earliestStart = Math.min(earliestStart, v.metadata.startTimeUTC);
          hasMetadata = true;
        }
      });

      if (!hasMetadata) return;

      videos.forEach(v => {
        if (v.metadata && v.metadata.startTimeUTC) {
          v.offset = (v.metadata.startTimeUTC - earliestStart) / 1000;
        }
      });
    }

    // ========================
    // SECTION 1: VIDEO GRID
    // ========================

    function renderVideoGrid() {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';

      if (focusedIndex >= 0) {
        // FOCUSED MODE: one big + horizontal strip of others
        grid.className = 'video-grid focused-mode';

        const mainContainer = document.createElement('div');
        mainContainer.className = 'focused-main';

        const mainLabel = document.createElement('div');
        mainLabel.className = 'pov-label';
        mainLabel.textContent = videos[focusedIndex].username;

        mainContainer.appendChild(mainLabel);
        mainContainer.appendChild(videos[focusedIndex].element);

        // Click main to go back to grid
        mainContainer.addEventListener('click', () => {
          focusedIndex = -1;
          renderVideoGrid();
          highlightActiveMember();
        });

        grid.appendChild(mainContainer);

        // Sidebar of other videos
        if (videos.length > 1) {
          const sidebar = document.createElement('div');
          sidebar.className = 'focused-sidebar';

          videos.forEach((v, i) => {
            if (i === focusedIndex) return;

            const container = document.createElement('div');
            container.className = 'pov-container';

            const label = document.createElement('div');
            label.className = 'pov-label';
            label.textContent = v.username;

            container.appendChild(label);
            container.appendChild(v.element);

            container.addEventListener('click', () => {
              focusOnVideo(i);
            });

            sidebar.appendChild(container);
          });

          grid.appendChild(sidebar);
        }

      } else {
        // GRID MODE: equal sized
        const count = videos.length;
        let gridClass = 'grid-' + Math.min(count, 9);
        if (count >= 10) gridClass = 'grid-10plus';
        grid.className = 'video-grid ' + gridClass;

        videos.forEach((v, i) => {
          const container = document.createElement('div');
          container.className = 'pov-container';

          const label = document.createElement('div');
          label.className = 'pov-label';
          label.textContent = v.username;

          container.appendChild(label);
          container.appendChild(v.element);

          container.addEventListener('click', () => {
            focusOnVideo(i);
          });

          grid.appendChild(container);
        });
      }
    }

    function focusOnVideo(index) {
      focusedIndex = index;
      renderVideoGrid();
      highlightActiveMember();
    }

    // ========================
    // SECTION 2: MEMBER LIST
    // ========================

    function renderMemberList() {
      const list = document.getElementById('memberList');
      list.innerHTML = '';

      videos.forEach((v, i) => {
        const row = document.createElement('div');
        row.className = 'member-row' + (i === focusedIndex ? ' active' : '');
        row.id = 'member-row-' + i;

        const dot = document.createElement('div');
        dot.className = 'member-dot';

        const name = document.createElement('div');
        name.className = 'member-name';
        name.textContent = v.username;

        row.appendChild(dot);
        row.appendChild(name);

        row.addEventListener('click', () => {
          focusOnVideo(i);
        });

        list.appendChild(row);
      });
    }

    function highlightActiveMember() {
      document.querySelectorAll('.member-row').forEach((row, i) => {
        row.classList.toggle('active', i === focusedIndex);
      });
    }

    // ========================
    // SECTION 3: AUDIO CONTROLS
    // ========================

    function renderAudioControls() {
      const container = document.getElementById('audioControls');
      container.innerHTML = '';

      videos.forEach((v, i) => {
        const row = document.createElement('div');
        row.className = 'audio-row';

        // Header (click to expand)
        const header = document.createElement('div');
        header.className = 'audio-row-header';

        const headerName = document.createElement('span');
        headerName.textContent = v.username;

        const arrow = document.createElement('span');
        arrow.className = 'audio-arrow';
        arrow.textContent = '▶';

        header.appendChild(headerName);
        header.appendChild(arrow);

        // Dropdown content
        const dropdown = document.createElement('div');
        dropdown.className = 'audio-dropdown';

        // Volume slider
        const volRow = document.createElement('div');
        volRow.className = 'audio-control-row';

        const volLabel = document.createElement('label');
        volLabel.textContent = 'Volume';

        const volSlider = document.createElement('input');
        volSlider.type = 'range';
        volSlider.min = '0';
        volSlider.max = '100';
        volSlider.value = v.volume;
        volSlider.addEventListener('input', () => {
          v.volume = parseInt(volSlider.value);
          v.element.volume = v.volume / 100;
          if (v.volume > 0 && v.isMuted) {
            v.isMuted = false;
            v.element.muted = false;
            muteBtn.classList.remove('muted');
            muteBtn.textContent = 'Mute';
          }
        });

        volRow.appendChild(volLabel);
        volRow.appendChild(volSlider);

        // Mute button
        const muteRow = document.createElement('div');
        muteRow.className = 'audio-control-row';

        const muteBtn = document.createElement('button');
        muteBtn.className = 'mute-btn' + (v.isMuted ? ' muted' : '');
        muteBtn.textContent = v.isMuted ? 'Unmute' : 'Mute';
        muteBtn.addEventListener('click', () => {
          v.isMuted = !v.isMuted;
          v.element.muted = v.isMuted;
          muteBtn.classList.toggle('muted');
          muteBtn.textContent = v.isMuted ? 'Unmute' : 'Mute';
        });

        // Solo button (mute everyone else)
        const soloBtn = document.createElement('button');
        soloBtn.className = 'mute-btn';
        soloBtn.textContent = 'Solo';
        soloBtn.addEventListener('click', () => {
          videos.forEach((other, j) => {
            if (j === i) {
              other.isMuted = false;
              other.element.muted = false;
            } else {
              other.isMuted = true;
              other.element.muted = true;
            }
          });
          renderAudioControls();
        });

        muteRow.appendChild(muteBtn);
        muteRow.appendChild(soloBtn);

        dropdown.appendChild(volRow);
        dropdown.appendChild(muteRow);

        // Toggle dropdown on click
        header.addEventListener('click', () => {
          dropdown.classList.toggle('open');
          arrow.classList.toggle('open');
        });

        row.appendChild(header);
        row.appendChild(dropdown);
        container.appendChild(row);
      });
    }

    // ========================
    // SECTION 4: EXPORT
    // ========================

    function renderExportTimeline() {
      const timeline = document.getElementById('exportTimeline');
      timeline.innerHTML = '';
      selectedExportClips.clear();

      videos.forEach((v, i) => {
        const clip = document.createElement('div');
        clip.className = 'export-clip';
        clip.id = 'export-clip-' + i;

        const name = document.createElement('div');
        name.className = 'export-clip-name';
        name.textContent = v.username;

        const duration = document.createElement('div');
        duration.className = 'export-clip-duration';
        const dur = v.element.duration || 0;
        duration.textContent = formatTime(dur) + ' • ' + (v.metadata ? Math.round((v.metadata.durationMs || dur * 1000) / 1000) + 's' : formatTime(dur));

        clip.appendChild(name);
        clip.appendChild(duration);

        clip.addEventListener('click', () => {
          clip.classList.toggle('selected');
          if (selectedExportClips.has(i)) {
            selectedExportClips.delete(i);
          } else {
            selectedExportClips.add(i);
          }
        });

        timeline.appendChild(clip);
      });
    }

    function selectAllClips() {
      videos.forEach((v, i) => {
        selectedExportClips.add(i);
        const el = document.getElementById('export-clip-' + i);
        if (el) el.classList.add('selected');
      });
    }

    function deselectAllClips() {
      selectedExportClips.clear();
      document.querySelectorAll('.export-clip').forEach(el => el.classList.remove('selected'));
    }

    function downloadSelected() {
      if (selectedExportClips.size === 0) {
        alert('Select at least one clip to download');
        return;
      }

      // Download each selected clip
      selectedExportClips.forEach(i => {
        const v = videos[i];
        const link = document.createElement('a');
        link.href = v.element.src;
        link.download = `${v.username}_highlight.mp4`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
    }

    // ========================
    // PLAYBACK CONTROLS
    // ========================

    function togglePlayPause() {
      if (isPlaying) pauseAll();
      else playAll();
    }

    function playAll() {
      videos.forEach(v => v.element.play().catch(() => {}));
      isPlaying = true;
      document.getElementById('playPauseBtn').textContent = '⏸';
      startProgressUpdate();
    }

    function pauseAll() {
      videos.forEach(v => v.element.pause());
      isPlaying = false;
      document.getElementById('playPauseBtn').textContent = '▶';
      if (animFrameId) cancelAnimationFrame(animFrameId);
    }

    function seekTo(event) {
      const timeline = document.getElementById('timeline');
      const rect = timeline.getBoundingClientRect();
      const fraction = (event.clientX - rect.left) / rect.width;
      const targetTime = fraction * masterDuration;

      videos.forEach(v => {
        const adjustedTime = targetTime - v.offset;
        if (adjustedTime < 0) {
          v.element.currentTime = 0;
          v.element.pause();
        } else if (adjustedTime > v.element.duration) {
          v.element.currentTime = v.element.duration;
        } else {
          v.element.currentTime = adjustedTime;
          if (isPlaying) v.element.play().catch(() => {});
        }
      });
    }

    function startProgressUpdate() {
      function update() {
        if (!isPlaying) return;

        const masterTime = (videos[0]?.element.currentTime || 0) + (videos[0]?.offset || 0);
        const fraction = masterDuration > 0 ? masterTime / masterDuration : 0;
        document.getElementById('timelineProgress').style.width = (fraction * 100) + '%';
        document.getElementById('timeDisplay').textContent =
          formatTime(masterTime) + ' / ' + formatTime(masterDuration);

        const allEnded = videos.every(v => v.element.ended || v.element.paused);
        if (allEnded && isPlaying) {
          pauseAll();
          return;
        }

        animFrameId = requestAnimationFrame(update);
      }
      update();
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }
  </script>
</body>
