<!DOCTYPE html>
<html>
<head>
  <title>Peak-Abu – Multi-POV Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a1611;
      color: #c8d6cd;
      font-family: 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #12251a;
      border-bottom: 2px solid #1d9e75;
      flex-shrink: 0;
      height: 50px;
    }

    .header h1 { color: #39d3a0; font-size: 20px; }

    .join-bar { display: flex; gap: 8px; align-items: center; }

    .join-bar input {
      padding: 6px 12px;
      background: #0c1c14;
      color: #e8f5ec;
      border: 1px solid #24402e;
      border-radius: 6px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 3px;
      width: 130px;
      text-align: center;
    }
    .join-bar input:focus { border-color: #39d3a0; outline: none; }

    .join-bar input::placeholder { color: #45604f; text-transform: none; letter-spacing: normal; }

    .btn {
      padding: 6px 16px;
      background: #1d9e75;
      color: #04140d;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #23b686; }
    .btn:disabled { background: #14291d; color: #45604f; cursor: not-allowed; }
    .btn-small { padding: 4px 10px; font-size: 12px; }
    .btn-secondary { background: #14291d; border: 1px solid #2a4636; color: #8fbfa3; font-weight: 500; }
    .btn-secondary:hover { background: #16321f; border-color: #39d3a0; color: #39d3a0; }

    .btn-paste {
      padding: 6px 10px;
      background: #0c1c14;
      color: #39d3a0;
      border: 1px solid #39d3a0;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-paste:hover { background: #16321f; }
    .btn-paste.pasted { background: #4fe0b0; border-color: #4fe0b0; color: #04140d; }

    .main-layout { display: flex; flex: 1; min-height: 0; }

    .video-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 2px solid #12251a;
    }

    .video-grid {
      flex: 1;
      display: grid;
      grid-auto-rows: 1fr;
      gap: 3px;
      padding: 3px;
      overflow-y: auto;
      min-height: 0;
    }

    .video-grid::-webkit-scrollbar { width: 6px; }
    .video-grid::-webkit-scrollbar-track { background: #04140d; }
    .video-grid::-webkit-scrollbar-thumb { background: #24402e; border-radius: 3px; }

    .grid-1 { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
    .grid-5, .grid-6 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-7, .grid-8, .grid-9 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-10plus { grid-template-columns: 1fr 1fr 1fr 1fr; }

    .video-grid.focused-mode { display: flex; flex-direction: column; gap: 0; padding: 0; }

    .focused-main { flex: 1; min-height: 60%; position: relative; background: #000; }
    .focused-main video { width: 100%; height: 100%; object-fit: contain; }

    .focused-sidebar {
      height: 25%;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 3px;
      padding: 3px;
      background: #04140d;
      flex-shrink: 0;
    }

    .focused-sidebar::-webkit-scrollbar { height: 6px; }
    .focused-sidebar::-webkit-scrollbar-track { background: #04140d; }
    .focused-sidebar::-webkit-scrollbar-thumb { background: #24402e; border-radius: 3px; }

    .focused-sidebar .pov-container { min-width: 180px; height: 100%; cursor: pointer; }

    .pov-container {
      position: relative;
      background: #04140d;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }
    .pov-container:hover { border-color: #39d3a0; }
    .pov-container.active { border-color: #39d3a0; }

    .pov-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    .pov-label {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(57, 211, 160, 0.9);
      color: #04140d;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      z-index: 2;
      pointer-events: none;
    }

    .pov-placeholder {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a1611;
      color: #45604f;
      font-size: 13px;
      gap: 8px;
      cursor: pointer;
    }

    .pov-placeholder .play-icon { font-size: 32px; color: #39d3a0; opacity: 0.6; }
    .pov-placeholder .load-hint { font-size: 11px; color: #3a5244; }

    .pov-loading {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a1611;
      color: #39d3a0;
      font-size: 13px;
    }

    .pov-missing {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a1611;
      color: #45604f;
      font-size: 13px;
      gap: 8px;
    }
    .pov-missing .monkey { font-size: 32px; }
    .pov-missing .missing-name { color: #39d3a0; font-weight: bold; font-size: 12px; }
    .pov-missing .missing-text { font-size: 11px; color: #3a5244; }

    .pov-processing {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a1611;
      color: #d8a838;
      font-size: 13px;
      gap: 8px;
    }
    .pov-processing .spinner { font-size: 28px; animation: spin 2s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .pov-processing .proc-name { color: #39d3a0; font-weight: bold; font-size: 12px; }
    .pov-processing .proc-text { font-size: 11px; color: #7a9686; }

    /* ========================
       LOCAL CLIPS
    ======================== */
    .local-badge {
      position: absolute;
      top: 6px;
      right: 36px;
      background: rgba(79, 224, 176, 0.85);
      color: #04140d;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      z-index: 3;
      pointer-events: none;
    }

    .local-status-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      background: #0c1c14;
      border: 1px solid #24402e;
      border-radius: 6px;
      font-size: 11px;
      color: #8fbfa3;
      margin-left: 8px;
      white-space: nowrap;
    }
    .local-status-bar.active { display: flex; }
    .local-status-bar .local-count { color: #4fe0b0; font-weight: 700; }
    .local-status-bar .local-dismiss {
      background: none; border: none; color: #5f7a6a; cursor: pointer;
      font-size: 14px; padding: 0 2px; line-height: 1;
    }
    .local-status-bar .local-dismiss:hover { color: #f0857a; }

    .btn-local {
      padding: 6px 10px;
      background: #0c1c14;
      color: #8fbfa3;
      border: 1px solid #2a4636;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-local:hover { background: #16321f; border-color: #39d3a0; color: #39d3a0; }
    .btn-local.loaded { background: #16321f; border-color: #4fe0b0; color: #4fe0b0; }

    /* ========================
       SESSION TIMELINE
    ======================== */
    .session-timeline {
      flex-shrink: 0;
      background: #12251a;
      border-top: 1px solid #1e3527;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .timeline-top-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-display { font-size: 12px; color: #8fbfa3; min-width: 90px; text-align: center; }

    .timeline-track-wrap { flex: 1; }

    .timeline-track {
      position: relative;
      height: 36px;
      background: #0a1611;
      border-radius: 6px;
      border: 1px solid #1e3527;
      cursor: pointer;
      overflow: hidden;
      user-select: none;
    }

    .highlight-block {
      position: absolute;
      top: 4px;
      height: calc(100% - 8px);
      background: #0c1c14;
      border: 1px solid #24402e;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: #39d3a0;
      cursor: pointer;
      transition: background 0.15s;
      min-width: 28px;
      overflow: hidden;
      white-space: nowrap;
    }

    .highlight-block:hover { background: #16321f; border-color: #39d3a0; }
    .highlight-block.active { background: #39d3a0; color: #04140d; border-color: #4fe0b0; }

    .timeline-needle {
      position: absolute;
      top: 0;
      width: 2px;
      height: 100%;
      background: rgba(255,255,255,0.9);
      pointer-events: none;
      z-index: 10;
      transform: translateX(-1px);
    }

    .timeline-track:hover .timeline-needle {
      width: 4px;
      transform: translateX(-2px);
      background: #39d3a0;
      transition: width 0.15s, background 0.15s;
    }

    .timeline-track:hover {
      height: 44px;
      margin-top: -4px;
      margin-bottom: -4px;
      transition: height 0.15s;
    }

    /* ========================
       RIGHT PANEL
    ======================== */
    .right-panel {
      width: 150px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      background: #0f2318;
      border-left: 2px solid #12251a;
    }

    .panel-section { padding: 10px; }

    .panel-section h3 {
      color: #39d3a0;
      font-size: 13px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: sticky;
      top: -10px;
      background: #0f2318;
      padding: 4px 0;
      z-index: 2;
    }

    /* Players and Audio each take half the panel so the divider sits at the
       vertical centre, and both scroll independently. */
    .members-section { flex: 0 1 auto; max-height: 42vh; overflow-y: auto; border-bottom: 1px solid #1e3527; }
    .members-section::-webkit-scrollbar { width: 5px; }
    .members-section::-webkit-scrollbar-track { background: #04140d; }
    .members-section::-webkit-scrollbar-thumb { background: #24402e; border-radius: 3px; }

    .audio-section { flex: 0 1 auto; max-height: 42vh; overflow-y: auto; border-top: 1px solid #1e3527; }
    .audio-section::-webkit-scrollbar { width: 5px; }
    .audio-section::-webkit-scrollbar-track { background: #04140d; }
    .audio-section::-webkit-scrollbar-thumb { background: #24402e; border-radius: 3px; }

    .panel-row { padding: 2px 8px; }

    .panel-row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 6px 0;
      font-size: 13px;
    }
    .panel-row-header:hover { color: #39d3a0; }
    .panel-row-header.focused { color: #39d3a0; }

    .panel-row-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .member-dot { width: 8px; height: 8px; border-radius: 50%; background: #4fe0b0; flex-shrink: 0; }
    .member-dot.unloaded { background: #45604f; }
    .member-dot.missing { background: #f0857a; }
    .member-dot.processing { background: #d8a838; }
    .member-dot.local { background: #4fe0b0; box-shadow: 0 0 4px #4fe0b0; }

    .panel-row-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .audio-arrow { font-size: 10px; transition: transform 0.2s; color: #7a9686; flex-shrink: 0; }
    .audio-arrow.open { transform: rotate(90deg); }

    .panel-row-dropdown { display: none; padding: 4px 0 6px 16px; }
    .panel-row-dropdown.open { display: block; }

    .player-hl-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      font-size: 11px;
      color: #8fbfa3;
      cursor: default;
    }
    .player-hl-item.has-clip { cursor: pointer; }
    .player-hl-item.has-clip:hover { color: #39d3a0; }
    .player-hl-item.current-hl { color: #39d3a0; font-weight: bold; }

    .hl-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .audio-control-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      font-size: 11px;
      color: #8fbfa3;
      margin-bottom: 6px;
    }
    .audio-control-row label { width: auto; flex-shrink: 0; }
    .audio-control-row input[type="range"] { width: 100%; accent-color: #39d3a0; height: 4px; }
    .audio-control-row.buttons-row { flex-direction: row; gap: 6px; }
    .audio-control-row.buttons-row .mute-btn { flex: 1; }

    .mute-btn {
      background: none;
      border: 1px solid #45604f;
      color: #8fbfa3;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
    }
    .mute-btn:hover { border-color: #39d3a0; color: #39d3a0; }
    .mute-btn.muted { background: #39d3a0; color: #04140d; border-color: #39d3a0; }

    /* ========================
       EXPORT BAR
    ======================== */
    .export-bar {
      min-height: 140px;
      flex-shrink: 0;
      background: #0f2318;
      border-top: 2px solid #1d9e75;
      display: flex;
      flex-direction: column;
    }

    .export-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid #1e3527;
    }

    .export-header h3 { color: #39d3a0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    .export-actions { display: flex; gap: 8px; }

    .export-timeline {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 8px 16px;
      overflow-x: auto;
      gap: 6px;
    }

    .export-timeline::-webkit-scrollbar { height: 6px; }
    .export-timeline::-webkit-scrollbar-track { background: #04140d; }
    .export-timeline::-webkit-scrollbar-thumb { background: #24402e; border-radius: 3px; }

    .export-hl-label {
      flex-shrink: 0;
      align-self: stretch;
      display: flex;
      align-items: center;
      padding: 0 8px 0 10px;
      font-size: 11px;
      font-weight: bold;
      color: #7a9686;
      border-left: 2px solid #24402e;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .export-hl-label:hover { color: #39d3a0; }
    .export-hl-label.current { color: #39d3a0; border-left-color: #39d3a0; }

    .export-clip {
      min-width: 120px;
      height: 70px;
      background: #0c1c14;
      border: 2px solid #24402e;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s;
      padding: 4px 8px;
      text-align: center;
      user-select: none;
      position: relative;
    }
    .export-clip::after {
      content: '';
      position: absolute;
      top: 6px; right: 6px;
      width: 14px; height: 14px;
      border: 2px solid #24402e;
      border-radius: 3px;
      background: transparent;
      transition: all 0.15s;
    }
    .export-clip:hover { border-color: #39d3a0; }
    .export-clip:hover::after { border-color: #39d3a0; }
    .export-clip.selected { border-color: #39d3a0; background: #16321f; }
    .export-clip.selected::after {
      background: #39d3a0;
      border-color: #39d3a0;
      content: '✓';
      color: #04140d;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .export-clip.disabled { opacity: 0.5; cursor: not-allowed; }
    .export-clip.disabled:hover { border-color: #24402e; }

    .composite-section {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #1e3527;
      flex-shrink: 0;
    }

    .composite-status { font-size: 12px; color: #7a9686; flex: 1; }
    .composite-status.ready { color: #4fe0b0; }
    .composite-status.processing { color: #d8a838; }
    .composite-status.failed { color: #f0857a; }

    .progress-bar { width: 140px; height: 6px; background: #1e3527; border-radius: 3px; overflow: hidden; flex-shrink: 0; }

    .progress-fill {
      height: 100%;
      background: #d8a838;
      border-radius: 3px;
      width: 0%;
      transition: width 0.3s;
      animation: indeterminate 1.5s infinite;
    }

    @keyframes indeterminate {
      0% { width: 20%; margin-left: 0%; }
      50% { width: 40%; margin-left: 40%; }
      100% { width: 20%; margin-left: 80%; }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #3a5244;
      font-size: 16px;
      gap: 10px;
    }
    .empty-state .monkey { font-size: 48px; }
    .empty-state .expired-msg { color: #d8a838; font-size: 14px; }

    .share-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: #0c1c14;
      border: 1px solid #1e3527;
      border-radius: 6px;
      margin-left: 12px;
      max-width: 320px;
    }

    .share-url {
      flex: 1;
      font-size: 12px;
      color: #8fbfa3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
    }

    /* Export select checkbox on POV tiles */
    .pov-export-check {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 26px;
      height: 26px;
      background: rgba(18, 37, 26, 0.85);
      border: 2px solid #45604f;
      border-radius: 6px;
      color: #7a9686;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 11;
      transition: all 0.15s;
      line-height: 1;
    }
    .pov-export-check:hover { border-color: #39d3a0; color: #39d3a0; background: rgba(18, 37, 26, 0.95); }
    .pov-export-check.selected { background: #39d3a0; border-color: #39d3a0; color: #04140d; }

    .pov-nudge-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 28px;
      background: rgba(0, 0, 0, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }
    .pov-container:hover .pov-nudge-bar,
    .pov-container.active .pov-nudge-bar { opacity: 1; pointer-events: auto; }
    .nudge-btn {
      background: rgba(57, 211, 160, 0.15);
      border: 1px solid #39d3a0;
      color: #39d3a0;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.1s;
    }
    .nudge-btn:hover { background: rgba(57, 211, 160, 0.4); }
    .nudge-readout {
      font-size: 11px;
      color: #c8d6cd;
      min-width: 52px;
      text-align: center;
      font-family: 'Consolas', 'Courier New', monospace;
      letter-spacing: 0.5px;
    }
    .nudge-readout.nonzero { color: #39d3a0; }

    .btn-copy {
      background: none;
      border: 1px solid #39d3a0;
      color: #39d3a0;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-copy:hover { background: #39d3a0; color: #04140d; }
    .btn-copy.copied { background: #4fe0b0; border-color: #4fe0b0; color: #04140d; }

    /* ========================
       CONSOLIDATED HEADER
    ======================== */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: flex-end;
    }
    .session-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .session-input-wrap input {
      background: #0c1c14;
      color: #c8d6cd;
      border: 1px solid #24402e;
      border-radius: 6px;
      padding: 6px 32px 6px 12px;
      font-size: 13px;
      width: 140px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .session-input-wrap input:focus { outline: none; border-color: #39d3a0; }
    .input-icon-btn {
      position: absolute;
      right: 4px;
      background: none;
      border: none;
      color: #7a9686;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .input-icon-btn:hover { color: #39d3a0; background: rgba(57, 211, 160, 0.1); }
    .input-icon-btn.pasted { color: #4fe0b0; }
    .btn-icon {
      padding: 6px 10px !important;
      font-size: 14px !important;
    }

    /* Settings dropdown */
    .settings-panel {
      position: absolute;
      top: 60px;
      right: 20px;
      background: #0c1c14;
      border: 1px solid #24402e;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 100;
    }
    .settings-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .local-status {
      font-size: 11px;
      color: #8fbfa3;
    }
    .settings-close {
      background: none;
      border: none;
      color: #7a9686;
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .settings-close:hover { color: #ff6b6b; background: rgba(255,107,107,0.1); }

    /* ========================
       INLINE SELECTION STRIP — appears below session timeline
    ======================== */
    .selection-bar {
      background: #0c1c14;
      border-top: 1px solid #24402e;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .selection-info {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .selection-count {
      font-size: 12px;
      font-weight: 700;
      color: #39d3a0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .selection-detail {
      font-size: 11px;
      color: #8fbfa3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .selection-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn-clear-selection {
      background: none;
      border: 1px solid transparent;
      color: #7a9686;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      margin-left: 2px;
    }
    .btn-clear-selection:hover { color: #ff6b6b; border-color: #ff6b6b; }

    /* ========================
       EXPORT PANEL (composite / AI reel) — modal-style
    ======================== */
    .export-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #0c1c14;
      border: 1px solid #24402e;
      border-radius: 12px;
      width: min(720px, 95vw);
      max-height: 70vh;
      overflow-y: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      z-index: 199;
      animation: fadeIn 0.15s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .export-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #24402e;
    }
    .export-panel-header h3 {
      margin: 0;
      font-size: 14px;
      color: #39d3a0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ========================
       HIGHLIGHTS COLUMN — vertical, scrollable H-pill list. Replaces the
       old horizontal pill row on the scrub bar, which only had room for
       ~30 before pills ran off-screen unreachable.
    ======================== */
    .highlights-column {
      width: 130px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #0f2318;
      border-left: 2px solid #12251a;
    }
    .highlights-column h3 {
      color: #39d3a0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 10px 6px;
      border-bottom: 1px solid #1e3527;
      flex-shrink: 0;
    }
    .hl-pill-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-height: 0;
    }
    .hl-pill-list::-webkit-scrollbar { width: 5px; }
    .hl-pill-list::-webkit-scrollbar-track { background: #04140d; }
    .hl-pill-list::-webkit-scrollbar-thumb { background: #24402e; border-radius: 3px; }

    /* Locked (permanent, past the 4h window) is the DEFAULT look — plain
       green pill, same as the original horizontal bar. Nothing extra is
       rendered on these; they're done, no action possible. */
    .hl-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 7px;
      background: #0c1c14;
      border: 1px solid #24402e;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: #39d3a0;
      transition: border-color 0.15s, color 0.15s;
      position: relative;
      overflow: hidden;
    }
    /* Grows toward the 4h delete-window expiry. Absolutely positioned
       behind the label/icon so it reads as a fill without disturbing
       layout — updates every 30s off the existing repaint interval. */
    .hl-pill-fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      background: linear-gradient(90deg, rgba(240,133,122,0.28), rgba(240,133,122,0.5));
      z-index: 0;
      transition: width 1s linear;
      pointer-events: none;
    }
    .hl-pill > *:not(.hl-pill-fill) { position: relative; z-index: 1; }
    .hl-pill:hover { border-color: #39d3a0; }
    .hl-pill.active { background: #39d3a0; color: #04140d; border-color: #4fe0b0; }
    /* Still within the 4h delete window — the only state that gets extra
       chrome (unlock icon + checkbox), since it's the only one with an
       action available. */
    .hl-pill.temp { color: #d8a838; }
    .hl-pill.selected-delete { border-color: #f0857a; background: #2a1218; color: #f0a5bd; }

    .hl-pill-lock-icon { font-size: 9px; margin-right: 3px; flex-shrink: 0; }

    .hl-select-check {
      width: 14px; height: 14px;
      border-radius: 3px;
      border: 1.5px solid #45604f;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px;
      color: #7a9686;
      flex-shrink: 0;
      cursor: pointer;
    }
    .hl-pill.selected-delete .hl-select-check {
      background: #f0857a; border-color: #f0857a; color: #2a1218;
    }

    .hl-delete-bar {
      display: none;
      flex-shrink: 0;
      padding: 8px;
      border-top: 1px solid #1e3527;
    }
    .hl-delete-bar.show { display: block; }
    .hl-delete-bar button {
      width: 100%;
      padding: 6px;
      background: #3a1622;
      border: 1px solid #7a3149;
      color: #f0a5bd;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .hl-delete-bar button:hover { background: #481b2b; }
    .hl-delete-bar button:disabled { opacity: 0.5; cursor: not-allowed; }

    .hl-pill-empty { font-size: 10px; color: #3a5244; text-align: center; padding: 16px 6px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>&#x1F648; Peak-Abu Player</h1>

    </div>

  <div class="main-layout">

      <!-- SESSION TIMELINE -->

          <div class="timeline-track-wrap">

             <div class="timeline-needle" id="timelineNeedle" style="left:0%"></div>
            </div>

      </div>

      <!-- INLINE SELECTION STRIP — appears below timeline when clips selected -->
      <div class="selection-bar" id="selectionBar" style="display:none;">
        <div class="selection-info">
          <div class="selection-count"><span id="selCount">0</span> selected</div>
          <div class="selection-detail" id="selDetail"></div>

        <div class="selection-actions">
          <button class="btn btn-small btn-secondary" onclick="selectAllClips()">All</button>
          <button class="btn btn-small" onclick="downloadSelected(event)">&#11015; Download</button>
          <button class="btn btn-small btn-secondary" id="compositeBtn" onclick="openExportPanel('composite')" disabled>&#127916; Combined</button>
          <button class="btn btn-small btn-secondary" id="aireelOpenBtn" onclick="openExportPanel('aireel')">&#129302; AI Reel</button>

    <div class="right-panel" id="rightPanel" style="display:none;">

    <div class="highlights-column" id="highlightsColumn" style="display:none;">

      <div class="hl-delete-bar" id="hlDeleteBar">
        <button onclick="deleteSelectedHighlights()" id="hlDeleteBtn">Delete (<span id="hlDelCount">0</span>)</button>
      </div>
    </div>
  </div>

  <!-- EXPANDED EXPORT PANEL — opens only when composite/AI reel job is starting -->
  <div class="export-panel" id="exportPanel" style="display:none;">
    <div class="export-panel-header">
      <h3 id="exportPanelTitle">Export</h3>
      <button class="settings-close" onclick="closeExportPanel()" title="Close">&#x2715;</button>
    </div>
    <div class="composite-section" id="compositeSection" style="display:none;">
      <div class="composite-status" id="compositeStatus"></div>
      <div class="progress-bar" id="compositeProgressBar" style="display:none;">
        <div class="progress-fill" id="compositeFill"></div>
      </div>
      <button class="btn btn-small" onclick="startComposite()" style="margin:8px 16px;">Start Combined View Export</button>
    </div>
    <div class="composite-section" id="aireelSection" style="display:none;flex-wrap:wrap;gap:8px;padding:8px 16px;">
     <div style="width:100%;font-size:13px;color:#39d3a0;font-weight:600;">🎞 AI Highlight Reel <span style="color:#7a9686;font-weight:normal;">(T3/T4 — free during beta)</span></div>
     <div>
       <label style="font-size:11px;color:#7a9686;display:block;">Length</label>
       <select id="aireelLength" style="background:#0c1c14;color:#c8d6cd;border:1px solid #24402e;border-radius:4px;padding:4px 8px;">
         <option value="30">30s</option>
         <option value="60" selected>60s</option>
         <option value="90">90s</option>
         <option value="120">2 min</option>
         <option value="180">3 min</option>
         <option value="300">5 min</option>
       </select>
     </div>
     <div>
       <label style="font-size:11px;color:#7a9686;display:block;">Game</label>
       <input type="text" id="aireelGame" placeholder="e.g. Apex Legends" style="background:#0c1c14;color:#c8d6cd;border:1px solid #24402e;border-radius:4px;padding:4px 8px;width:160px;" />
     </div>
     <div style="flex:1;min-width:220px;">
       <label style="font-size:11px;color:#7a9686;display:block;">Style notes for the AI editor (saved per game)</label>
       <input type="text" id="aireelStyle" placeholder="e.g. keep clutches long, cut fast on kills" style="background:#0c1c14;color:#c8d6cd;border:1px solid #24402e;border-radius:4px;padding:4px 8px;width:100%;" />
     </div>
     <button class="btn btn-small" id="aireelBtn" onclick="startAiReel()">🤖 Generate AI Reel</button>
     <div id="aireelStatus" style="width:100%;font-size:12px;color:#7a9686;margin-top:4px;"></div>
     <div id="aireelReport" style="width:100%;font-size:12px;color:#8fbfa3;background:#0a1611;border-left:2px solid #39d3a0;padding:8px 12px;display:none;white-space:pre-wrap;"></div>
    </div>
  </div>

  <!-- Legacy no-op targets kept so old rendering code doesn't crash -->
  <div id="exportBar" style="display:none;"></div>
  <div id="exportTimeline" style="display:none;"></div>
  <span id="exportCurrentHl" style="display:none;"></span>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      if (code) {
        document.getElementById('sessionInput').value = code.toUpperCase();
        loadSession();
      }
    });

    // Background tabs get their setInterval throttled/suspended by the
    // browser — that's almost certainly why auto-refresh appeared to stop
    // working. Force a catch-up refresh the moment the tab is visible again.
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden && currentSessionCode) refreshUploads();
    });

    // Fill bars drain purely with elapsed time — repaint them periodically
    // even with no new uploads, so a pill visibly approaches "locked".
    setInterval(function() {
      if (highlights.length > 0) renderHighlightsColumn();
    }, 30000);

    // Allow Enter key to load session
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('sessionInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') loadSession();
      });
    });

    // ========================
    // PASTE & LOAD
    // ========================

    async function pasteAndLoad() {
      const btn = document.getElementById('pasteBtn');
      try {
        const text = await navigator.clipboard.readText();
        const cleaned = text.trim().toUpperCase().replace(/[^A-Z0-9]/g, '').substring(0, 6);
        if (cleaned.length < 4) {
          btn.textContent = '\u274C Invalid';
          setTimeout(() => { btn.textContent = '\u{1F4CB} Paste'; }, 1500);
          return;
        }
        document.getElementById('sessionInput').value = cleaned;
        btn.textContent = '\u2705 Pasted!';
        btn.classList.add('pasted');
        setTimeout(() => { btn.textContent = '\u{1F4CB} Paste'; btn.classList.remove('pasted'); }, 1500);
        loadSession();
      } catch (e) {
        btn.textContent = '\u274C Denied';
        setTimeout(() => { btn.textContent = '\u{1F4CB} Paste'; }, 1500);
      }
    }

    // ========================
    // STATE
    // ========================
    let allUploads = [];
    let allUsers = [];
    let highlights = [];
    let currentHighlightIndex = 0;
    let videos = [];
    let isPlaying = false;
    let masterDuration = 0;
    let animFrameId = null;
    let focusedIndex = -1;
    let selectedExportClips = new Set();
    let expectedClips = 0;
    let currentSessionCode = null;
    let compositeJobId = null;
    let compositePollInterval = null;
    let refreshInterval = null;

    let sessionStart = 0;
    let commentSettings = { filterMode: 'all', topN: 0 };
    let sessionTotalDuration = 0;

    // ========================
    // HOST CREDENTIALS — only present when the app itself opened this
    // player for its own logged-in user (see main.js playerUrlFor). Kept
    // in memory only, never persisted. A viewer who opened a bare shared
    // link has neither, and simply never sees delete controls — the
    // server enforces host-only regardless, this is purely UI gating.
    // ========================
    let myAuthToken = null;
    let myUsername = null;
    let isHost = false;
    let selectedForDelete = new Set();
    const DELETE_WINDOW_MS = 4 * 60 * 60 * 1000;

    (function readCredentialsFromUrl() {
      const params = new URLSearchParams(window.location.search);
      myAuthToken = params.get('t') || null;
      myUsername = params.get('u') || null;
    })();

    // AI Reel is a paid-tier, logged-in feature — hide the entry point
    // entirely for unauthenticated viewers rather than let them open the
    // panel and hit the auth error inside startAiReel().
    document.addEventListener('DOMContentLoaded', function() {
      if (!myAuthToken) {
        const btn = document.getElementById('aireelOpenBtn');
        if (btn) btn.style.display = 'none';
      }
    });

    // ========================
    // LOCAL CLIPS
    // ========================
    // Maps clipId (from metadata JSON) → { mp4FileHandle, jsonFileHandle }
    // Built by scanning a user-selected folder. When a server upload's
    // metadata.clipId matches, we use a blob URL from the local file
    // instead of streaming from CDN — zero metered bandwidth.
    let localClipMap = new Map();
    // Track blob URLs so we can revoke them on clear
    let localBlobUrls = [];

    async function pickLocalFolder() {
      const btn = document.getElementById('localBtn');
      if (!window.showDirectoryPicker) {
        // Fallback: webkitdirectory file input
        const input = document.createElement('input');
        input.type = 'file';
        input.webkitdirectory = true;
        input.multiple = true;
        input.addEventListener('change', async function() {
          await scanFileList(input.files);
          applyLocalMatches();
        });
        input.click();
        return;
      }

      try {
        const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
        btn.classList.add('loaded');
        btn.textContent = '\u{1F4C2} Scanning...';
        await scanDirectoryHandle(dirHandle);
        applyLocalMatches();
        btn.textContent = '\u{1F4C2} Rescan Local';
      } catch (e) {
        if (e.name === 'AbortError') return; // user cancelled
        console.log('Local folder pick failed:', e);
        btn.textContent = '\u{1F4C2} Use Local Clips';
        btn.classList.remove('loaded');
      }
    }

    async function scanDirectoryHandle(dirHandle) {
      localClipMap.clear();
      const jsonFiles = new Map(); // name → handle
      const mp4Files = new Map();  // name → handle

      for await (const entry of dirHandle.values()) {
        if (entry.kind !== 'file') continue;
        const name = entry.name.toLowerCase();
        if (name.startsWith('highlight-') && name.endsWith('.json')) {
          jsonFiles.set(entry.name, entry);
        } else if (name.startsWith('highlight-') && name.endsWith('.mp4')) {
          mp4Files.set(entry.name, entry);
        }
      }

      for (const [jsonName, jsonHandle] of jsonFiles) {
        try {
          const file = await jsonHandle.getFile();
          const text = await file.text();
          const meta = JSON.parse(text);
          if (!meta.clipId) continue;

          // Find matching mp4: same timestamp portion of filename
          const baseName = jsonName.replace(/\.json$/, '.mp4');
          const mp4Handle = mp4Files.get(baseName);

          localClipMap.set(meta.clipId, {
            mp4Handle: mp4Handle || null,
            metadata: meta,
            jsonName: jsonName
          });
        } catch (e) {
          // Malformed JSON or read error — skip
        }
      }

      updateLocalStatusBar();
      console.log('Local scan: ' + localClipMap.size + ' clips with clipId found (' + jsonFiles.size + ' JSONs scanned)');
    }

    async function scanFileList(fileList) {
      // webkitdirectory fallback: FileList from <input>
      localClipMap.clear();
      const jsonFiles = new Map();
      const mp4Files = new Map();

      for (const file of fileList) {
        const name = file.name.toLowerCase();
        if (name.startsWith('highlight-') && name.endsWith('.json')) {
          jsonFiles.set(file.name, file);
        } else if (name.startsWith('highlight-') && name.endsWith('.mp4')) {
          mp4Files.set(file.name, file);
        }
      }

      for (const [jsonName, jsonFile] of jsonFiles) {
        try {
          const text = await jsonFile.text();
          const meta = JSON.parse(text);
          if (!meta.clipId) continue;

          const baseName = jsonName.replace(/\.json$/, '.mp4');
          const mp4File = mp4Files.get(baseName) || null;

          localClipMap.set(meta.clipId, {
            mp4File: mp4File,
            metadata: meta,
            jsonName: jsonName
          });
        } catch (e) {}
      }

      updateLocalStatusBar();
      console.log('Local scan (file input): ' + localClipMap.size + ' clips with clipId');
    }

    function updateLocalStatusBar() {
      const txt = document.getElementById('localStatusText');
      if (txt) txt.textContent = localClipMap.size > 0 ? localClipMap.size + ' clips scanned' : '';
      // Element no longer exists in the DOM — guarded above.
    }

    function clearLocalClips() {
      localClipMap.clear();
      localBlobUrls.forEach(url => { try { URL.revokeObjectURL(url); } catch(e) {} });
      localBlobUrls = [];
      const txt = document.getElementById('localStatusText');
      if (txt) txt.textContent = '';
      const lb = document.getElementById('localBtn');
      if (lb) { lb.classList.remove('loaded'); lb.textContent = '\u{1F4C2} Use Local Clips'; }

      // Revert any local sources back to CDN
      allUploads.forEach(u => {
        if (u.isLocal && u.originalVideoSrc) {
          u.videoSrc = u.originalVideoSrc;
          u.isLocal = false;
          if (u.loaded && u.element) {
            u.element.src = '';
            u.loaded = false;
          }
        }
      });

      // Rebuild current view
      if (allUploads.length > 0) {
        videos = buildVideosForHighlight(currentHighlightIndex);
        renderVideoGrid();
        renderMemberList();
      }
    }

    // After scanning local folder OR after loading session data from server,
    // match local clipIds to server uploads and swap in blob URLs.
    async function applyLocalMatches() {
      if (localClipMap.size === 0) return;
      let matched = 0;

      for (const u of allUploads) {
        if (!u.metadata || !u.metadata.clipId) continue;
        if (u.isLocal) continue; // already matched

        const local = localClipMap.get(u.metadata.clipId);
        if (!local) continue;

        // Get the mp4 as a blob URL
        let mp4File = null;
        if (local.mp4Handle && local.mp4Handle.getFile) {
          // Directory picker path (FileSystemFileHandle)
          try { mp4File = await local.mp4Handle.getFile(); } catch(e) {}
        } else if (local.mp4File) {
          // webkitdirectory path (File object)
          mp4File = local.mp4File;
        }

        if (!mp4File) continue;

        const blobUrl = URL.createObjectURL(mp4File);
        localBlobUrls.push(blobUrl);

        u.originalVideoSrc = u.videoSrc; // stash CDN URL for revert
        u.videoSrc = blobUrl;
        u.isLocal = true;

        // If already loaded with CDN source, unload so next play uses local
        if (u.loaded && u.element) {
          u.element.src = '';
          u.loaded = false;
        }

        matched++;
      }

      const txt = document.getElementById('localStatusText');
      if (txt && localClipMap.size > 0) {
        txt.textContent = matched + ' / ' + localClipMap.size + ' matched';
      }
      console.log('Local match: ' + matched + '/' + allUploads.length + ' uploads resolved locally');

      // Refresh the current view
      if (matched > 0 && allUploads.length > 0) {
        videos = buildVideosForHighlight(currentHighlightIndex);
        renderVideoGrid();
        renderMemberList();
      }
    }

    // ========================
    // HIGHLIGHT CLUSTERING
    // ========================

    function clusterHighlights() {
      const sorted = allUploads.slice().sort((a, b) => {
        const tA = (a.metadata && (a.metadata.coordinated_timestamp || a.metadata.saveTimeUTC)) || 0;
        const tB = (b.metadata && (b.metadata.coordinated_timestamp || b.metadata.saveTimeUTC)) || 0;
        return tA - tB;
      });

      const clusters = [];
      let current = null;

      for (const entry of sorted) {
        const ts = (entry.metadata && (entry.metadata.coordinated_timestamp || entry.metadata.saveTimeUTC)) || 0;
        if (!current || ts - current.timestamp > 5000) {
          current = { timestamp: ts, clips: [entry] };
          clusters.push(current);
        } else {
          current.clips.push(entry);
        }
      }
      return clusters;
    }

    function deriveAllUsers() {
      const seen = new Set();
      return allUploads.filter(u => {
        if (seen.has(u.username)) return false;
        seen.add(u.username);
        return true;
      }).map(u => u.username);
    }

    function buildVideosForHighlight(index) {
      const hl = highlights[index];
      if (!hl) return [];
      return allUsers.map(username => {
        const clip = hl.clips.find(c => c.username === username);
        return clip || {
          element: null, metadata: null, username,
          uploadId: null, videoFile: null, videoSrc: null,
          thumbnailSrc: null, offset: 0, nudgeMs: 0, volume: 80,
          isMuted: true, loaded: false, missing: true, isLocal: false
        };
      });
    }

    function computeSessionTiming() {
      let start = Infinity;
      let end = -Infinity;
      let hasData = false;

      allUploads.forEach(u => {
        if (u.metadata && u.metadata.startTimeUTC) {
          hasData = true;
          start = Math.min(start, u.metadata.startTimeUTC);
          const clipEnd = u.metadata.startTimeUTC + (u.metadata.durationMs || 180000);
          end = Math.max(end, clipEnd);
        }
      });

      if (!hasData) return null;
      return { start, end, duration: Math.max(end - start, 1) };
    }

    // ========================
    // SESSION TIMELINE RENDER
    // ========================

    function layoutTimelineBlocks() {
      const n = highlights.length;
      if (n === 0) return [];

      const LEFT_M = 0.5;
      const RIGHT_M = 0.5;
      const GAP = 1.5;
      const MIN_W = 5;
      const MAX_W = 30;
      const avail = 100 - LEFT_M - RIGHT_M;

      const timing = computeSessionTiming();

      if (n * MIN_W + (n - 1) * GAP > avail) {
        const gap = 0.8;
        const w = Math.max(2, (avail - (n - 1) * gap) / n);
        return highlights.map((_, i) => ({ left: LEFT_M + i * (w + gap), width: w }));
      }

      if (!timing) {
        const w = Math.min(MAX_W, Math.max(MIN_W, (avail - (n - 1) * GAP) / n));
        const totalW = n * w + (n - 1) * GAP;
        const startX = LEFT_M + Math.max(0, (avail - totalW) / 2);
        return highlights.map((_, i) => ({ left: startX + i * (w + GAP), width: w }));
      }

      const geo = highlights.map(hl => {
        let hlDuration = 0;
        hl.clips.forEach(clip => {
          if (clip.metadata && clip.metadata.durationMs) {
            hlDuration = Math.max(hlDuration, clip.metadata.durationMs);
          }
        });
        if (hlDuration === 0) hlDuration = 180000;

        const ts = hl.timestamp > 0 ? hl.timestamp : timing.start;
        return {
          left: LEFT_M + ((ts - timing.start) / timing.duration) * avail,
          width: (hlDuration / timing.duration) * avail
        };
      });

      geo.forEach(g => { g.width = Math.min(MAX_W, Math.max(MIN_W, g.width)); });

      const maxTotalW = avail - (n - 1) * GAP;
      let totalW = geo.reduce((s, g) => s + g.width, 0);
      for (let pass = 0; pass < 4 && totalW > maxTotalW + 0.01; pass++) {
        const shrinkable = geo.filter(g => g.width > MIN_W);
        const pool = shrinkable.reduce((s, g) => s + (g.width - MIN_W), 0);
        if (pool <= 0) break;
        const excess = totalW - maxTotalW;
        shrinkable.forEach(g => {
          g.width = Math.max(MIN_W, g.width - excess * (g.width - MIN_W) / pool);
        });
        totalW = geo.reduce((s, g) => s + g.width, 0);
      }

      let prevEnd = LEFT_M - GAP;
      geo.forEach(g => {
        g.left = Math.max(g.left, prevEnd + GAP);
        prevEnd = g.left + g.width;
      });

      let nextLeft = 100 - RIGHT_M + GAP;
      for (let i = n - 1; i >= 0; i--) {
        const g = geo[i];
        if (g.left + g.width > nextLeft - GAP) {
          g.left = nextLeft - GAP - g.width;
        }
        nextLeft = g.left;
      }

      return geo;
    }

    function renderSessionTimeline() {
      const track = document.getElementById('timelineTrack');
      track.querySelectorAll('.highlight-block').forEach(b => b.remove());
      if (highlights.length === 0) { updateNeedle(); return; }

      // Highlight switching now lives in the sidebar list (renderHighlightsColumn).
      // This single full-width, invisible block exists ONLY so the existing
      // scrub math in scrubNeedleToEvent()/updateNeedle() — which reads the
      // bounds of ".highlight-block.active" — keeps working completely
      // unchanged. It's not meant to be seen or clicked.
      const block = document.createElement('div');
      block.className = 'highlight-block active';
      block.style.left = '0%';
      block.style.width = '100%';
      block.style.background = 'transparent';
      block.style.border = 'none';
      block.style.pointerEvents = 'none';
      track.insertBefore(block, document.getElementById('timelineNeedle'));

      updateNeedle();
    }

    function updateNeedle() {
      const needle = document.getElementById('timelineNeedle');
      const track = document.getElementById('timelineTrack');
      if (!needle || !track) return;

      const activeBlock = track.querySelector('.highlight-block.active');
      if (!activeBlock) { needle.style.left = '0%'; return; }

      const blockLeft = parseFloat(activeBlock.style.left);
      const blockWidth = parseFloat(activeBlock.style.width);
      const fraction = masterDuration > 0 ? getCurrentMasterTime() / masterDuration : 0;
      needle.style.left = (blockLeft + fraction * blockWidth).toFixed(2) + '%';
    }

    let isScrubbing = false;
    let wasPlayingBeforeScrub = false;

    function scrubNeedleToEvent(event) {
      if (masterDuration <= 0) return;

      const track = document.getElementById('timelineTrack');
      const rect = track.getBoundingClientRect();
      let clickFraction = (event.clientX - rect.left) / rect.width;
      clickFraction = Math.max(0, Math.min(1, clickFraction));

      const activeBlock = track.querySelector('.highlight-block.active');
      if (!activeBlock) return;

      const blockLeft = parseFloat(activeBlock.style.left) / 100;
      const blockWidth = parseFloat(activeBlock.style.width) / 100;
      const withinFraction = Math.max(0, Math.min(1, (clickFraction - blockLeft) / blockWidth));

      const needle = document.getElementById('timelineNeedle');
      needle.style.left = (parseFloat(activeBlock.style.left) + withinFraction * parseFloat(activeBlock.style.width)).toFixed(2) + '%';
      document.getElementById('timeDisplay').textContent =
        formatTime(withinFraction * masterDuration) + ' / ' + formatTime(masterDuration);

      const primary = focusedIndex >= 0
        ? videos[focusedIndex]
        : videos.find(v => !v.missing && !v.processing && v.loaded);
      if (primary && primary.element) {
        const targetTime = withinFraction * masterDuration;
        const adjusted = targetTime - primary.offset;
        if (adjusted >= 0 && adjusted <= primary.element.duration) {
          primary.element.currentTime = adjusted;
        }
      }

      track._pendingSeek = withinFraction;
    }

    document.addEventListener('DOMContentLoaded', function() {
      const track = document.getElementById('timelineTrack');

      track.addEventListener('pointerdown', function(e) {
        if (e.target.classList.contains('highlight-block') && !e.target.classList.contains('active')) return;
        if (masterDuration <= 0) return;
        isScrubbing = true;
        wasPlayingBeforeScrub = isPlaying;
        if (isPlaying) pauseAll();
        track.setPointerCapture(e.pointerId);
        scrubNeedleToEvent(e);
      });

      track.addEventListener('pointermove', function(e) {
        if (isScrubbing) scrubNeedleToEvent(e);
      });

      track.addEventListener('pointerup', function(e) {
        if (!isScrubbing) return;
        isScrubbing = false;
        try { track.releasePointerCapture(e.pointerId); } catch (err) {}

        if (track._pendingSeek !== undefined) {
          seekToFraction(track._pendingSeek);
          delete track._pendingSeek;
        }

        if (wasPlayingBeforeScrub) playAll();
      });
    });

    function seekToFraction(fraction) {
      const targetTime = fraction * masterDuration;
      videos.forEach(v => {
        if (v.missing || v.processing || !v.loaded) return;
        const adjustedTime = targetTime - v.offset;
        if (adjustedTime < 0) {
          v.element.currentTime = 0;
          v.element.pause();
        } else if (adjustedTime > v.element.duration) {
          v.element.currentTime = Math.max(0, v.element.duration - 0.05);
          v.element.pause();
        } else {
          v.element.currentTime = adjustedTime;
          if (isPlaying) v.element.play().catch(() => {});
        }
      });
    }

    // ========================
    // HIGHLIGHT SWITCHING
    // ========================

    function switchHighlight(index) {
      if (index < 0 || index >= highlights.length) return;
      pauseAll();

      currentHighlightIndex = index;
      videos = buildVideosForHighlight(index);
      focusedIndex = -1;

      calculateOffsets();

      masterDuration = 0;
      videos.forEach(v => {
        if (!v.missing && !v.processing && v.loaded && v.element) {
          const dur = (v.element.duration || 0) + (v.offset || 0);
          if (dur > masterDuration) masterDuration = dur;
        }
      });

      const hasLoaded = videos.some(v => !v.missing && !v.processing && v.loaded);
      if (!hasLoaded) {
        const first = videos.find(v => !v.missing && !v.processing);
        if (first) {
          const idx = videos.indexOf(first);
          loadPOV(idx, true);
        }
      }

      renderVideoGrid();
      renderMemberList();
      renderAudioControls();
      renderExportTimeline();
      updateCompositeButton();
      renderSessionTimeline();
      renderHighlightsColumn();

      document.getElementById('timeDisplay').textContent = '0:00 / ' + formatTime(masterDuration);
    }

    // ========================
    // HIGHLIGHTS SIDEBAR — vertical pill list. Click a pill to switch to
    // it (existing behavior). Hosts additionally get a select-check on
    // each pill for multi-select delete; selecting doesn't switch viewing.
    // ========================
    function clusterAgeMs(hl) {
      let earliest = Infinity;
      hl.clips.forEach(c => {
        if (c.uploadedAt) {
          const t = new Date(c.uploadedAt).getTime();
          if (isFinite(t) && t < earliest) earliest = t;
        }
      });
      if (!isFinite(earliest)) return 0; // unknown age — never locks, always selectable
      return Date.now() - earliest;
    }

    function renderHighlightsColumn() {
      const list = document.getElementById('hlPillList');
      if (!list) return;
      list.innerHTML = '';

      if (highlights.length === 0) {
        list.innerHTML = '<div class="hl-pill-empty">Highlights appear here as they\'re saved</div>';
        updateHlDeleteBar();
        return;
      }

      highlights.forEach((hl, i) => {
        const locked = clusterAgeMs(hl) >= DELETE_WINDOW_MS;

        const pill = document.createElement('div');
        pill.className = 'hl-pill' + (i === currentHighlightIndex ? ' active' : '') +
          (!locked ? ' temp' : '') + (selectedForDelete.has(i) ? ' selected-delete' : '');

        // Locked (permanent) pills are intentionally bare — plain label,
        // nothing to select since there's no action available on them.
        if (!locked) {
          const ageMs = clusterAgeMs(hl);
          const pct = Math.min(100, (ageMs / DELETE_WINDOW_MS) * 100);

          const fill = document.createElement('div');
          fill.className = 'hl-pill-fill';
          fill.style.width = pct.toFixed(1) + '%';
          pill.appendChild(fill);

          const icon = document.createElement('span');
          icon.className = 'hl-pill-lock-icon';
          icon.textContent = '🔓';
          icon.title = 'Deletable for the next ' + Math.max(0, Math.ceil((DELETE_WINDOW_MS - ageMs) / 3600000)) + 'h';
          pill.appendChild(icon);
        }

        const label = document.createElement('span');
        label.style.flex = '1';
        label.textContent = 'H' + (i + 1);
        pill.appendChild(label);

        if (isHost && !locked) {
          const check = document.createElement('div');
          check.className = 'hl-select-check';
          check.textContent = selectedForDelete.has(i) ? '✓' : '';
          check.title = selectedForDelete.has(i) ? 'Remove from selection' : 'Select for deletion';
          check.addEventListener('click', function(e) {
            e.stopPropagation();
            if (selectedForDelete.has(i)) selectedForDelete.delete(i);
            else selectedForDelete.add(i);
            renderHighlightsColumn();
          });
          pill.appendChild(check);
        }

        pill.addEventListener('click', function() { switchHighlight(i); });
        list.appendChild(pill);
      });

      updateHlDeleteBar();
    }

    function updateHlDeleteBar() {
      const bar = document.getElementById('hlDeleteBar');
      const countEl = document.getElementById('hlDelCount');
      if (!bar || !countEl) return;
      countEl.textContent = selectedForDelete.size;
      bar.classList.toggle('show', isHost && selectedForDelete.size > 0);
    }

    async function deleteSelectedHighlights() {
      if (!isHost || selectedForDelete.size === 0 || !currentSessionCode) return;

      const indices = Array.from(selectedForDelete);
      const count = indices.length;
      if (!confirm('Delete ' + count + ' highlight' + (count > 1 ? 's' : '') + '? This removes every player\'s clip for the selected moment(s) and cannot be undone.')) return;

      const btn = document.getElementById('hlDeleteBtn');
      btn.disabled = true;
      btn.textContent = 'Deleting...';

      const uploadIds = [];
      indices.forEach(i => {
        const hl = highlights[i];
        if (!hl) return;
        hl.clips.forEach(c => { if (c.uploadId) uploadIds.push(c.uploadId); });
      });

      let failed = 0;
      for (const id of uploadIds) {
        try {
          const res = await fetch('/sessions/' + currentSessionCode + '/uploads/' + id, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + myAuthToken }
          });
          if (!res.ok) failed++;
          else allUploads = allUploads.filter(u => u.uploadId !== id);
        } catch (e) { failed++; }
      }

      selectedForDelete.clear();

      allUsers = deriveAllUsers();
      highlights = clusterHighlights();
      if (currentHighlightIndex >= highlights.length) currentHighlightIndex = Math.max(0, highlights.length - 1);
      videos = buildVideosForHighlight(currentHighlightIndex);
      calculateOffsets();

      renderVideoGrid();
      renderMemberList();
      renderAudioControls();
      renderExportTimeline();
      updateCompositeButton();
      renderSessionTimeline();
      renderHighlightsColumn();

      btn.disabled = false;
      // textContent = 'Deleting...' above nuked the counter span — rebuild the
      // whole label, don't try to write into a span that no longer exists.
      btn.innerHTML = 'Delete (<span id="hlDelCount">0</span>)';
      updateHlDeleteBar();

      if (failed > 0) alert(failed + ' clip(s) failed to delete (may already be past the 4-hour window).');
    }

    function stepHighlight(dir) {
      const next = currentHighlightIndex + dir;
      if (next < 0 || next >= highlights.length) return;
      switchHighlight(next);
    }

    // ========================
    // SESSION LOADING
    // ========================

    async function loadSession() {
      const code = document.getElementById('sessionInput').value.trim().toUpperCase();
      if (!code || code.length < 4) { alert('Enter a valid session code'); return; }

      try {
        const sessionRes = await fetch('/sessions/' + code);
        if (sessionRes.status === 404) {
          showExpiredState('Session not found — it may have expired or the code is incorrect.');
          return;
        }
        if (!sessionRes.ok) { alert('Error loading session'); return; }
        const session = await sessionRes.json();

        const uploadsRes = await fetch('/sessions/' + code + '/uploads');
        const uploadsData = await uploadsRes.json();
        if (!uploadsData.uploads || uploadsData.uploads.length === 0) {
          showExpiredState('No uploads in this session yet. Clips will appear once squad members save highlights.');
          return;
        }

        allUploads = [];
        focusedIndex = -1;
        selectedExportClips.clear();
        currentSessionCode = code;
        currentHighlightIndex = 0;
        expectedClips = session.members ? session.members.length : 0;

        let hasProcessing = false;

        for (const upload of uploadsData.uploads) {
          let metadata = null;
          const metaUrl = upload.metadataUrl || (upload.metadataFile ? '/media/' + code + '/' + upload.metadataFile : null);
          if (metaUrl) {
            try {
              const metaRes = await fetch(metaUrl);
              if (metaRes.ok) metadata = await metaRes.json();
            } catch (e) {}
          }

          const isProcessing = !upload.videoUrl;
          if (isProcessing) hasProcessing = true;

          const video = document.createElement('video');
          video.preload = 'none';
          video.muted = true;
          video.playsInline = true;

          allUploads.push({
            element: video, metadata, username: upload.username,
            uploadId: upload.id, videoFile: upload.videoFile,
            videoSrc: upload.videoUrl || null,
            thumbnailSrc: upload.thumbnailUrl || (upload.thumbnailFile ? '/media/' + code + '/' + upload.thumbnailFile : null),
            offset: 0, nudgeMs: 0, volume: 40, isMuted: true, loaded: false,
            missing: false, processing: isProcessing,
            isLocal: false, originalVideoSrc: null,
            uploadedAt: upload.uploadedAt || null
          });
        }

        // Apply local clips if a folder was already scanned
        await applyLocalMatches();

        allUsers = deriveAllUsers();
        highlights = clusterHighlights();
        videos = buildVideosForHighlight(0);

        const firstLoadable = videos.find(v => !v.missing && !v.processing);
        if (firstLoadable) await loadPOV(videos.indexOf(firstLoadable), true);

        calculateOffsets();

        masterDuration = 0;
        videos.forEach(v => {
          if (!v.missing && !v.processing && v.loaded && v.element) {
            const dur = (v.element.duration || 0) + (v.offset || 0);
            if (dur > masterDuration) masterDuration = dur;
          }
        });

        isHost = !!(myUsername && session.createdBy &&
        myUsername.toLowerCase() === session.createdBy.toLowerCase());
        selectedForDelete.clear();

        renderVideoGrid();
        renderMemberList();
        renderAudioControls();
        renderExportTimeline();
        updateCompositeButton();
        renderSessionTimeline();
        renderHighlightsColumn();
        showShareLink(code);

        document.getElementById('sessionTimeline').style.display = 'flex';
        document.getElementById('rightPanel').style.display = 'flex';
        document.getElementById('highlightsColumn').style.display = 'flex';

        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(refreshUploads, hasProcessing ? 10000 : 45000);

        console.log('Loaded ' + code + ' — ' + allUploads.length + ' uploads, ' + highlights.length + ' highlight(s), ' + allUsers.length + ' user(s)' + (hasProcessing ? ' (some still processing)' : ''));
      } catch (err) {
        alert('Error loading session: ' + err.message);
        console.error(err);
      }
    }

    function showExpiredState(message) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';
      const state = document.createElement('div');
      state.className = 'empty-state';
      state.innerHTML = '<div class="monkey">&#x1F648;</div><div class="expired-msg">' + message + '</div>';
      grid.appendChild(state);

      document.getElementById('sessionTimeline').style.display = 'none';
      document.getElementById('rightPanel').style.display = 'none';
      document.getElementById('highlightsColumn').style.display = 'none';
      document.getElementById('selectionBar').style.display = 'none';
      const shareBtn = document.getElementById('shareBtn');
      if (shareBtn) shareBtn.style.display = 'none';
    }

    // ========================
    // AUTO-REFRESH
    // ========================

    async function refreshUploads() {
      if (!currentSessionCode) return;
      try {
        const uploadsRes = await fetch('/sessions/' + currentSessionCode + '/uploads');

        if (uploadsRes.status === 404) {
          if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
          showExpiredState('This session has expired. Videos are no longer available.');
          return;
        }

        if (!uploadsRes.ok) return;
        const uploadsData = await uploadsRes.json();
        if (!uploadsData.uploads) return;

        const existingIds = new Set(allUploads.map(u => u.uploadId));
        const newRaw = uploadsData.uploads.filter(u => !existingIds.has(u.id));
        let hadProcessing = false;
        let stillProcessing = false;

        for (const upload of uploadsData.uploads) {
          if (!existingIds.has(upload.id)) continue;
          const existing = allUploads.find(u => u.uploadId === upload.id);
          if (!existing) continue;

          if (existing.processing) hadProcessing = true;

          if (upload.videoUrl && existing.processing) {
            existing.processing = false;
            // Only use CDN if not already matched locally
            if (!existing.isLocal) {
              existing.videoSrc = upload.videoUrl;
            }
            if (upload.thumbnailUrl) existing.thumbnailSrc = upload.thumbnailUrl;
            console.log('Upload ready:', upload.username, upload.id);
          } else if (upload.videoUrl && !existing.isLocal && existing.videoSrc && !existing.videoSrc.startsWith('https://peakbu-media')) {
            existing.videoSrc = upload.videoUrl;
            if (upload.thumbnailUrl) existing.thumbnailSrc = upload.thumbnailUrl;
            if (existing.element && existing.element.src && !existing.element.src.startsWith('https://peakbu-media')) {
              existing.element.src = '';
              existing.loaded = false;
            }
            console.log('Updated to CDN URL:', upload.id);
          }

          if (!upload.videoUrl) stillProcessing = true;
        }

        if (newRaw.length > 0) {
          for (const upload of newRaw) {
            let metadata = null;
            const metaUrl = upload.metadataUrl || (upload.metadataFile ? '/media/' + currentSessionCode + '/' + upload.metadataFile : null);
            if (metaUrl) {
              try {
                const metaRes = await fetch(metaUrl);
                if (metaRes.ok) metadata = await metaRes.json();
              } catch (e) {}
            }

            const isProcessing = !upload.videoUrl;
            if (isProcessing) stillProcessing = true;

            const video = document.createElement('video');
            video.preload = 'none';
            video.muted = true;
            video.playsInline = true;
            allUploads.push({
              element: video, metadata, username: upload.username,
              uploadId: upload.id, videoFile: upload.videoFile,
              videoSrc: upload.videoUrl || null,
              thumbnailSrc: upload.thumbnailUrl || (upload.thumbnailFile ? '/media/' + currentSessionCode + '/' + upload.thumbnailFile : null),
              offset: 0, nudgeMs: 0, volume: 40, isMuted: true, loaded: false,
              missing: false, processing: isProcessing,
              isLocal: false, originalVideoSrc: null,
              uploadedAt: upload.uploadedAt || null
            });
          }

          // Try matching new uploads against local clips
          await applyLocalMatches();
        }

        if (stillProcessing && refreshInterval) {
          clearInterval(refreshInterval);
          refreshInterval = setInterval(refreshUploads, 10000);
        } else if (!stillProcessing && hadProcessing && refreshInterval) {
          clearInterval(refreshInterval);
          refreshInterval = setInterval(refreshUploads, 45000);
        }

        if (newRaw.length > 0 || hadProcessing) {
          allUsers = deriveAllUsers();
          highlights = clusterHighlights();
          videos = buildVideosForHighlight(currentHighlightIndex);
          calculateOffsets();

          renderVideoGrid();
          renderMemberList();
          renderAudioControls();
          renderExportTimeline();
          updateCompositeButton();
          renderSessionTimeline();
          renderHighlightsColumn();
        }

        if (newRaw.length > 0) console.log('Refresh: added ' + newRaw.length + ' upload(s)');
      } catch (err) {
        console.log('Refresh error:', err);
      }
    }

    // ========================
    // LAZY LOAD POV
    // ========================

    async function loadPOV(index, isFirst = false) {
      const v = videos[index];
      if (!v || v.missing || v.processing || v.loaded) return;
      v.loaded = true;

      const container = document.getElementById('pov-container-' + index);
      if (container) {
        const placeholder = container.querySelector('.pov-placeholder, .pov-loading');
        if (placeholder) { placeholder.className = 'pov-loading'; placeholder.textContent = 'Loading...'; }
      }

      v.element.src = v.videoSrc;
      v.element.preload = 'auto';

      await new Promise(resolve => {
        if (v.element.readyState >= 1) { resolve(); return; }
        v.element.addEventListener('loadedmetadata', resolve, { once: true });
        v.element.addEventListener('error', resolve, { once: true });
      });

      if (isFirst) {
        v.isMuted = false;
        v.element.muted = false;
        v.element.volume = v.volume / 100;
      } else {
        const masterTime = getCurrentMasterTime();
        const adjustedTime = masterTime - v.offset;
        if (adjustedTime > 0 && adjustedTime <= v.element.duration) v.element.currentTime = adjustedTime;
        if (isPlaying) v.element.play().catch(() => {});
      }

      const thisDuration = (v.element.duration || 0) + v.offset;
      if (thisDuration > masterDuration) masterDuration = thisDuration;

      renderPOVContainer(index);
      renderMemberList();
      renderAudioControls();
    }

    function getCurrentMasterTime() {
      const loaded = videos.filter(v => !v.missing && !v.processing && v.loaded);
      if (!loaded.length) return 0;
      // Clock hands off to the next still-playing POV when the current one
      // ends or gets parked — a frozen master time made the drift corrector
      // snap longer POVs back to it forever.
      const clock = loaded.find(v => !v.element.ended && !v.element.paused)
                 || loaded.find(v => !v.element.ended)
                 || loaded[0];
      return (clock.element.currentTime || 0) + (clock.offset || 0);
    }

    function calculateOffsets() {
      let earliestStart = Infinity;
      let hasMetadata = false;
      videos.forEach(v => {
        if (!v.missing && !v.processing && v.metadata && v.metadata.version >= 2 && v.metadata.startTimeUTC) {
          earliestStart = Math.min(earliestStart, v.metadata.startTimeUTC);
          hasMetadata = true;
        }
      });
      if (!hasMetadata) return;
      videos.forEach(v => {
        if (!v.missing && !v.processing && v.metadata && v.metadata.version >= 2 && v.metadata.startTimeUTC) {
          v.offset = (v.metadata.startTimeUTC - earliestStart) / 1000;
          if (v.nudgeMs) v.offset += v.nudgeMs / 1000;
        }
      });
    }

    // VIDEO GRID

    function renderVideoGrid() {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';

      if (focusedIndex >= 0) {
        grid.className = 'video-grid focused-mode';

        const mainContainer = buildPOVContainer(focusedIndex, true);
        mainContainer.className = 'focused-main';
        mainContainer.addEventListener('click', () => { focusedIndex = -1; renderVideoGrid(); highlightActiveMember(); });
        grid.appendChild(mainContainer);

        if (videos.length > 1) {
          const sidebar = document.createElement('div');
          sidebar.className = 'focused-sidebar';
          videos.forEach((v, i) => {
            if (i === focusedIndex) return;
            const container = buildPOVContainer(i, false);
            if (!v.missing && !v.processing) container.addEventListener('click', () => focusOnVideo(i));
            sidebar.appendChild(container);
          });
          grid.appendChild(sidebar);
        }
      } else {
        const count = videos.length;
        let gridClass = 'grid-' + Math.min(count, 9);
        if (count >= 10) gridClass = 'grid-10plus';
        grid.className = 'video-grid ' + gridClass;

        videos.forEach((v, i) => {
          const container = buildPOVContainer(i, false);
          if (!v.missing && !v.processing) container.addEventListener('click', () => focusOnVideo(i));
          grid.appendChild(container);
