<!DOCTYPE html>
<html>
<head>
  <title>Peak-Abu – Multi-POV Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a1611;
      color: #c8d6cd;
      font-family: 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #12251a;
      border-bottom: 2px solid #1d9e75;
      flex-shrink: 0;
      height: 50px;
    }

    .header h1 { color: #39d3a0; font-size: 20px; }

    .join-bar { display: flex; gap: 8px; align-items: center; }

    .join-bar input {
      padding: 6px 12px;
      background: #0c1c14;
      color: #e8f5ec;
      border: 1px solid #24402e;
      border-radius: 6px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 3px;
      width: 130px;
      text-align: center;
    }
    .join-bar input:focus { border-color: #39d3a0; outline: none; }

    .join-bar input::placeholder { color: #45604f; text-transform: none; letter-spacing: normal; }

    .btn {
      padding: 6px 16px;
      background: #1d9e75;
      color: #04140d;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #23b686; }
    .btn:disabled { background: #14291d; color: #45604f; cursor: not-allowed; }
    .btn-small { padding: 4px 10px; font-size: 12px; }
    .btn-secondary { background: #14291d; border: 1px solid #2a4636; color: #8fbfa3; font-weight: 500; }
    .btn-secondary:hover { background: #16321f; border-color: #39d3a0; color: #39d3a0; }

    .btn-paste {
      padding: 6px 10px;
      background: #0c1c14;
      color: #39d3a0;
      border: 1px solid #39d3a0;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-paste:hover { background: #16321f; }
    .btn-paste.pasted { background: #4fe0b0; border-color: #4fe0b0; color: #04140d; }

    .main-layout { display: flex; flex: 1; min-height: 0; }

    .video-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 2px solid #12251a;
    }

    .video-grid {
      flex: 1;
      display: grid;
      gap: 3px;
      padding: 3px;
      overflow-y: auto;
      min-height: 0;
    }

    .video-grid::-webkit-scrollbar { width: 6px; }
    .video-grid::-webkit-scrollbar-track { background: #04140d; }
    .video-grid::-webkit-scrollbar-thumb { background: #24402e; border-radius: 3px; }

    .grid-1 { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
    .grid-5, .grid-6 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-7, .grid-8, .grid-9 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-10plus { grid-template-columns: 1fr 1fr 1fr 1fr; }

    .video-grid.focused-mode { display: flex; flex-direction: column; gap: 0; padding: 0; }

    .focused-main { flex: 1; min-height: 60%; position: relative; background: #000; }
    .focused-main video { width: 100%; height: 100%; object-fit: contain; }

    .focused-sidebar {
      height: 25%;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 3px;
      padding: 3px;
      background: #04140d;
      flex-shrink: 0;
    }

    .focused-sidebar::-webkit-scrollbar { height: 6px; }
    .focused-sidebar::-webkit-scrollbar-track { background: #04140d; }
    .focused-sidebar::-webkit-scrollbar-thumb { background: #24402e; border-radius: 3px; }

    .focused-sidebar .pov-container { min-width: 180px; height: 100%; cursor: pointer; }

    .pov-container {
      position: relative;
      background: #04140d;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }
    .pov-container:hover { border-color: #39d3a0; }
    .pov-container.active { border-color: #39d3a0; }

    .pov-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    .pov-label {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(57, 211, 160, 0.9);
      color: #04140d;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      z-index: 2;
      pointer-events: none;
    }

    .pov-placeholder {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a1611;
      color: #45604f;
      font-size: 13px;
      gap: 8px;
      cursor: pointer;
    }

    .pov-placeholder .play-icon { font-size: 32px; color: #39d3a0; opacity: 0.6; }
    .pov-placeholder .load-hint { font-size: 11px; color: #3a5244; }

    .pov-loading {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a1611;
      color: #39d3a0;
      font-size: 13px;
    }

    .pov-missing {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a1611;
      color: #45604f;
      font-size: 13px;
      gap: 8px;
    }
    .pov-missing .monkey { font-size: 32px; }
    .pov-missing .missing-name { color: #39d3a0; font-weight: bold; font-size: 12px; }
    .pov-missing .missing-text { font-size: 11px; color: #3a5244; }

    .pov-processing {
      width: 100%;
      height: 100%;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a1611;
      color: #d8a838;
      font-size: 13px;
      gap: 8px;
    }
    .pov-processing .spinner { font-size: 28px; animation: spin 2s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .pov-processing .proc-name { color: #39d3a0; font-weight: bold; font-size: 12px; }
    .pov-processing .proc-text { font-size: 11px; color: #7a9686; }

    /* ========================
       LOCAL CLIPS
    ======================== */
    .local-badge {
      position: absolute;
      top: 6px;
      right: 36px;
      background: rgba(79, 224, 176, 0.85);
      color: #04140d;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      z-index: 3;
      pointer-events: none;
    }

    .local-status-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      background: #0c1c14;
      border: 1px solid #24402e;
      border-radius: 6px;
      font-size: 11px;
      color: #8fbfa3;
      margin-left: 8px;
      white-space: nowrap;
    }
    .local-status-bar.active { display: flex; }
    .local-status-bar .local-count { color: #4fe0b0; font-weight: 700; }
    .local-status-bar .local-dismiss {
      background: none; border: none; color: #5f7a6a; cursor: pointer;
      font-size: 14px; padding: 0 2px; line-height: 1;
    }
    .local-status-bar .local-dismiss:hover { color: #f0857a; }

    .btn-local {
      padding: 6px 10px;
      background: #0c1c14;
      color: #8fbfa3;
      border: 1px solid #2a4636;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-local:hover { background: #16321f; border-color: #39d3a0; color: #39d3a0; }
    .btn-local.loaded { background: #16321f; border-color: #4fe0b0; color: #4fe0b0; }

    /* ========================
       SESSION TIMELINE
    ======================== */
    .session-timeline {
      flex-shrink: 0;
      background: #12251a;
      border-top: 1px solid #1e3527;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .timeline-top-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-display { font-size: 12px; color: #8fbfa3; min-width: 90px; text-align: center; }

    .timeline-track-wrap { flex: 1; }

    .timeline-track {
      position: relative;
      height: 36px;
      background: #0a1611;
      border-radius: 6px;
      border: 1px solid #1e3527;
      cursor: pointer;
      overflow: hidden;
      user-select: none;
    }

    .highlight-block {
      position: absolute;
      top: 4px;
      height: calc(100% - 8px);
      background: #0c1c14;
      border: 1px solid #24402e;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: #39d3a0;
      cursor: pointer;
      transition: background 0.15s;
      min-width: 28px;
      overflow: hidden;
      white-space: nowrap;
    }

    .highlight-block:hover { background: #16321f; border-color: #39d3a0; }
    .highlight-block.active { background: #39d3a0; color: #04140d; border-color: #4fe0b0; }

    .timeline-needle {
      position: absolute;
      top: 0;
      width: 2px;
      height: 100%;
      background: rgba(255,255,255,0.9);
      pointer-events: none;
      z-index: 10;
      transform: translateX(-1px);
    }

    .timeline-track:hover .timeline-needle {
      width: 4px;
      transform: translateX(-2px);
      background: #39d3a0;
      transition: width 0.15s, background 0.15s;
    }

    .timeline-track:hover {
      height: 44px;
      margin-top: -4px;
      margin-bottom: -4px;
      transition: height 0.15s;
    }

    /* ========================
       RIGHT PANEL
    ======================== */
    .right-panel {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #0f2318;
      border-left: 2px solid #12251a;
    }

    .panel-section { padding: 10px; }

    .panel-section h3 {
      color: #39d3a0;
      font-size: 13px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .members-section { flex: 1; overflow-y: auto; border-bottom: 1px solid #1e3527; }
    .members-section::-webkit-scrollbar { width: 5px; }
    .members-section::-webkit-scrollbar-track { background: #04140d; }
    .members-section::-webkit-scrollbar-thumb { background: #24402e; border-radius: 3px; }

    .audio-section { max-height: 220px; overflow-y: auto; border-top: 1px solid #1e3527; }
    .audio-section::-webkit-scrollbar { width: 5px; }
    .audio-section::-webkit-scrollbar-track { background: #04140d; }
    .audio-section::-webkit-scrollbar-thumb { background: #24402e; border-radius: 3px; }

    .panel-row { padding: 2px 8px; }

    .panel-row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 6px 0;
      font-size: 13px;
    }
    .panel-row-header:hover { color: #39d3a0; }
    .panel-row-header.focused { color: #39d3a0; }

    .panel-row-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .member-dot { width: 8px; height: 8px; border-radius: 50%; background: #4fe0b0; flex-shrink: 0; }
    .member-dot.unloaded { background: #45604f; }
    .member-dot.missing { background: #f0857a; }
    .member-dot.processing { background: #d8a838; }
    .member-dot.local { background: #4fe0b0; box-shadow: 0 0 4px #4fe0b0; }

    .panel-row-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .audio-arrow { font-size: 10px; transition: transform 0.2s; color: #7a9686; flex-shrink: 0; }
    .audio-arrow.open { transform: rotate(90deg); }

    .panel-row-dropdown { display: none; padding: 4px 0 6px 16px; }
    .panel-row-dropdown.open { display: block; }

    .player-hl-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      font-size: 11px;
      color: #8fbfa3;
      cursor: default;
    }
    .player-hl-item.has-clip { cursor: pointer; }
    .player-hl-item.has-clip:hover { color: #39d3a0; }
    .player-hl-item.current-hl { color: #39d3a0; font-weight: bold; }

    .hl-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .audio-control-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #8fbfa3;
      margin-bottom: 4px;
    }
    .audio-control-row label { width: 50px; flex-shrink: 0; }
    .audio-control-row input[type="range"] { flex: 1; accent-color: #39d3a0; height: 4px; }

    .mute-btn {
      background: none;
      border: 1px solid #45604f;
      color: #8fbfa3;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
    }
    .mute-btn:hover { border-color: #39d3a0; color: #39d3a0; }
    .mute-btn.muted { background: #39d3a0; color: #04140d; border-color: #39d3a0; }

    /* ========================
       EXPORT BAR
    ======================== */
    .export-bar {
      min-height: 140px;
      flex-shrink: 0;
      background: #0f2318;
      border-top: 2px solid #1d9e75;
      display: flex;
      flex-direction: column;
    }

    .export-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid #1e3527;
    }

    .export-header h3 { color: #39d3a0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    .export-actions { display: flex; gap: 8px; }

    .export-timeline {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 8px 16px;
      overflow-x: auto;
      gap: 6px;
    }

    .export-timeline::-webkit-scrollbar { height: 6px; }
    .export-timeline::-webkit-scrollbar-track { background: #04140d; }
    .export-timeline::-webkit-scrollbar-thumb { background: #24402e; border-radius: 3px; }

    .export-hl-label {
      flex-shrink: 0;
      align-self: stretch;
      display: flex;
      align-items: center;
      padding: 0 8px 0 10px;
      font-size: 11px;
      font-weight: bold;
      color: #7a9686;
      border-left: 2px solid #24402e;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .export-hl-label:hover { color: #39d3a0; }
    .export-hl-label.current { color: #39d3a0; border-left-color: #39d3a0; }

    .export-clip {
      min-width: 120px;
      height: 70px;
      background: #0c1c14;
      border: 2px solid #24402e;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s;
      padding: 4px 8px;
      text-align: center;
      user-select: none;
      position: relative;
    }
    .export-clip::after {
      content: '';
      position: absolute;
      top: 6px; right: 6px;
      width: 14px; height: 14px;
      border: 2px solid #24402e;
      border-radius: 3px;
      background: transparent;
      transition: all 0.15s;
    }
    .export-clip:hover { border-color: #39d3a0; }
    .export-clip:hover::after { border-color: #39d3a0; }
    .export-clip.selected { border-color: #39d3a0; background: #16321f; }
    .export-clip.selected::after {
      background: #39d3a0;
      border-color: #39d3a0;
      content: '✓';
      color: #04140d;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .export-clip.disabled { opacity: 0.5; cursor: not-allowed; }
    .export-clip.disabled:hover { border-color: #24402e; }

    .composite-section {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #1e3527;
      flex-shrink: 0;
    }

    .composite-status { font-size: 12px; color: #7a9686; flex: 1; }
    .composite-status.ready { color: #4fe0b0; }
    .composite-status.processing { color: #d8a838; }
    .composite-status.failed { color: #f0857a; }

    .progress-bar { width: 140px; height: 6px; background: #1e3527; border-radius: 3px; overflow: hidden; flex-shrink: 0; }

    .progress-fill {
      height: 100%;
      background: #d8a838;
      border-radius: 3px;
      width: 0%;
      transition: width 0.3s;
      animation: indeterminate 1.5s infinite;
    }

    @keyframes indeterminate {
      0% { width: 20%; margin-left: 0%; }
      50% { width: 40%; margin-left: 40%; }
      100% { width: 20%; margin-left: 80%; }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #3a5244;
      font-size: 16px;
      gap: 10px;
    }
    .empty-state .monkey { font-size: 48px; }
    .empty-state .expired-msg { color: #d8a838; font-size: 14px; }

    .share-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: #0c1c14;
      border: 1px solid #1e3527;
      border-radius: 6px;
      margin-left: 12px;
      max-width: 320px;
    }

    .share-url {
      flex: 1;
      font-size: 12px;
      color: #8fbfa3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
    }

    /* Export select checkbox on POV tiles */
    .pov-export-check {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 26px;
      height: 26px;
      background: rgba(18, 37, 26, 0.85);
      border: 2px solid #45604f;
      border-radius: 6px;
      color: #7a9686;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: all 0.15s;
      line-height: 1;
    }
    .pov-export-check:hover { border-color: #39d3a0; color: #39d3a0; background: rgba(18, 37, 26, 0.95); }
    .pov-export-check.selected { background: #39d3a0; border-color: #39d3a0; color: #04140d; }

    .pov-nudge-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 28px;
      background: rgba(0, 0, 0, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }
    .pov-container:hover .pov-nudge-bar,
    .pov-container.active .pov-nudge-bar { opacity: 1; pointer-events: auto; }
    .nudge-btn {
      background: rgba(57, 211, 160, 0.15);
      border: 1px solid #39d3a0;
      color: #39d3a0;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.1s;
    }
    .nudge-btn:hover { background: rgba(57, 211, 160, 0.4); }
    .nudge-readout {
      font-size: 11px;
      color: #c8d6cd;
      min-width: 52px;
      text-align: center;
      font-family: 'Consolas', 'Courier New', monospace;
      letter-spacing: 0.5px;
    }
    .nudge-readout.nonzero { color: #39d3a0; }

    .btn-copy {
      background: none;
      border: 1px solid #39d3a0;
      color: #39d3a0;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-copy:hover { background: #39d3a0; color: #04140d; }
    .btn-copy.copied { background: #4fe0b0; border-color: #4fe0b0; color: #04140d; }
  </style>
</head>
<body>

  <div class="header">
    <h1>&#x1F648; Peak-Abu Player</h1>
    <div style="display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;">
      <div class="share-bar" id="shareBar" style="display:none;">
        <span class="share-url" id="shareUrl"></span>
        <button class="btn-copy" id="copyBtn" onclick="copyShareLink()">&#x1F4CB; Copy Link</button>
      </div>
      <!-- LOCAL CLIPS STATUS -->
      <div class="local-status-bar" id="localStatusBar">
        &#x1F4C2; <span class="local-count" id="localMatchCount">0</span> local &middot;
        <span id="localTotalCount">0</span> scanned
        <button class="local-dismiss" onclick="clearLocalClips()" title="Clear local clips">&#x2715;</button>
      </div>
      <button class="btn-local" id="localBtn" onclick="pickLocalFolder()" title="Load clips from your PeakAbu folder to skip CDN downloads">&#x1F4C2; Use Local Clips</button>
      <div class="join-bar">
        <input type="text" id="sessionInput" placeholder="Session code" maxlength="6" />
        <button class="btn-paste" id="pasteBtn" onclick="pasteAndLoad()" title="Paste session code from clipboard">&#x1F4CB; Paste</button>
        <button class="btn" onclick="loadSession()">Load Session</button>

  <div class="main-layout">

        <button class="btn btn-small btn-secondary" onclick="deselectAllClips()">Deselect All</button>

      <div class="composite-section" id="aireelSection" style="display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px;">

         <label style="font-size:11px;color:#7a9686;display:block;">Length</label>

         <label style="font-size:11px;color:#7a9686;display:block;">Game</label>

         <input type="text" id="aireelStyle" placeholder="e.g. keep clutches long, cut fast on kills" style="background:#0c1c14;color:#c8d6cd;border:1px solid #24402e;border-radius:4px;padding:4px 8px;width:100%;" />
       </div>

       <div id="aireelStatus" style="width:100%;font-size:12px;color:#7a9686;margin-top:4px;"></div>
       <div id="aireelReport" style="width:100%;font-size:12px;color:#8fbfa3;background:#0a1611;border-left:2px solid #39d3a0;padding:8px 12px;display:none;white-space:pre-wrap;"></div>
